[package]
name = "nym-vpn-api-client"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
backon.workspace = true
base64-url.workspace = true
bip39 = { workspace = true, features = ["zeroize"] }
bs58.workspace = true
hex.workspace = true
itertools.workspace = true
nym-bridges-types = { workspace = true, features = ["serde"] }
nym-common.workspace = true
nym-compact-ecash.workspace = true
nym-config.workspace = true
nym-contracts-common.workspace = true
nym-credential-proxy-requests.workspace = true
nym-credentials.workspace = true
nym-crypto = { workspace = true, features = ["asymmetric", "stream_cipher"] }
nym-http-api-client.workspace = true
nym-network-defaults = { workspace = true, optional = true }
nym-validator-client.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sha256.workspace = true
strum.workspace = true
strum_macros.workspace = true
thiserror.workspace = true
tokio.workspace = true
time = { workspace = true, features = [
    "macros",
    "serde-human-readable",
    "serde-well-known",
] }
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
bip39 = { workspace = true, features = ["zeroize"] }
nym-crypto = { workspace = true, features = ["asymmetric", "stream_cipher"] }
nym-http-api-client.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-test.workspace = true
wiremock.workspace = true

[features]
default = ["network-defaults"]
network-defaults = [
    "dep:nym-network-defaults",
    "nym-http-api-client/network-defaults",
]
