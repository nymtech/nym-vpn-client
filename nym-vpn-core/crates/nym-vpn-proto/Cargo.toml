[package]
name = "nym-vpn-proto"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
prost-types.workspace = true
prost.workspace = true
tonic-prost.workspace = true
tonic.workspace = true
tokio-stream = { workspace = true, optional = true, features = ["net"] }
tower = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
time = { workspace = true, optional = true, features = ["parsing"] }

nym-vpn-lib-types = { workspace = true, optional = true }
nym-ipc = { workspace = true, optional = true }

[build-dependencies]
tonic-prost-build.workspace = true

[features]
default = []
conversions = ["dep:nym-vpn-lib-types", "dep:thiserror", "dep:time"]
rpc_client = [
    "conversions",
    "dep:nym-vpn-lib-types",
    "dep:nym-ipc",
    "dep:thiserror",
    "dep:tokio-stream",
    "dep:tower",
    "dep:time",
]

[package.metadata.cargo-machete]
ignored = ["tonic-prost", "tonic-prost-build"]
