syntax = "proto3";

package nym_vpn_service;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

message IpAddr {
  oneof ip_addr {
    fixed32 v4 = 1;
    bytes v6 = 2;
  }
}

message SocketAddr {
  IpAddr addr = 1;
  uint32 port = 2;
}

// Represents the identity of a gateway
message GatewayId {
  string id = 1;
}

// Represents a nym-address of the form id.enc@gateway
message Address {
  string nym_address = 1;
  string gateway_id = 2;
}

enum AsnKind {
  RESIDENTIAL = 0;
  OTHER = 1;
}

message Asn {
  string asn = 1;
  string name = 2;
  AsnKind kind = 3;
}

message Country {
  string two_letter_iso_country_code = 1;
}

message Region {
  string region = 1;
}

message Location {
  string two_letter_iso_country_code = 1;
  double latitude = 2;
  double longitude = 3;
  string city = 4;
  string region = 5;
  optional Asn asn = 6;
}

message GatewayLightInfo {
  string id = 1;
  optional string country_code = 2;
}

message EntryNode {
  oneof entry_node_enum {
    GatewayId gateway = 1;
    Country country = 2;
    Region region = 3;
    google.protobuf.Empty random = 4;
  }
}

message ExitNode {
  oneof exit_node_enum {
    Address address = 1;
    GatewayId gateway = 2;
    Country country = 3;
    Region region = 4;
    google.protobuf.Empty random = 5;
  }
}

message MixConnectedStateDetails {
  Address nym_address = 1;
  Address exit_ipr = 2;
  string ipv4 = 3;
  optional string ipv6 = 4;
}

message WgConnectedStateDetails {
  string entry_ipv4 = 1;
  string exit_ipv4 = 2;
}

message ConnectedStateDetails {
  oneof connected_state_details {
    MixConnectedStateDetails mix = 1;
    WgConnectedStateDetails wg = 2;
  }
}

message Dns {
  optional string ip = 1;
}

message IpAddrList {
  repeated IpAddr ips = 1;
}

message StringList {
  repeated string values = 1;
}

message ApiUrl {
  string url = 1;
  repeated string front_hosts = 2;
}

// Inspired by
// https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/User-Agent
// Forward slashes '/' are not valid
message UserAgent {
  // Example:
  //    nym-vpn-app
  //    nym-vpnd
  string application = 1;
  // Format: version[-optional] [(daemon version[-optional])]
  // Example:
  //    0.1.8
  //    0.1.8-debug (0.1.6)
  //    0.2.1-fdroid
  string version = 2;
  // Format: OS; OS version; CPU
  // Example:
  //    Windows NT 6.1; Win64; x64
  //    Macintosh; Intel Mac OS X 14.6.1
  //    iPad; U; CPU OS 3_2 like Mac OS X; en-us
  string platform = 3;
  // Format: git hash [(daemon git hash)]
  // Commit hash should be at least 7 characters long
  // Example:
  //    4h9fk59 (4kdufle)
  //    4h9fk59
  string git_commit = 4;
}

message DenomDetails {
  string base = 1;
  string display = 2;
  uint32 display_exponent = 3;
}

message ChainDetails {
  string bech32_account_prefix = 1;
  DenomDetails mix_denom = 2;
  DenomDetails stake_denom = 3;
}

message NymContracts {
  optional string mixnet_contract_address = 1;
  optional string vesting_contract_address = 2;
  optional string performance_contract_address = 3;
  optional string ecash_contract_address = 4;
  optional string group_contract_address = 5;
  optional string multisig_contract_address = 6;
  optional string coconut_dkg_contract_address = 7;
}

message NymNetworkDetails {
  string network_name = 1;
  ChainDetails chain_details = 2;
  repeated ValidatorDetails endpoints = 3;
  NymContracts contracts = 4;
  optional string nym_vpn_api_url = 5;
  repeated ApiUrl nym_api_urls = 6;
  repeated ApiUrl nym_vpn_api_urls = 7;
}

message NymVpnNetworkDetails {
  repeated ApiUrl nym_vpn_api_urls = 2;
}

message AccountManagement {
  string sign_up = 1;
  string sign_in = 2;
  optional string account = 3;
}

message ValidatorDetails {
  string nyxd_url = 1;
  string websocket_url = 2;
  string api_url = 3;
}

message InfoResponse {
  string version = 1;
  google.protobuf.Timestamp build_timestamp = 2;
  string triple = 3;
  string platform = 4;
  string git_commit = 5;
  NymNetworkDetails nym_network = 6;
  NymVpnNetworkDetails nym_vpn_network = 7;
}

message SystemMessage {
  string name = 1;
  string message = 2;
  map<string, string> properties = 3;
}

message NetworkCompatibility {
  string core = 1;
  string ios = 2;
  string macos = 3;
  string tauri = 4;
  string android = 5;
}

// no point in importing entire cosmos-sdk protobuf definition for just this one type
message Coin {
  string denom = 1;
  // u128 value represented as a string
  string amount = 2;
}

message GetConfigResponse {
  VpnServiceConfig config = 1;
}

message GetSystemMessagesResponse {
  repeated SystemMessage messages = 1;
}

message GetNetworkCompatibilityResponse {
  optional NetworkCompatibility network_compatibility = 1;
}

message GetFeatureFlagsResponse {
  map<string, string> flags = 1;
  map<string, FeatureFlagGroup> groups = 2;
}

message FeatureFlagGroup {
  map<string, string> map = 1;
}

message Threshold {
  uint32 min_performance = 1;
}

message MixnetTrafficConfig {
  optional uint32 poisson_parameter_for_loop_cover_stream = 1;
  optional uint32 average_packet_delay = 2;
  optional uint32 message_sending_average_delay = 3;

  bool disable_poisson_rate = 4;
  bool disable_background_cover_traffic = 5;

  optional uint32 min_mixnode_performance = 6;
  optional uint32 min_gateway_mixnet_performance = 7;
}

message SplitApp {
  string path = 1;
}

message SplitTunnelSettings {
  bool enabled = 1;
  repeated SplitApp apps = 2;
}

message GeoExclusionSettings {
  bool enabled = 1;
  uint32 listen_port = 2;
  repeated string excluded_countries = 3;
}

message GeoExclusionListenPortRequest {
  uint32 listen_port = 1;
}

message GatewaySelectionAlgorithm {
  message Explicit {};
  message AutoEntryExplicitExit {};
  message Auto {};
  oneof gateway_selection_algorithm {
    Explicit explicit = 1;
    AutoEntryExplicitExit auto_entry_explicit_exit = 2;
    Auto auto = 3;
  }
}

message GatewaySelectionAlgorithmConfig {
  bool enable_geo_location = 1;
  GatewaySelectionAlgorithm gateway_selection_algorithm = 2;
}

message GatewayIndependence {
  bool different_node_family = 1;
  bool different_asn = 2;
  bool different_subnet = 3;
  bool enable_notifications = 4;
}

message VpnServiceConfig {
  EntryNode entry_point = 1;
  ExitNode exit_point = 2;
  bool allow_lan = 4;
  bool disable_ipv6 = 14;
  bool enable_two_hop = 5;
  bool enable_bridges = 21;
  bool enable_ad_blocking = 27;
  bool residential_exit = 15;
  bool netstack = 13;
  bool enable_custom_dns = 17;
  IpAddrList custom_dns = 16;
  optional uint32 min_gateway_vpn_performance = 10;
  NetworkStatsConfig network_stats = 18;
  MixnetTrafficConfig mixnet_traffic = 25;
  SplitTunnelSettings split_tunnel = 28;
  GeoExclusionSettings geo_exclusion = 29;
  GatewaySelectionAlgorithmConfig gateway_selection_algorithm = 30;
  FrontingModes fronting_mode = 31;
  GatewayIndependence gateway_independence = 32;
}

message NetworkStatsConfig {
  bool enabled = 1;
  bool allow_disconnected = 2;
}

message AsEntry {
  bool can_connect = 1;
  bool can_route = 2;
}

message AsExit {
  bool can_connect = 1;
  bool can_route_ip_v4 = 2;
  bool can_route_ip_v6 = 3;
  bool can_route_ip_external_v4 = 4;
  bool can_route_ip_external_v6 = 5;
}

message WgProbeResult {
  bool can_register = 1;
  bool can_handshake = 2;
  bool can_resolve_dns = 3;
  float ping_hosts_performance = 4;
  float ping_ips_performance = 5;
}

message Socks5ProbeResult {
  bool can_proxy_https = 1;
  optional Score score = 2;
  optional ErrorList errors = 3;
}

message ErrorList {
  repeated string error = 1;
}
message LpProbeResult {
  bool can_connect = 1;
  bool can_handshake = 2;
  bool can_register = 3;
  optional string error = 4;
}

message ProbeOutcome {
  AsEntry as_entry = 1;
  AsExit as_exit = 2;
  WgProbeResult wg = 3;
  Socks5ProbeResult socks5 = 4;
  LpProbeResult lp = 5;
}

message Probe {
  google.protobuf.Timestamp last_updated_utc = 1;
  ProbeOutcome outcome = 2;
}

message GatewayResponse {
  GatewayId id = 1;
  Location location = 2;
  Probe last_probe = 3;
  optional uint32 mixnet_performance = 10;
  optional BridgeInformation bridge_params = 11;
  string name = 6;
  optional string description = 12;
  optional Performance performance = 4;
  repeated string exit_ipv4s = 7;
  repeated string exit_ipv6s = 8;
  optional string build_version = 9;
  optional LewesProtocolDetails lp_details = 13;
  optional string node_family_name = 14;
}

message RecentGateways {
  repeated GatewayResponse entry = 1;
  repeated GatewayResponse exit = 2;
}

message KemKeyDigests {
  map<string, string> digests = 1;
}

message LewesProtocolDetailsData {
  bool enabled = 1;
  uint32 control_port = 2;
  uint32 data_port = 3;
  string x25519 = 4;
  map<string, KemKeyDigests> kem_keys = 5;
}

message LewesProtocolDetails {
  LewesProtocolDetailsData content = 1;
  string signature = 2;
}

message BridgeInformation {
  string version = 1;
  repeated BridgeParameters transports = 2;
}

message BridgeParameters {
  oneof state {
    QuicClientOptions quic_plain = 1;
    TlsClientOptions tls_plain = 2;
  }
}

message QuicClientOptions {
  repeated SocketAddr addresses = 1;
  optional string host = 2;
  string id_pubkey = 3;
}


message TlsClientOptions {
  repeated SocketAddr addresses = 1;
  optional string host = 2;
  string id_pubkey = 3;
}

message Performance {
  string last_updated_utc = 1;
  Score score = 2;
  Score mixnet_score = 5;
  Score load = 3;
  float uptime_percentage_last_24_hours = 4;
}

enum Score {
  OFFLINE = 0;
  LOW = 1;
  MEDIUM = 2;
  HIGH = 3;
}

enum GatewayType {
  MIXNET_ENTRY = 0;
  MIXNET_EXIT = 1;
  WG = 2;
}

message ListGatewaysRequest {
  GatewayType kind = 1;
  UserAgent user_agent = 4;
}

message ListGatewaysResponse {
  repeated GatewayResponse gateways = 1;
}

message GetAccountLinksRequest {
  string locale = 1;
}

enum TunnelType {
  MIXNET = 0;
  WIREGUARD = 1;
}

enum EstablishConnectionState {
  RESOLVING_API_ADDRESSES = 0;
  AWAITING_ACCOUNT_READINESS = 1;
  AWAITING_CREDENTIALS_AVAILABILITY = 6;
  REFRESHING_GATEWAYS = 2;
  SELECTING_GATEWAYS = 3;
  REGISTERING_WITH_GATEWAYS = 4;
  CONNECTING_TUNNEL = 5;
}

message EstablishConnectionData {
  GatewayLightInfo entry_gateway = 1;
  GatewayLightInfo exit_gateway = 2;
  optional TunnelConnectionData tunnel = 3;
}

message ConnectionData {
  GatewayLightInfo entry_gateway = 1;
  GatewayLightInfo exit_gateway = 2;
  google.protobuf.Timestamp connected_at = 3;
  TunnelConnectionData tunnel = 4;
}

message MixnetConnectionData {
  Address nym_address = 1;
  Address exit_ipr = 2;
  string ipv4 = 3;
  optional string ipv6 = 4;
  string entry_ip = 5;
  string exit_ip = 6;
}

message BridgeAddress {
  SocketAddr listen_addr = 1;
  SocketAddr remote_addr = 2;
}

message WireguardConnectionData {
  WireguardNode entry = 1;
  WireguardNode exit = 2;
  optional BridgeAddress entry_bridge_addr = 3;
}

message WireguardNode {
  string endpoint = 1;
  string public_key = 2;
  string private_ipv4 = 3;
  optional string private_ipv6 = 4;
}

message TunnelConnectionData {
  message Mixnet {
    MixnetConnectionData data = 1;
  }
  message Wireguard {
    WireguardConnectionData data = 2;
  }

  oneof state {
    Mixnet mixnet = 1;
    Wireguard wireguard = 2;
  }
}

message TunnelState {
  enum ErrorStateReason {
    SET_FIREWALL_POLICY = 0;
    SET_ROUTING = 1;
    SET_DNS = 2;
    TUN_DEVICE = 3;
    TUNNEL_PROVIDER = 4;
    IPV6_UNAVAILABLE = 5;
    SAME_ENTRY_AND_EXIT_GATEWAY = 6;
    PERFORMANT_ENTRY_GATEWAY_UNAVAILABLE = 18;
    PERFORMANT_EXIT_GATEWAY_UNAVAILABLE = 19;
    INVALID_ENTRY_GATEWAY_IDENTITY = 20;
    INVALID_EXIT_GATEWAY_IDENTITY = 21;
    INVALID_ENTRY_GATEWAY_COUNTRY = 7;
    INVALID_EXIT_GATEWAY_COUNTRY = 8;
    CREDENTIAL_WASTED_ON_ENTRY_GATEWAY = 9;
    CREDENTIAL_WASTED_ON_EXIT_GATEWAY = 10;
    BANDWIDTH_EXCEEDED = 11;
    INACTIVE_SUBSCRIPTION = 12;
    INACTIVE_ACCOUNT = 13;
    MAX_DEVICES_REACHED = 14;
    DEVICE_TIME_OUT_OF_SYNC = 15;
    DEVICE_LOGGED_OUT = 16;
    NEED_FULL_DISK_PERMISSIONS = 22;
    SPLIT_TUNNEL = 23;
    NEEDS_RELAXED_INDEPENDENCE_CRITERIA = 24;
    CREDENTIAL_FETCHING_FAILED = 25;
    NO_CREDENTIAL_AVAILABLE = 26;
    INTERNAL = 17;
  }

  enum ActionAfterDisconnect {
    NOTHING = 0;
    ERROR = 1;
    RECONNECT = 2;
    OFFLINE = 3;
  }

  message Disconnected {}
  message Connecting {
    uint32 retry_attempt = 1;
    EstablishConnectionState state = 2;
    TunnelType tunnel_type = 3;
    optional EstablishConnectionData connection_data = 4;
  }
  message Connected {
    ConnectionData connection_data = 1;
  }
  message Disconnecting {
    ActionAfterDisconnect after_disconnect = 1;
  }
  message Error {
    ErrorStateReason reason = 1;
    optional string message = 2;
  }
  message Offline {
    bool reconnect = 1;
  }

  oneof state {
    Disconnected disconnected = 1;
    Connecting connecting = 2;
    Connected connected = 3;
    Disconnecting disconnecting = 4;
    Error error = 5;
    Offline offline = 6;
  }
}

message TunnelEvent {
  oneof event {
    TunnelState tunnel_state = 1;
    MixnetEvent mixnet_event = 2;
    ConfigChangedEvent config_changed_event = 3;
    AccountControllerState account_state = 4;
  }
}

message MixnetEvent {
  message BandwidthEvent {
    message NoBandwidth {}
    message RemainingBandwidth {
      int64 value = 1;
    }
    oneof event {
      NoBandwidth no_bandwidth = 1;
      RemainingBandwidth remaining_bandwidth = 2;
    }
  }

  enum ConnectionEvent {
    ENTRY_GATEWAY_DOWN = 0;
    EXIT_GATEWAY_DOWN_IPV4 = 1;
    EXIT_GATEWAY_DOWN_IPV6 = 2;
    EXIT_GATEWAY_ROUTING_ERROR_IPV4 = 3;
    EXIT_GATEWAY_ROUTING_ERROR_IPV6 = 4;
    CONNECTED_IPV4 = 5;
    CONNECTED_IPV6 = 6;
  }

  message SphinxPacketRates {
    double real_packets_sent = 1;
    double real_packets_sent_size = 2;
    double cover_packets_sent = 3;
    double cover_packets_sent_size = 4;

    double real_packets_received = 5;
    double real_packets_received_size = 6;
    double cover_packets_received = 7;
    double cover_packets_received_size = 8;

    double total_acks_received = 9;
    double total_acks_received_size = 10;
    double real_acks_received = 11;
    double real_acks_received_size = 12;
    double cover_acks_received = 13;
    double cover_acks_received_size = 14;

    double real_packets_queued = 15;
    double retransmissions_queued = 16;
    double reply_surbs_queued = 17;
    double additional_reply_surbs_queued = 18;
  }

  message ConnectionStatisticsEvent {
    SphinxPacketRates rates = 1;
  }

  oneof event {
    BandwidthEvent bandwidth_event = 1;
    ConnectionEvent connection_event = 2;
    ConnectionStatisticsEvent connection_statistics_event = 3;
  }
}

message ConfigChangedEvent {
  VpnServiceConfig new_config = 1;
}

message LogPath {
  string dir = 1;
  string filename = 2;
}

message GetLogPathResponse {
  optional LogPath log_path = 1;
}

message AccountCommandError {
  oneof error_detail {
    string internal = 1;
    string storage_error = 2;
    VpnApiError vpn_api = 3;
    string unexpected_response = 4;
    bool no_account_stored = 5;
    bool no_device_stored = 6;
    bool existing_account = 7;
    bool offline = 8;
    string invalid_secret = 9;
    string invalid_mnemonic = 10;
    string nyxd_connection_failure = 11;
    string nyxd_query_failure = 12;
    bool account_doesnt_exist_on_chain = 13;
    bool insufficient_funds = 14;
    bool account_decentralised = 15;
    bool account_not_decentralised = 16;
    string zk_nym_acquisition_failure = 17;
    string deeplink_error = 18;
  }
}

message DeleteLogFileError {
  string message = 1;
}

message VpnApiError {
  oneof error_detail {
    string timeout = 1;
    StatusError status_code = 2;
    VpnApiErrorResponse response = 3;
  }
  message StatusError {
    uint32 code = 1;
    string message = 2;
  }
}

message VpnApiErrorResponse {
  string message = 1;
  optional string message_id = 2;
  optional string code_reference_id = 3;
}

message AccountControllerState {
  enum ErrorStateReason {
    STORAGE = 0;
    API_FAILURE = 1;
    INTERNAL = 2;
    BANDWIDTH_EXCEEDED = 3;
    ACCOUNT_STATUS_NOT_ACTIVE = 4;
    INACTIVE_SUBSCRIPTION = 5;
    MAX_DEVICE_REACHED = 6;
    DEVICE_TIME_DESYNCED = 7;
  }

  message LoggedOut {}
  message ReadyToConnect {}
  message Syncing {}
  message Error {
    ErrorStateReason reason = 1;
    // for errors with details like Dns, Api, Internal
    optional string details = 2;
    optional string context = 3;
  }
  message Offline {}
  message Decentralised {}
  message PendingSubscription {}

  oneof state {
    LoggedOut logged_out = 1;
    Syncing syncing = 2;
    ReadyToConnect ready_to_connect = 3;
    Error error = 4;
    Offline offline = 5;
    Decentralised decentralised = 6;
    PendingSubscription pending_subscription = 9;
  }
}

message MinPerformance {
  optional uint32 min_wg_performance = 1;
  optional uint32 min_mixnet_performance = 2;
}

message GatewayFilter {
  oneof filter {
    Score min_score = 1;
    string country = 2;
    string region = 3;
    google.protobuf.Empty residential = 4;
    google.protobuf.Empty quic_enabled = 7;
    google.protobuf.Empty exit = 5;
    google.protobuf.Empty vpn = 6;
  }
}

message LookupGatewayFilters {
  GatewayType kind = 1;
  repeated GatewayFilter filters = 2;
}

// --- Requests and responses ---

message StoreAccountRequest {
  oneof request {
    VpnAccountStoreRequest vpn_account_store = 1;
    DecentralisedAccountStoreRequest decentralised_account_store = 2;
    PrivyAccountStoreRequest privy_account_store = 3;
  }
}

message VpnAccountStoreRequest {
  string mnemonic = 1;
}

message DecentralisedAccountStoreRequest {
  string mnemonic = 1;
}

message PrivyAccountStoreRequest {
  string mnemonic = 1;
}

message RefreshAccountStateRequest {
  bool force = 1;
}

message AccountCommandResponse {
  optional AccountCommandError error = 1;
}

message BalanceList {
  repeated Coin coins = 1;
}

message AccountBalanceResponse {
  oneof account_balance {
    AccountCommandError error = 1;
    BalanceList balance = 2;
  }
}

message GetAccountIdentityResponse {
  optional string account_identity = 1;
}

enum StoredAccountMode {
  MODE_API = 0;
  MODE_DECENTRALISED = 1;
  MODE_PRIVY = 2;
}

message GetAccountModeResponse {
  optional StoredAccountMode mode = 1;
}

message GetAccountUsageResponse {
  message AccountUsages {
    repeated AccountUsage account_usages = 1;
  }

  message AccountUsage {
    string created_on_utc = 1;
    string last_updated_utc = 2;
    string id = 3;
    string subscription_id = 4;
    string valid_until_utc = 5;
    string valid_from_utc = 6;
    double bandwidth_allowance_gb = 7;
    double bandwidth_used_gb = 8;
  }

  AccountUsages account_usages = 1;
}

message ResetDeviceIdentityRequest {
  // 32 byte seed, [u8; 32]
  optional bytes seed = 1;
}

message GetDeviceIdentityResponse {
  optional string device_identity = 1;
}

message GetDevicesResponse {
  message Device {
    enum DeviceStatus {
      ACTIVE = 0;
      INACTIVE = 1;
      DELETE_ME = 2;
    }

    string created_on_utc = 1;
    string last_updated_utc = 2;
    string device_identity_key = 3;
    DeviceStatus status = 4;
  }

  message Devices {
    repeated Device devices = 1;
  }

  Devices devices = 1;
}

message AvailableTickets {
  // Remaining number of mixnet entry tickets
  uint64 mixnet_entry_tickets = 1;
  // Remaining mixnet entry data in bytes
  uint64 mixnet_entry_data = 2;
  // Remaining mixnet entry data formatted to a string using SI units
  string mixnet_entry_data_si = 3;

  // Remaining number of mixnet exit tickets
  uint64 mixnet_exit_tickets = 4;
  // Remaining mixnet exit data in bytes
  uint64 mixnet_exit_data = 5;
  // Remaining mixnet exit data formatted to a string using SI units
  string mixnet_exit_data_si = 6;

  // Remaining number of vpn entry tickets
  uint64 vpn_entry_tickets = 7;
  // Remaining vpn entry data in bytes
  uint64 vpn_entry_data = 8;
  // Remaining vpn entry data formatted to a string using SI units
  string vpn_entry_data_si = 9;

  // Remaining number of vpn exit tickets
  uint64 vpn_exit_tickets = 10;
  // Remaining vpn exit data in bytes
  uint64 vpn_exit_data = 11;
  // Remaining vpn exit data formatted to a string using SI units
  string vpn_exit_data_si = 12;
}

message VpnAccountSummaryResponse {
  optional VpnAccountSummary account_summary = 1;
}

message VpnAccountSummary {
  uint64 traffic_used_gb = 2;
  uint64 traffic_limit_gb = 3;
  optional google.protobuf.Timestamp traffic_reset_time = 4;
  string account_addr = 5;
  optional string canonical_account_addr = 6;
  repeated VpnAccountAuthMethod auth_methods = 7;
  optional StoredAccountMode account_mode = 8;
  optional Subscription subscription = 12;
  bool is_subscription_stacked = 13;
  bool fair_usage_data_unavailable = 14;
  VpnAccountStatus account_status = 15;
  uint64 remaining_devices = 16;
  bool is_device_active = 17;
  optional google.protobuf.Timestamp last_synced_utc = 18;
  bool time_synced = 19;
  bool stale = 20;
}

message NymVpnSubscription {
  string created_on_utc = 1;
  string last_updated_utc = 2;
  string id = 3;
  int64 valid_until_utc = 4;
  int64 valid_from_utc = 5;
  string status = 6;
  NymVpnSubscriptionKind kind = 7;
  bool is_recurring = 8;
}

message Subscription {
  NymVpnSubscriptionStatus status = 1;
  NymVpnSubscription subscription = 2;
}

enum NymVpnSubscriptionStatus {
  SUBSCRIPTION_PENDING = 0;
  SUBSCRIPTION_ACTIVE = 1;
}

message VpnAccountAuthMethod {
  string id = 1;
  string pubkey = 2;
  string kind = 3;
  string label = 4;
  VpnAccountStatus status = 5;
  google.protobuf.Timestamp created = 6;
}

enum VpnAccountStatus {
  ACTIVE = 0;
  INACTIVE = 1;
  DELETE_ME = 2;
}

message NymVpnSubscriptionKind {
  message OneMonth {}
  message OneYear {}
  message TwoYears {}
  message Freepass {}
  message Other {
    string other = 1;
  }

  oneof kind {
    OneMonth one_month = 1;
    OneYear one_year = 2;
    TwoYears two_years = 3;
    Freepass free_pass = 4;
    Other other = 5;
  }
}

message DeleteLogFileResponse {
  bool success = 1;
  DeleteLogFileError error = 2;
}

// Enable SOCKS5 proxy request
// TODO: Change arguments to EnableSocks5Request (at the time of writing I didn't want to disturb the client code)
message EnableSocks5Request {
  Socks5Settings socks5_settings = 1;
  HttpRpcSettings http_rpc_settings = 2;
  ExitNode exit = 3;
}

// SOCKS5 proxy status
message Socks5Status {
  enum State {
    DISABLED = 0;
    IDLE = 1; // Enabled but no connections
    CONNECTED = 2; // Active connections
    ERROR = 3;
  }
  State state = 1;
  Socks5Settings socks5_settings = 2;
  HttpRpcSettings http_rpc_settings = 3;
  optional string error_message = 4;
  uint32 active_connections = 5;
}

// socks5 settings
message Socks5Settings {
  string listen_address = 1; // e.g., "127.0.0.1:1080"
}

// http rpc settings
message HttpRpcSettings {
  string listen_address = 1; // e.g., "127.0.0.1:8545"
}

message NetworkStatsResetSeedRequest {
  // this doesn't need to be cryptographically secure, so anything will do
  optional string seed = 1;
}

message NetworkStatisticsIdentity {
  string seed = 1;
  string id = 2;
}

enum FrontingModes {
  ON_RETRY = 0;
  ALWAYS = 1;
  OFF = 2;
}

message FrontingModeRequest {
  FrontingModes mode = 1;
}

message PrivyDerivationMessage {
  string message = 1;
}

message DiagnosticRunParams {
  bool skip_dns = 1;
  bool skip_http = 2;
  optional GatewayId gateway = 3;
  bool skip_hybrid_transport = 4;
}

message DiagnosticRegisterParams {
  GatewayId gateway = 1;
  optional string storage_path = 2;
  bool skip_wireguard = 3;
  bool mixnet = 4;
  bool lp = 5;
}

// Very nested struct and more often than not just used for logging, so JSON will do
message DiagnosticReport {
  string json = 1;
}

// Very nested struct and more often than not just used for logging, so JSON will do
message RegistrationReport {
  string json = 1;
}

message TentativeGateways {
  message Selected {
    GatewayResponse entry = 1;
    GatewayResponse exit = 2;
  };
  message NeedsRelaxedIndependenceCriteria {};
  message NoGatewaysAvailable {};
  oneof tentative_gateways {
    Selected selected = 1;
    NeedsRelaxedIndependenceCriteria needs_relaxed_independence_criteria = 2;
    NoGatewaysAvailable no_gateways_available = 3;
  }
}

message AutologinResponse {
  string url = 1;
  string pin_code = 2;
}

message GetDeeplinkParams {
  DeeplinkClient client = 1;
  string locale = 2;
  DeeplinkKind kind = 3;
  string name = 4;
}

enum DeeplinkClient {
  CLIENT_MOBILE = 0;
  CLIENT_DESKTOP = 1;
  CLIENT_WEB = 2;
}

enum DeeplinkKind {
  KIND_PRIVY = 0;
  KIND_PRIVY_LINK = 1;
  AutologinRenew = 2;
  AutologinView = 3;
  CreateAccount = 4;
}

message SplitTunnelExcludedProcess {
  int32 pid = 1;
  string exec_path = 2;
  string responsible_exec_path = 3;
}

message SplitTunnelExcludedProcessList {
  repeated SplitTunnelExcludedProcess processes = 1;
}

message GetRecentGatewaysParams {
  TunnelType tunnel_type = 1;
}

service NymVpnService {
  // Get info regarding the nym-vpnd in general, like version etc.
  rpc Info(google.protobuf.Empty) returns (InfoResponse) {}

  // Get the VPN service configuration
  rpc GetConfig(google.protobuf.Empty) returns (GetConfigResponse) {}

  // Set the VPN service configuration
  rpc SetEntryPoint(EntryNode) returns (google.protobuf.Empty) {}
  rpc SetExitPoint(ExitNode) returns (google.protobuf.Empty) {}
  rpc SetDisableIpv6(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetEnableTwoHop(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetEnableBridges(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetEnableAdBlocking(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetNetstack(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetAllowLan(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetResidentialExit(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetEnableCustomDns(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetCustomDns(IpAddrList) returns (google.protobuf.Empty) {}
  rpc SetMixnetTrafficConfig(MixnetTrafficConfig) returns (google.protobuf.Empty) {}
  rpc SetGeoExclusionEnabled(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetGeoExclusionListenPort(GeoExclusionListenPortRequest) returns (google.protobuf.Empty) {}
  rpc SetGeoExclusionExcludedCountries(StringList) returns (google.protobuf.Empty) {}
  rpc SetGatewaySelectionAlgorithm(GatewaySelectionAlgorithm) returns (google.protobuf.Empty) {}
  rpc SetEnableGeoLocation(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetEnableGatewayIndependence(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetGatewayIndependenceNotifications(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetFrontingMode(FrontingModeRequest) returns (google.protobuf.Empty) {}

  // Set the network. This requires a restart to take effect
  rpc SetNetwork(google.protobuf.StringValue) returns (google.protobuf.Empty) {}

  // List messages fetched from nym-vpn-api
  rpc GetSystemMessages(google.protobuf.Empty) returns (GetSystemMessagesResponse) {}

  // List network compatibility client versions from nym-vpn-api
  rpc GetNetworkCompatibility(google.protobuf.Empty) returns (GetNetworkCompatibilityResponse) {}

  // List the feature flags fetched from the nym-vpn-api
  rpc GetFeatureFlags(google.protobuf.Empty) returns (GetFeatureFlagsResponse) {}

  // Get the default DNS used by the daemon
  rpc GetDefaultDns(google.protobuf.Empty) returns (IpAddrList) {}

  // Connect the tunnel
  rpc ConnectTunnel(google.protobuf.Empty) returns (google.protobuf.BoolValue) {}

  // Reconnect the tunnel if it had been established.
  rpc ReconnectTunnel(google.protobuf.Empty) returns (google.protobuf.BoolValue) {}

  // Disconnect the tunnel
  rpc DisconnectTunnel(google.protobuf.Empty) returns (google.protobuf.BoolValue) {}

  // Get the current tunnel state
  rpc GetTunnelState(google.protobuf.Empty) returns (TunnelState) {}

  /// Listen for daemon events.
  rpc ListenToEvents(google.protobuf.Empty) returns (stream TunnelEvent) {}

  // List the available gateways for the selected mode
  rpc ListGateways(ListGatewaysRequest) returns (ListGatewaysResponse) {}

  // Get a filtered list of gateways for the selected mode and filters
  rpc ListFilteredGateways(LookupGatewayFilters) returns (ListGatewaysResponse) {}

  // Store the recovery phrase, which is also the account identity and authentication
  rpc StoreAccount(StoreAccountRequest) returns (AccountCommandResponse) {}

  /// Retrieve current, on-chain, account balance
  rpc AccountBalance(google.protobuf.Empty) returns (AccountBalanceResponse) {}

  // Attempt to obtain ticketbooks using the funds associated with the stored decentralised account
  rpc DecentralisedObtainTicketbooks(google.protobuf.Empty) returns (AccountCommandResponse) {}

  // Check if the recovery phrase is stored
  rpc IsAccountStored(google.protobuf.Empty) returns (google.protobuf.BoolValue) {}

  // Removes everything related to the account, including the device identity,
  // credential storage, mixnet keys, gateway registrations.
  rpc ForgetAccount(google.protobuf.Empty) returns (AccountCommandResponse) {}

  // Force a rotation of the wireguard keys.
  rpc RotateKeys(google.protobuf.Empty) returns (AccountCommandResponse) {}

  // Get the account identity of the currently logged-in user.
  rpc GetAccountIdentity(google.protobuf.Empty) returns (GetAccountIdentityResponse) {}

  // Get the account identity of the canonical (API) account.
  rpc GetCanonicalAccountIdentity(google.protobuf.Empty) returns (GetAccountIdentityResponse) {}

  // Get the account mode of the currently logged-in user.
  rpc GetAccountMode(google.protobuf.Empty) returns (GetAccountModeResponse) {}

  // Get the set of account links for the user
  rpc GetAccountLinks(GetAccountLinksRequest) returns (AccountManagement) {}

  // Query the account state, which is synced from the nym-vpn-api account, as it
  // is known and interpreted by nym-vpnd
  rpc GetAccountState(google.protobuf.Empty) returns (AccountControllerState) {}

  // The vpn client will periodically refresh the account state in the
  // background. This command triggers a manual refresh.
  rpc RefreshAccountState(RefreshAccountStateRequest) returns (google.protobuf.Empty) {}

  // Get the account usage from the nym-vpn-api
  rpc GetAccountUsage(google.protobuf.Empty) returns (GetAccountUsageResponse) {}

  // Reset the device identity
  rpc ResetDeviceIdentity(ResetDeviceIdentityRequest) returns (google.protobuf.Empty) {}

  // Get the device identity
  rpc GetDeviceIdentity(google.protobuf.Empty) returns (GetDeviceIdentityResponse) {}

  // Get the list of devices associated with this account from the nym-vpn-api
  rpc GetDevices(google.protobuf.Empty) returns (GetDevicesResponse) {}

  // Get the list of active devices associated with this account from the nym-vpn-api
  rpc GetActiveDevices(google.protobuf.Empty) returns (GetDevicesResponse) {}

  // Get the available tickets in the local credential store
  rpc GetAvailableTickets(google.protobuf.Empty) returns (AvailableTickets) {}

  // Manually trigger a restock of every ticketbook type running low or about
  // to expire, via the bandwidth controller. A manual safety valve; the
  // automatic triggers already keep every type stocked.
  rpc RestockTicketbooks(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // Get the account summary
  rpc GetAccountSummary(google.protobuf.Empty) returns (VpnAccountSummaryResponse) {}

  // Handle a subscription payment: checks login, refreshes account state.
  // Returns an error if no account is stored (user not logged in).
  rpc HandleSubscriptionPayment(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // Get the deeplink URL
  rpc GetDeeplink(GetDeeplinkParams) returns (google.protobuf.StringValue) {}

  // Get the deeplink autologin URL
  rpc GetAutologinDeeplink(GetDeeplinkParams) returns (AutologinResponse) {}

  // Login using a deeplink callback URL
  rpc DeeplinkStoreAccount(google.protobuf.StringValue) returns (AccountCommandResponse) {}

  // Get the log file path
  rpc GetLogPath(google.protobuf.Empty) returns (GetLogPathResponse) {}

  // Delete the log file
  rpc DeleteLogFile(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // Check if Sentry error monitoring is enabled
  rpc IsSentryEnabled(google.protobuf.Empty) returns (google.protobuf.BoolValue) {}

  // Enable Sentry error monitoring (requires daemon restart)
  rpc EnableSentry(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // Disable Sentry error monitoring (requires daemon restart)
  rpc DisableSentry(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // Enable/disable network statistics collection
  rpc NetworkStatsSetEnabled(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}

  // Allow/disallow disconnected network statistics collection sending
  rpc NetworkStatsAllowDisconnected(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}

  // Reset seed used for network statistics id
  rpc NetworkStatsResetSeed(NetworkStatsResetSeedRequest) returns (google.protobuf.Empty) {}

  // Get seed and Id used for network statistics
  rpc NetworkStatsGetSeed(google.protobuf.Empty) returns (NetworkStatisticsIdentity) {}

  // Enable socks5 proxy
  rpc EnableSocks5(EnableSocks5Request) returns (google.protobuf.Empty) {}

  // Disable socks5 proxy
  rpc DisableSocks5(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // Get socks5 proxy status
  rpc GetSocks5Status(google.protobuf.Empty) returns (Socks5Status) {}

  // Get Privy derivation message to be signed
  rpc GetPrivyDerivationMessage(google.protobuf.Empty) returns (PrivyDerivationMessage) {}

  // Diagnostic stuff
  rpc RunDiagnostic(DiagnosticRunParams) returns (DiagnosticReport) {}
  rpc RegisterDiagnostic(DiagnosticRegisterParams) returns (RegistrationReport) {}

  // Get the most probable gateway pair that is going to be used with the set tunnel settings
  rpc GetTentativeGateways(google.protobuf.Empty) returns (TentativeGateways) {}

  // Split-tunnel (all platforms)
  rpc IsSplitTunnelSupported(google.protobuf.Empty) returns (google.protobuf.BoolValue) {}

  // Split-tunnel (Linux, macOS)
  rpc GetSplitTunnelExcludedProcesses(google.protobuf.Empty) returns (SplitTunnelExcludedProcessList) {}

  // Split-tunnel (Windows, macOS)
  rpc SetEnableSplitTunnel(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc AddSplitTunnelApp(SplitApp) returns (google.protobuf.Empty) {}
  rpc RemoveSplitTunnelApp(SplitApp) returns (google.protobuf.Empty) {}
  rpc ClearSplitTunnelApps(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // Split-tunnel (Linux)
  rpc AddSplitTunnelProcess(google.protobuf.Int32Value) returns (google.protobuf.Empty) {}
  rpc RemoveSplitTunnelProcess(google.protobuf.Int32Value) returns (google.protobuf.Empty) {}
  rpc ClearSplitTunnelProcesses(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // Split-tunnel (macOS only)
  // Check whether the app needs TCC approval for split tunneling (macOS)
  rpc NeedFullDiskPermissions(google.protobuf.Empty) returns (google.protobuf.BoolValue) {}

  // Get recent gateways
  rpc GetRecentGateways(GetRecentGatewaysParams) returns (RecentGateways) {}
}
