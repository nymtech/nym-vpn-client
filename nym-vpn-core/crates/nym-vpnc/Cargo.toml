[package]
name = "nym-vpnc"
description = "NymVPN command-line client"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
celes.workspace = true
clap = { workspace = true, features = ["derive", "wrap_help"] }
clap_complete.workspace = true
dirs.workspace = true
serde_json.workspace = true
shlex.workspace = true
tabled.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-stream.workspace = true

nym-diagnostic.workspace = true
nym-favorites.workspace = true
nym-vpn-proto = { workspace = true, features = ["conversions", "rpc_client"] }
nym-vpn-lib-types = { workspace = true, features = ["serde"] }

# Debian
[package.metadata.deb]
name = "nym-vpnc"
extended-description = '''NymVPN is a vpn service that uses the Nym mixnet.

This package contains the nym-vpnc binary, which is a CLI application used to interact with the nym-vpnd daemon.'''
recommends = "nym-vpnd"
assets = [
    "$auto",
    { source = "target/release/completions/nym-vpnc.bash", dest = "usr/share/bash-completion/completions/nym-vpnc", mode = "644" },
    { source = "target/release/completions/_nym-vpnc", dest = "usr/share/zsh/vendor-completions/_nym-vpnc", mode = "644" },
    { source = "target/release/completions/nym-vpnc.fish", dest = "usr/share/fish/vendor_completions.d/nym-vpnc.fish", mode = "644" },
]
revision = ""
maintainer-scripts = "debian"
systemd-units = { enable = false }
