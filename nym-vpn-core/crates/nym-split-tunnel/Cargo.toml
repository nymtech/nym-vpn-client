[package]
name = "nym-split-tunnel"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
either = { workspace = true, features = ["serde"] }
futures-util.workspace = true
insta = { workspace = true, features = ["yaml"] }
libc.workspace = true
nix = { workspace = true, features = ["net"] }
ipnetwork.workspace = true
pnet_packet.workspace = true
pcap = { workspace = true, features = ["capture-stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tun = { workspace = true, features = ["async"] }
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-util.workspace = true

nym-platform-metadata.workspace = true
nym-routing.workspace = true
nym-macos.workspace = true
nym-firewall-config.workspace = true
nym-common.workspace = true
nym-ifconfig.workspace = true

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
bitflags.workspace = true
memoffset.workspace = true
nym-windows.workspace = true
windows-service.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
] }

[lints]
workspace = true
