[package]
name = "nym-vpn-lib-types"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
nym-type-conversions = [
    "dep:nym-bandwidth-controller",
    "dep:nym-connection-monitor",
    "dep:nym-gateway-directory",
    "dep:nym-network-defaults",
    "dep:nym-sdk",
    "dep:nym-statistics-common",
    "dep:nym-registration-common",
    "dep:nym-validator-client",
    "dep:nym-vpn-api-client",
    "dep:nym-vpn-network-config",
]

[dependencies]
serde = { workspace = true, features = ["derive"] }
si-scale.workspace = true
thiserror.workspace = true
time.workspace = true
zeroize.workspace = true

nym-registration-common = { workspace = true, optional = true }
nym-crypto = { workspace = true, features = ["asymmetric", "serde"] }
nym-bandwidth-controller = { workspace = true, optional = true }
nym-connection-monitor = { workspace = true, optional = true }
nym-gateway-directory = { workspace = true, optional = true }
nym-sdk = { workspace = true, optional = true }
nym-statistics-common = { workspace = true, optional = true }
nym-validator-client = { workspace = true, optional = true }
nym-vpn-api-client = { workspace = true, optional = true }
nym-vpn-network-config = { workspace = true, optional = true }
nym-network-defaults = { workspace = true, optional = true }
