[package]
name = "nym-vpnd"
description = "NymVPN daemon"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bip39.workspace = true
clap.workspace = true
futures.workspace = true
log-panics.workspace = true
reqwest = { version = "0.12", features = ["socks"] }
bytes = "1.5"
urlencoding = "2.1"
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = [
    "signal",
    "rt-multi-thread",
    "sync",
    "io-util",
    "net",
] }
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tonic.workspace = true
tracing-appender.workspace = true
tracing-oslog.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "ansi"] }
tracing.workspace = true
url.workspace = true
nym-bin-common.workspace = true
nym-registration-client.workspace = true
nym-http-api-client.workspace = true
nym-sdk.workspace = true
nym-windows.workspace = true
sentry = { workspace = true, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
    "tracing",
    "logs",
] }
# sha2.workspace = true

# Local crates
nym-common.workspace = true
nym-ipc.workspace = true
nym-offline-monitor.workspace = true
nym-statistics = { workspace = true }
nym-vpn-account-controller = { workspace = true }
nym-vpn-api-client = { workspace = true }
nym-vpn-lib = { workspace = true }
nym-vpn-lib-types = { workspace = true }
nym-vpn-store = { workspace = true }
nym-vpn-network-config = { workspace = true }
nym-platform-metadata = { workspace = true }
nym-gateway-directory = { workspace = true }
nym-vpn-proto = { workspace = true, features = ["conversions"] }

[target.'cfg(windows)'.dependencies]
wmi.workspace = true
windows-service.workspace = true
eventlog.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
]

[dev-dependencies]
pretty_assertions.workspace = true

[build-dependencies]
vergen-gitcl = { workspace = true, default-features = false, features = [
    "build",
    "cargo",
    "rustc",
] }

# Debian
[package.metadata.deb]
name = "nym-vpnd"
extended-description = '''NymVPN is a vpn service that uses the Nym mixnet.

This package contains the nym-vpnd daemon binary, which runs as a background service.

End-users should use either the CLI client, nym-vpnc, or the GUI client, nym-vpn-app.'''
maintainer-scripts = "debian"
recommends = "nym-vpnc"
revision = ""

[package.metadata.deb.systemd-units]
unit-name = "nym-vpnd"
enable = true
start = true
restart-after-upgrade = false
stop-on-upgrade = true
unit-scripts = "linux/unit-scripts"

[package.metadata.cargo-machete]
ignored = ["vergen"]
