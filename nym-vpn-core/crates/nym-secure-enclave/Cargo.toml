[package]
name = "nym-secure-enclave"
description = "A secure key storage crate for managing encryption keys"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
futures-util.workspace = true
zeroize.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
uniffi.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libc.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
objc2-core-foundation = { workspace = true, default-features = false, features = [
    "std",
    "CFBase",
    "CFData",
    "CFDictionary",
    "CFError",
    "CFNumber",
    "CFString",
] }
objc2-security = { workspace = true, default-features = false, features = [
    "std",
    "SecAccessControl",
    "SecBase",
    "SecItem",
    "SecKey",
] }

[lints]
workspace = true
