[package]
name = "nym-offline-monitor"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time", "rt"] }
debounced.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true

nym-common.workspace = true
nym-routing.workspace = true
async-trait.workspace = true

[target.'cfg(windows)'.dependencies]
nym-windows.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = { git = "https://github.com/madsmtm/objc2", branch = "main" }
dispatch2 = { git = "https://github.com/madsmtm/objc2", branch = "main" }
objc2 = { git = "https://github.com/madsmtm/objc2", branch = "main" }
objc2-foundation = { git = "https://github.com/madsmtm/objc2", branch = "main", default-features = false, features = ["std", "NSString"] }
objc2-network.workspace = true
