schema: spec-driven
context: |
  nym-vpn-core is the Rust workspace powering the Nym mixnet VPN client across
  desktop (Linux/macOS/Windows), iOS, and Android. It implements the VPN tunnel
  lifecycle, gateway selection, WireGuard and mixnet (5-hop) data paths, OS-level
  network plumbing (DNS, routing, firewall, split tunneling), the local control
  daemon (nym-vpnd) and its clients, account/credential management against the Nym
  VPN API, and the FFI surfaces (UniFFI for mobile, gRPC/proto for desktop).

  Tech stack: Rust (tokio async), gRPC/protobuf (tonic/prost), UniFFI for mobile
  bindings, wireguard-go (cgo) via nym-wg-go, DBus on Linux, WFP on Windows,
  Network/NetworkExtension and Endpoint Security on Apple platforms.
  Architecture: Cargo workspace of ~38 single-responsibility crates layered as
  platform abstractions -> network plumbing -> core VPN library -> daemon/clients
  -> FFI bindings.

