block2 = "0.6.2"
bs58 = "0.5.1"
bytes = "1.10"
chrono = "0.4.42"
celes = "2.6.0"
clap = "4.5"
dbus = "0.9.9"
debounced = "0.2"
dirs = "6.0"
dispatch2 = "0.3.0"
duct = "1.1"
ed25519-dalek = "2.2.0"
eventlog = "0.3.0"
futures = "0.3.31"
futures-util = "0.3"
hex = "0.4"
hickory-resolver = "0.25"
hickory-server = "0.25"
http = "1.3.1"
hyper-util = "0.1.17"
inotify = "0.11"
ipnetwork = "0.21.1"
itertools = "0.14.0"
lazy_static = "1.5.0"
libc = "0.2"
