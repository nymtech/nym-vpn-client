[workspace]
resolver = "2"
members = [
    "crates/nym-apple-network",
    "crates/nym-common",
    "crates/nym-connection-monitor",
    "crates/nym-diagnostic",
    "crates/nym-dbus",
    "crates/nym-dns",
    "crates/nym-firewall",
    "crates/nym-gateway-directory",
    "crates/nym-ipc",
    "crates/nym-macos",
    "crates/nym-offline-monitor",
    "crates/nym-platform-metadata",
    "crates/nym-routing",
    "crates/nym-setup",
    "crates/nym-statistics",
    "crates/nym-statistics-api-client",
    "crates/nym-vpn-account-controller",
    "crates/nym-vpn-api-client",
    "crates/nym-vpn-lib-types",
    "crates/nym-vpn-lib",
    "crates/nym-vpn-network-config",
    "crates/nym-vpn-proto",
    "crates/nym-vpn-store",
    "crates/nym-vpnc",
    "crates/nym-vpnd",
    "crates/nym-wg-go",
    "crates/nym-wg-metadata-client",
    "crates/nym-windows",
    "crates/uniffi-bindgen",
    "crates/nym-vpn-lib-uniffi",
    "crates/nym-vpn-rpc-uniffi",
    "crates/nym-firewall-config",
]

default-members = [
    "crates/nym-diagnostic",
    "crates/nym-vpnc",
    "crates/nym-vpnd",
    "crates/nym-setup",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "1.25.0-beta"
authors = ["Nym Technologies SA"]
repository = "https://github.com/nymtech/nym-vpn-client"
homepage = "https://nymtech.net"
documentation = "https://nymtech.net"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.88"

[profile.release]
lto = true

[workspace.lints.clippy]
large_futures = "warn"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.89"
backon = "1.6"
base64 = "0.22"
base64-url = "3.0.2"
bincode = "1.3.3"
bip39 = "2.2"
bitflags = "2"
block2 = "0.6.2"
boringtun = "0.7.0"
bs58 = "0.5.1"
bytes = "1.11"
celes = "2.6.0"
clap = "4.5"
dbus = "0.9.10"
debounced = "0.2"
dispatch2 = "0.3.0"
duct = "1.1"
ed25519-dalek = "2.2.0"
eventlog = "0.3.0"
futures = "0.3.31"
futures-util = "0.3"
iprange = "0.6.7"
ipnet = "2.11.0"
hex = "0.4"
hickory-resolver = "0.25"
hickory-server = "0.25"
hkdf = "0.12"
reqwest = { version = "0.12", default-features = false }
hyper = "1.8.1"
hyper-util = "0.1"
http-body-util = "0.1"
urlencoding = "2.1"
inotify = "0.11"
ipnetwork = "0.21.1"
itertools = "0.14.0"
libc = "0.2"
log = "0.4.29"
log-panics = "2"
mnl = "0.3.0"
nftnl = "0.9.1"
nix = "0.31.1"
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
once_cell = "1.21"
opentelemetry = "0.31.0"
opentelemetry_sdk = "0.31.0"
pnet_packet = "0.35.0"
plist = "1.8.0"
pfctl = "0.7.0"
prost = "0.14.3"
prost-types = "0.14.3"
pretty_assertions = "1.4.1"
quinn = { version = "0.11", default-features = false, features = [
    "ring",
    "rustls",
    "runtime-tokio",
] }
quinn-proto = { version = "0.11", default-features = false, features = [
    "rustls",
] }
rand = "0.8.5"
rand_chacha = "0.3.1"
resolv-conf = "0.7"
rs-release = "0.1.11"
rtnetlink = "0.20"
rustls = { version = "0.23.36", default-features = false }
semver = "1.0"
sentry = { version = "0.46.1", default-features = false }
serde = "1.0"
serde_json = "1.0"
serial_test = "3.3.1"
sha2 = "0.10"
sha256 = "1.6.0"
si-scale = "0.3.0"
signature = "2.2.0"
sqlx = "0.8.6"
socket2 = "0.6.2"
surge-ping = "0.8.4"
strum = "0.27.2"
strum_macros = "0.27.2"
sysinfo = "0.38"
system-configuration = "0.7.0"
tap = "1.0.1"
tempfile = "3.24"
tabled = "0.20"
thiserror = "2.0"
time = "0.3.46"
tokio = "1.49"
tokio-rustls = { version = "0.26", default-features = false }
tokio-stream = "0.1.18"
tokio-tungstenite = { version = "0.28" }
tokio-util = { version = "0.7.18", features = ["codec"] }
toml = "0.9.11"
tonic = "0.14.3"
tonic-prost = "0.14.3"
tonic-prost-build = "0.14.3"
typed-builder = "0.23.2"
ts-rs = "12.0.1"
tower = "0.5.3"
tracing = "0.1"
tracing-android = "0.2.0"
tracing-appender = "0.2.4"
tracing-opentelemetry = "0.32.1"
tracing-oslog = "0.3.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-test = "0.2.5"
triggered = "0.1.3"
tun = { version = "0.8.5", features = ["async"] }
uniffi = { version = "0.31.0", features = ["cli"] }
url = "2.5"
vergen-gitcl = { version = "9.1.0", default-features = false }
webpki-roots = "1.0"
which = "8.0"
widestring = "1.2"
windows = "0.62.2"
windows-service = "0.8.0"
winreg = "0.55"
wiremock = "0.6.5"
wmi = "0.18.1"
x25519-dalek = "2.0"
x509-parser = "0.18.0"
zbus = "5.13.2"
zbus_polkit = "5.0.0"
zeroize = "1.8.2"

nym-apple-network = { path = "crates/nym-apple-network" }
nym-common = { path = "crates/nym-common" }
nym-connection-monitor = { path = "crates/nym-connection-monitor" }
nym-diagnostic = { path = "crates/nym-diagnostic" }
nym-dbus = { path = "crates/nym-dbus" }
nym-dns = { path = "crates/nym-dns" }
nym-firewall = { path = "crates/nym-firewall" }
nym-firewall-config = { path = "crates/nym-firewall-config" }
nym-gateway-directory = { path = "crates/nym-gateway-directory" }
nym-ipc = { path = "crates/nym-ipc" }
nym-macos = { path = "crates/nym-macos" }
nym-offline-monitor = { path = "crates/nym-offline-monitor" }
nym-platform-metadata = { path = "crates/nym-platform-metadata" }
nym-routing = { path = "crates/nym-routing" }
nym-statistics = { path = "crates/nym-statistics" }
nym-statistics-api-client = { path = "crates/nym-statistics-api-client" }
nym-vpn-account-controller = { path = "crates/nym-vpn-account-controller" }
nym-vpn-api-client = { path = "crates/nym-vpn-api-client" }
nym-vpn-lib = { path = "crates/nym-vpn-lib" }
nym-vpn-lib-types = { path = "crates/nym-vpn-lib-types" }
