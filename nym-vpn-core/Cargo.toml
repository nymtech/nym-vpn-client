[workspace]
resolver = "2"
members = [
    "crates/nym-apple-network",
    "crates/nym-authorization-service",
    "crates/nym-common",
    "crates/nym-connection-monitor",
    "crates/nym-cgroup",
    "crates/nym-dbus",
    "crates/nym-conflict",
    "crates/nym-diagnostic",
    "crates/nym-dns",
    "crates/nym-exclude",
    "crates/nym-firewall",
    "crates/nym-firewall-config",
    "crates/nym-gateway-directory",
    "crates/nym-ifconfig",
    "crates/nym-ipc",
    "crates/nym-macos",
    "crates/nym-nm-vpn-plugin",
    "crates/nym-offline-monitor",
    "crates/nym-platform-metadata",
    "crates/nym-routing",
    "crates/nym-setup",
    "crates/nym-split-tunnel",
    "crates/nym-socks5-proxy",
    "crates/nym-socks5-proxy-ipc",
    "crates/nym-statistics",
    "crates/nym-statistics-api-client",
    "crates/nym-favorites",
    "crates/nym-file-updater",
    "crates/nym-qr-pairing-requests",
    "crates/nym-vpn-account-controller",
    "crates/nym-vpn-api-client",
    "crates/nym-vpn-credential-fetcher",
    "crates/nym-vpn-lib",
    "crates/nym-vpn-lib-types",
    "crates/nym-vpn-lib-uniffi",
    "crates/nym-vpn-network-config",
    "crates/nym-vpn-proto",
    "crates/nym-vpn-store",
    "crates/nym-vpnc",
    "crates/nym-vpnd",
    "crates/nym-wg-go",
    "crates/nym-wg-metadata-client",
    "crates/nym-windows",
    "crates/uniffi-bindgen",
    "crates/test/test-manager",
    "crates/test/test-rpc",
    "crates/test/test-runner",
]

default-members = [
    "crates/nym-diagnostic",
    "crates/nym-exclude",
    "crates/nym-nm-vpn-plugin",
    "crates/nym-setup",
    "crates/nym-socks5-proxy",
    "crates/nym-vpnc",
    "crates/nym-vpnd",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "2026.16.0-beta.1"
authors = ["Nym Technologies SA"]
repository = "https://github.com/nymtech/nym-vpn-client"
homepage = "https://nymvpn.com/"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.97"

[profile.release]
lto = true
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"

[profile.ci]
inherits = "dev"
debug = 1

[profile.fdroid]
inherits = "release"
debug = false

# debug symbols are extracted and stripped by gradle
[profile.android]
inherits = "release"
split-debuginfo = "off"
strip = "none"

[workspace.lints.clippy]
large_futures = "warn"

