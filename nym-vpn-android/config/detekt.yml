config:
    validation: true
    # when writing own rules with new properties, exclude the property path e.g.: 'my_rule_set,.*>.*>[my_property]'
    excludes: []

processors:
    active: true
    exclude:
        - "DetektProgressListener"
    # - 'FunctionCountProcessor'
    # - 'PropertyCountProcessor'
    # - 'ClassCountProcessor'
    # - 'PackageCountProcessor'
    # - 'KtFileCountProcessor'

console-reports:
    active: true
    exclude:
        - "ProjectStatisticsReport"
        - "ComplexityReport"
        - "NotificationReport"
        #  - 'FindingsReport'
        - "FileBasedFindingsReport"

comments:
    active: false

complexity:
    active: true
    NestedBlockDepth:
        allowedDepth: 6
    LongParameterList:
        active: false
    TooManyFunctions:
        active: false
    LongMethod:
        active: false
    ComplexCondition:
        allowedConditions: 5
    CyclomaticComplexMethod:
        allowedComplexity: 26
        ignoreAnnotated:
            - "Composable"

coroutines:
    active: true
    GlobalCoroutineUsage:
        active: false
    RedundantSuspendModifier:
        active: true
    SleepInsteadOfDelay:
        active: true
    SuspendFunWithFlowReturnType:
        active: true

exceptions:
    active: true
    TooGenericExceptionCaught:
        active: false
    NotImplementedDeclaration:
        active: true
    ObjectExtendsThrowable:
        active: true
    SwallowedException:
        active: false

performance:
    active: true
    SpreadOperator:
        active: false
        excludes: ["**/test/**", "**/androidTest/**", "**/*.Test.kt", "**/*.Spec.kt", "**/*.Spek.kt"]

potential-bugs:
    active: true
    DontDowncastCollectionTypes:
        active: true
    ExitOutsideMain:
        active: true
    HasPlatformType:
        active: true
    IgnoredReturnValue:
        active: true
    ImplicitUnitReturnType:
        active: true
        allowExplicitReturnType: true
    MapGetWithNotNullAssertionOperator:
        active: true
    UnconditionalJumpStatementInLoop:
        active: true
    UnreachableCatchBlock:
        active: true
    UselessPostfixExpression:
        active: true

style:
    active: false
    CollapsibleIfStatements:
        active: true
    DataClassShouldBeImmutable:
        active: true
    EqualsOnSignatureLine:
        active: true
    ExpressionBodySyntax:
        active: true
        includeLineWrapping: false
    ForbiddenComment:
        active: true
        comments: ["STOPSHIP"]
        allowedPatterns: ""
    LoopWithTooManyJumpStatements:
        active: true
        maxJumpCount: 3
    MagicNumber:
        active: false
        excludes: ["**/test/**", "**/androidTest/**", "**/commonTest/**", "**/jvmTest/**", "**/jsTest/**", "**/iosTest/**", "**/*.Test.kt", "**/*.Spec.kt", "**/*.Spek.kt"]
        ignoreNumbers: ["-1", "0", "1", "2"]
        ignoreHashCodeFunction: true
        ignorePropertyDeclaration: true
        ignoreLocalVariableDeclaration: true
        ignoreConstantDeclaration: true
        ignoreCompanionObjectPropertyDeclaration: true
        ignoreAnnotation: true
        ignoreNamedArgument: true
        ignoreEnums: true
        ignoreRanges: true
    MandatoryBracesLoops:
        active: true
    MaxLineLength:
        active: true
        maxLineLength: 150
        excludePackageStatements: true
        excludeImportStatements: true
        excludeCommentStatements: false
    NoTabs:
        active: false
    OptionalUnit:
        active: true
    RedundantExplicitType:
        active: true
    ReturnCount:
        active: false
    SpacingAfterPackageAndImports:
        active: true
    ThrowsCount:
        active: true
        max: 5
    TrailingWhitespace:
        active: true
    UnnecessaryLet:
        active: true
    UnnecessaryParentheses:
        active: true
    AbstractClassCanBeConcreteClass:
        ignoreAnnotated:
            - Module
    AbstractClassCanBeInterface:
        ignoreAnnotated:
            - Module
    RangeUntilInsteadOfRangeTo:
        active: true
    UnusedImport:
        active: true
    UnusedPrivateFunction:
        # We need to disable this otherwise we'd need to @Suppress all Composable previews...
        active: false
    UnusedPrivateProperty:
        # We need to disable this otherwise we'd need to @Suppress all Composable previews...
        active: false
    UseArrayLiteralsInAnnotations:
        active: true
    UseCheckNotNull:
        active: true
    UseCheckOrError:
        active: true
    UseEmptyCounterpart:
        active: true
    UseIfEmptyOrIfBlank:
        active: true
    UseIsNullOrEmpty:
        active: true
    UseRequire:
        active: true
    UseRequireNotNull:
        active: true
    VarCouldBeVal:
        active: true

compose:
    ReusedModifierInstance:
        active: true
    UnnecessaryEventHandlerParameter:
        active: true
    ComposableEventParameterNaming:
        active: true
    ComposableParametersOrdering:
        active: false
    ModifierHeightWithText:
        active: false
    ModifierDefaultValue:
        active: true
    MissingModifierDefaultValue:
        active: true
    PublicComposablePreview:
        active: true
    TopLevelComposableFunctions:
        active: true
    ComposableFunctionName:
        active: true
    ConditionCouldBeLifted:
        active: true
        ignoreCallsWithArgumentNames: ["modifier", "contentAlignment"]

naming:
    FunctionParameterNaming:
        active: false
    FunctionNaming:
        ignoreAnnotated:
            - Composable
