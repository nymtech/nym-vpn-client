material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle-compose" }

#sentry
sentry = { module = "io.sentry:sentry-android", version.ref = "sentry" }

#billing
billing-client = { module = "com.android.billingclient:billing-ktx", version.ref = "billing-client" }

#biometric
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

#credentials
credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }


[plugins]
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
