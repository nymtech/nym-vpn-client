# Full connect and disconnect round trip in dVPN mode.
# The mode tab reads "dVPN" (#6214) while the connected banner still reads
# "Fast mode protection" - that copy mismatch is the app's, and is pinned here
# deliberately so the suite reflects shipped behaviour.
appId: net.nymtech.nymvpn.mock.debug
tags:
  - ui-validation
  - smoke
---
- runFlow: ../../subflows/open_app.yaml

- tapOn: "dVPN"
- assertVisible: "NOT PROTECTED"

- runFlow: ../../subflows/connect.yaml

- extendedWaitUntil:
    visible:
      text: "FAST MODE PROTECTION"
    timeout: 30000
- assertVisible: "Disconnect"

- tapOn: "Disconnect"

- runFlow:
    when:
      visible: "For best connection"
    commands:
      - tapOn: "Skip"

- extendedWaitUntil:
    visible:
      text: "NOT PROTECTED"
    timeout: 30000
- assertVisible: "Connect"
