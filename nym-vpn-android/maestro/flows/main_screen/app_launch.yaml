appId: net.nymtech.nymvpn.mock.debug
---
- launchApp

- runFlow:
    when:
      visible: "Connection request"
    commands:
      - tapOn: "OK"

- extendedWaitUntil:
    visible:
      text: "Connect"
    timeout: 15000

- assertVisible: "Disconnected"
- assertVisible: "SELECT MODE"
- assertVisible: "CONNECT TO"
- assertVisible: "Connect"
- assertVisible: "Settings"
