appId: net.nymtech.nymvpn.mock.debug
tags:
  - ui-validation
---
- runFlow: ../../subflows/open_app.yaml

# The home screen renders two identical "Safest" nodes (entry and exit rows).
# A bare index: 0 binds to whichever comes first in the hierarchy; say which one.
- tapOn:
    text: "Safest"
    below: "Exit server"

- assertNotVisible: "No results found."
- assertVisible: "Germany"

- tapOn: "Search location or server"
- inputText: "Random non existing country"

- assertVisible: "No results found."
- assertNotVisible: "Germany"

- tapOn: "Clear text"

- assertVisible: "Germany"
- assertNotVisible: "No results found."
