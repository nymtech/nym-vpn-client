# Searching the server list by name filters it.
appId: net.nymtech.nymvpn.mock.debug
tags:
  - ui-validation
---
- runFlow: ../../subflows/open_app.yaml

- tapOn:
    text: "Safest"
    below: "Exit server"

- assertNotVisible: "Mock-Entry-DE-01"

- tapOn: "Search location or server"
- inputText: "Entry-DE-01"

- assertVisible: "Mock-Entry-DE-01"

- tapOn: "Clear text"

- assertNotVisible: "Mock-Entry-DE-01"
