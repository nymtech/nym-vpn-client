appId: net.nymtech.nymvpn.mock.debug
---
- launchApp

- extendedWaitUntil:
    visible:
      text: "Connect"
    timeout: 15000

- tapOn: "Settings"

- tapOn:
    text: "Passphrase"
    index: 1

- assertVisible: "Your account passphrase"

- tapOn: "Show my passphrase"

- extendedWaitUntil:
    visible:
      text: "Copy passphrase"
    timeout: 5000

- assertVisible: "Download"
- tapOn: "Save to password manager"

- tapOn: "I have saved these 24 words securely and will never share them"

- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN

- tapOn:
    text: "Continue"

- assertVisible: "Settings"
- assertNotVisible: "Show my passphrase"
