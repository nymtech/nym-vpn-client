# Anti-censorship settings screen shows all three options and their copy.
appId: net.nymtech.nymvpn.mock.debug
tags:
  - ui-validation
---
- runFlow: ../../subflows/open_app.yaml

- tapOn: "Settings"

- scrollUntilVisible:
    element:
      text: "Anti-censorship"
    direction: DOWN
    centerElement: true
- tapOn: "Anti-censorship"

- extendedWaitUntil:
    visible:
      text: "Advanced features to improve connectivity in restrictive networks or when experiencing NymVPN blocking."
    timeout: 10000

- assertVisible: "Enhanced connection (QUIC)"
- assertVisible:
    text: "Improves connections on restricted networks.*"

- assertVisible: "Minimal obfuscation (AmneziaWG)"
- assertVisible:
    text: "Disguises WireGuard traffic with decoy packets.*"

- scrollUntilVisible:
    element:
      text: "Stealth API connect"
    direction: DOWN
    centerElement: true
- assertVisible: "Stealth API connect"
- assertVisible:
    text: "Protects against VPN blocking by using cover domains.*"

- assertVisible: "Learn more"
