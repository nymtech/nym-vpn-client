# Display theme screen lists every theme option with its description.
appId: net.nymtech.nymvpn.mock.debug
tags:
  - ui-validation
---
- runFlow: ../../subflows/open_app.yaml

- tapOn: "Settings"

- scrollUntilVisible:
    element:
      text: "Appearance"
      index: 1
    direction: DOWN
    centerElement: true

- tapOn:
    text: "Appearance"
    index: 1

- tapOn:
    text: "Display theme"
    index: 1

- assertVisible: "Display theme"

- assertVisible: "Automatic"
- assertVisible: "Use device theme"
- assertVisible: "Dark theme"
- assertVisible: "Light theme"
- assertVisible: "Dynamic"
- assertVisible: "System wallpaper theme"

- tapOn: "Light theme"
- assertVisible: "Display theme"
- tapOn: "Dark theme"
- assertVisible: "Display theme"

- back
- assertVisible: "Appearance"
