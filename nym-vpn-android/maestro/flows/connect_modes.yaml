appId: net.nymtech.nymvpn.mock.debug
---
- launchApp

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

# Wait for main screen
- extendedWaitUntil:
    visible:
      text: "Disconnected"
    timeout: 20000

# Verify entry/exit locations show Random
- assertVisible:
    text: "Random"

# Verify Fast (WireGuard) mode card is visible (default)
- assertVisible:
    text: "Fast \\(WireGuard\\)"

# --- Test 1: Connect in Fast (WireGuard) mode ---
- tapOn:
    text: "Connect"

# Handle battery optimization dialog if it appears
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

# Mock transitions: Connecting -> Connected (1.5s delay)
- extendedWaitUntil:
    visible:
      text: "Connected"
    timeout: 10000

# Disconnect
- tapOn:
    text: "Disconnect"

- extendedWaitUntil:
    visible:
      text: "Disconnected"
    timeout: 10000

# --- Test 2: Switch to Anonymous (mixnet) mode and connect ---
- tapOn:
    text: "Anonymous \\(mixnet\\)"

# Tap Connect in mixnet mode
- tapOn:
    text: "Connect"

# Mock transitions: Connecting -> Connected (1.5s delay)
- extendedWaitUntil:
    visible:
      text: "Connected"
    timeout: 10000

# Disconnect
- tapOn:
    text: "Disconnect"

- extendedWaitUntil:
    visible:
      text: "Disconnected"
    timeout: 10000
