# Launches the app with a clean state and permissions granted, on the home screen.
appId: net.nymtech.nymvpn.mock.debug
---
- launchApp:
      clearState: true
      permissions:
          all: allow

# clearState revokes runtime permissions, and re-granting them races the app's
# own POST_NOTIFICATIONS prompt. When the system dialog wins that race it covers
# the onboarding screen and every flow fails on an unrelated assertion, so clear
# it here rather than letting it surface as a mystery red in the nightly.
- runFlow:
      when:
          visible: "Allow"
      commands:
          - tapOn: "Allow"

- runFlow:
      when:
          visible: "Connection request"
      commands:
          - tapOn: "OK"

- extendedWaitUntil:
      visible:
          text: "Help us improve NymVPN"
      timeout: 20000
- tapOn: "Continue"

- extendedWaitUntil:
      visible:
          text: "Connect"
      timeout: 20000
