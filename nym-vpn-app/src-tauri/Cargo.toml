[package]
name = "nym-vpn-app"
version = "1.23.0-dev"
description = "NymVPN desktop client"
authors = [
    "Nym Technologies SA",
    "Pierre <dommerc.pierre@gmail.com>",
    "Zane <zanecschepke@gmail.com>",
]
license = "GPL-3.0-only"
documentation = "https://nymtech.net"
repository = "https://github.com/nymtech/nym-vpn-client"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }
build-info-build = "0.0.42"
toml = "0.9.5"

[dependencies]
tauri = { version = "2.9.2", features = ["tray-icon", "image-png"] }
tokio = { version = "1.47.1", features = [
    "rt",
    "sync",
    "time",
    "fs",
    "macros",
] }
serde = { version = "1.0", features = ["derive"] }
futures = "0.3"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.1", features = [
    "tracing-log",
    "env-filter",
] }
tracing-appender = "0.2"
anyhow = "1.0"
dotenvy = "0.15.7"
thiserror = "2.0.0"
ts-rs = { version = "11.0", features = ["chrono-impl"] }
once_cell = "1.18.0"
toml = "0.9.5"
time = "0.3.9"
itertools = "0.14"
clap = { version = "4.5", features = ["derive"] }
build-info = "0.0.42"
sled = "0.34.7"
strum = { version = "0.27", features = ["derive"] }
rust_iso3166 = "0.1"
dirs = "6.0"
semver = "1.0"
url = "2.5.4"
sentry = { version = "0.45.0", features = ["tracing", "logs"] }
sysinfo = "0.37"
tokio-stream = "0.1.17"

# nym deps
nym-platform-metadata = { path = "../../nym-vpn-core/crates/nym-platform-metadata" }
nym-vpn-proto = { path = "../../nym-vpn-core/crates/nym-vpn-proto", features = [
    "rpc_client",
] }
nym-vpn-lib-types = { path = "../../nym-vpn-core/crates/nym-vpn-lib-types" }

# tauri deps
tauri-plugin-os = "2.3.1"
tauri-plugin-notification = "2.3.0"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-process = "2.3.0"
tauri-plugin-clipboard-manager = "2.3.0"
tauri-plugin-updater = "2.9.0"
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2.3.4", features = ["deep-link"] }
tauri-plugin-window-state = "2.4.0"
tauri-plugin-opener = "2.5.0"
tauri-plugin-autostart = "2.5.0"
tauri-plugin-deep-link = "2"

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = [
    "Win32_System_Console",
    "Win32_Foundation",
] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
strip = true
