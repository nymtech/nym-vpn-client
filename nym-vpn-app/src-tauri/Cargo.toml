[package]
name = "nym-vpn-app"
version = "2026.13.0-beta.1"
description = "NymVPN desktop client"
authors = ["Nym Technologies SA <contact@nymtech.net>"]
license = "GPL-3.0-only"
documentation = "https://nymtech.net"
repository = "https://github.com/nymtech/nym-vpn-client"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
build-info-build = "0.0.46"
toml = "1.1.6"

[dependencies]
tauri = { version = "2.11.5", features = [
    "protocol-asset",
    "tray-icon",
    "image-png",
] }
tokio = { version = "1.53.1", features = [
    "rt",
    "sync",
    "time",
    "fs",
    "macros",
] }
serde = { version = "1.0", features = ["derive"] }
futures = "0.3"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = [
    "tracing-log",
    "env-filter",
] }
tracing-appender = "0.2"
anyhow = "1.0"
dotenvy = "0.15.7"
thiserror = "2.0.20"
ts-rs = { version = "12.0", features = ["chrono-impl"] }
once_cell = "1.21.4"
toml = "1.1.6"
time = { version = "0.3.55", features = ["serde-human-readable"] }
itertools = "0.15"
clap = { version = "4.6", features = ["derive"] }
build-info = "0.0.46"
sled = "0.34.7"
strum = { version = "0.28", features = ["derive"] }
rust_iso3166 = "0.2"
dirs = "7.0"
semver = "1.0"
url = "2.5.8"
sentry = { version = "0.49.2", features = ["tracing", "logs"] }
sysinfo = "0.39"
tokio-stream = "0.1.19"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["png"] }

# nym deps
nym-platform-metadata = { path = "../../nym-vpn-core/crates/nym-platform-metadata" }
nym-favorites = { path = "../../nym-vpn-core/crates/nym-favorites" }
nym-vpn-proto = { path = "../../nym-vpn-core/crates/nym-vpn-proto", features = [
    "rpc_client",
] }
nym-vpn-lib-types = { path = "../../nym-vpn-core/crates/nym-vpn-lib-types", features = [
    "serde",
] }

# tauri deps
tauri-plugin-os = "2.3.2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-updater = "2.11.0"
tauri-plugin-shell = "2"
regex = "1.13.1"
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-opener = "2.5.5"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-deep-link = "2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18.0"
freedesktop-desktop-entry = "0.8"
freedesktop-icons = "0.4"
notify = "8.2"
# StatusNotifierItem-based tray. We avoid Tauri's tray-icon backend on Linux because
# libayatana-appindicator eats left-click and turns it into "open menu" — there's no way
# to bind toggle-window to a left click. ksni speaks SNI directly and exposes the
# `activate`/`secondary_activate` callbacks we need.
#
# Uses async-io (not the default tokio feature) to avoid enabling `zbus/tokio` globally —
# tauri-plugin-single-instance uses `zbus::blocking` and the tokio-flavored blocking shim
# calls `Runtime::block_on()`, which panics during Tauri's plugin init.
ksni = { version = "0.3", default-features = false, features = ["async-io"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
strip = true
