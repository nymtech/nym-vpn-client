project_id_env: "CROWDIN_PROJECT_ID"
api_token_env: "CROWDIN_PERSONAL_TOKEN"
base_path: "../"

preserve_hierarchy: true

languages_mapping:
  # res/values
  android_code: &android-code
    ar:    ar
    bn:    bn-rBD        # values-bn-rBD
    de:    de            # values-de
    el:    el-rGR        # values-el-rGR
    es-ES: es            # values-es
    fa:    fa            # values-fa
    fr:    fr            # values-fr
    hi:    hi            # values-hi
    it:    it            # values-it
    ja:    ja            # values-ja
    pt-BR: pt-rBR        # values-pt-rBR
    pt-PT: pt-rPT        # values-pt-rPT
    ru:    ru            # values-ru
    tr:    tr            # values-tr
    uk:    uk            # values-uk
    vi:    vi-rVN        # values-vi-rVN
    zh-CN: zh-rCN        # values-zh-rCN

  # fastlane / Google Play
  play_locale: &play-locale
    ar:    ar
    bn:    bn-BD
    de:    de-DE
    el:    el-GR
    en-US: en-US
    es-ES: es-ES
    fa:    fa
    fr:    fr-FR
    hi:    hi-IN
    it:    it-IT
    ja:    ja-JP
    pt-BR: pt-BR
    pt-PT: pt-PT
    ru:    ru-RU
    tr:    tr-TR
    uk:    uk
    vi:    vi
    zh-CN: zh-CN

files:
  - source: "/nym-vpn-android/app/src/main/res/values/strings.xml"
    translation: "/nym-vpn-android/app/src/main/res/values-%android_code%/strings.xml"
    languages_mapping: *android-code

  - source: "/nym-vpn-android/core/src/main/res/values/strings.xml"
    translation: "/nym-vpn-android/core/src/main/res/values-%android_code%/strings.xml"
    languages_mapping: *android-code

  - source: "/fastlane/metadata/android/en-US/*.txt"
    translation: "/fastlane/metadata/android/%play_locale%/%original_file_name%"
    languages_mapping: *play-locale

  - source: "/fastlane/metadata/android/en-US/changelogs/*.txt"
    translation: "/fastlane/metadata/android/%play_locale%/changelogs/%original_file_name%"
    languages_mapping: *play-locale