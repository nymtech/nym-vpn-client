project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: "../"
preserve_hierarchy: true
languages_mapping:
  # Mapping for Android Resource Folders (res/values-*)
  android_code: &android-code
    ar: ar
    bn: bn-rBD
    de: de
    es-ES: es
    fa: fa
    fr: fr
    hi: hi
    pt-BR: pt-rBR
    ru: ru
    tr: tr
    uk: uk
    vi: vi-rVN
    zh-CN: zh-rCN
  # Mapping for Fastlane / Google Play Store Metadata
  locale: &play-locale
    ar: ar
    bn: bn-BD
    de: de-DE
    en-US: en-US
    es-ES: es-ES
    fa: fa
    fr: fr-FR
    hi: hi-IN
    pt-BR: pt-BR
    ru: ru-RU
    tr: tr-TR
    uk: uk
    vi: vi
    zh-CN: zh-CN
files:
  - source: "nym-vpn-android/app/src/main/res/values/strings.xml"
    translation: "nym-vpn-android/app/src/main/res/values-%android_code%/strings.xml"
    languages_mapping: { android_code: *android-code }
  - source: "nym-vpn-android/core/src/main/res/values/strings.xml"
    translation: "nym-vpn-android/core/src/main/res/values-%android_code%/strings.xml"
    languages_mapping: { android_code: *android-code }
  - source: "fastlane/metadata/android/en-US/changelogs/*.txt"
    translation: "fastlane/metadata/android/%locale%/changelogs/%original_file_name%"
    languages_mapping: { locale: *play-locale }
  # Translate standard Play Store metadata (title, short_description) to all languages
  # Excludes description files (handled separately below) and iOS-only / non-translatable files
  - source: "fastlane/metadata/android/en-US/*.txt"
    ignore:
      - "fastlane/metadata/android/en-US/video.txt"
      - "fastlane/metadata/android/en-US/promotional_text.txt"
      - "fastlane/metadata/android/en-US/store_images.txt"
      - "fastlane/metadata/android/en-US/subtitle.txt"
      - "fastlane/metadata/android/en-US/full_description.txt"
      - "fastlane/metadata/android/en-US/full_description_medium.txt"
      - "fastlane/metadata/android/en-US/full_description_short.txt"
    translation: "fastlane/metadata/android/%locale%/%original_file_name%"
    languages_mapping: { locale: *play-locale }
  # Full description — long version (3950 chars) for zh-CN only (EN is source)
  - source: "fastlane/metadata/android/en-US/full_description.txt"
    translation: "fastlane/metadata/android/%locale%/full_description.txt"
    languages_mapping: { locale: *play-locale }
    excluded_target_languages: [ar, bn, de, es-ES, fa, fr, hi, pt-BR, ru, tr, uk, vi]
  # Full description — medium version (3300 chars) for ru, uk, tr, fr, es-ES, pt-BR, vi, ar
  - source: "fastlane/metadata/android/en-US/full_description_medium.txt"
    translation: "fastlane/metadata/android/%locale%/full_description.txt"
    languages_mapping: { locale: *play-locale }
    excluded_target_languages: [bn, de, fa, hi, zh-CN]
  # Full description — short version (2750 chars) for de, hi, bn, fa
  - source: "fastlane/metadata/android/en-US/full_description_short.txt"
    translation: "fastlane/metadata/android/%locale%/full_description.txt"
    languages_mapping: { locale: *play-locale }
    excluded_target_languages: [ar, es-ES, fr, pt-BR, ru, tr, uk, vi, zh-CN]
