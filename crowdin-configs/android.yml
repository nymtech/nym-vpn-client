project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: "../"

preserve_hierarchy: true

languages_mapping:
  # res/values
  android_code: &android-code
    ar:    ar
    bn:    bn-rBD
    cs:    cs
    de:    de
    el:    el-rGR
    es-ES: es
    fa:    fa
    fr:    fr
    hi:    hi
    hu:    hu
    it:    it
    ja:    ja
    pt-BR: pt-rBR
    pt-PT: pt-rPT
    ru:    ru
    tr:    tr
    uk:    uk
    vi:    vi-rVN
    zh-CN: zh-rCN

  # fastlane / Google Play
  locale: &play-locale
    ar:    ar
    bn:    bn-BD
    cs:    cs-CZ
    de:    de-DE
    el:    el-GR
    en-US: en-US
    es-ES: es-ES
    fa:    fa
    fr:    fr-FR
    hi:    hi-IN
    hu:    hu-HU    
    it:    it-IT
    ja:    ja-JP
    pt-BR: pt-BR
    pt-PT: pt-PT
    ru:    ru-RU
    tr:    tr-TR
    uk:    uk
    vi:    vi
    zh-CN: zh-CN

files:
  - source: "nym-vpn-android/app/src/main/res/values/strings.xml"
    translation: "nym-vpn-android/app/src/main/res/values-%android_code%/strings.xml"
    languages_mapping:
      android_code: *android-code

  - source: "nym-vpn-android/core/src/main/res/values/strings.xml"
    translation: "nym-vpn-android/core/src/main/res/values-%android_code%/strings.xml"
    languages_mapping:
      android_code: *android-code

  - source: "fastlane/metadata/android/en-US/*.txt"
    translation: "fastlane/metadata/android/%locale%/%original_file_name%"
    languages_mapping:
      locale: *play-locale
    ignore:
      - "fastlane/metadata/android/en-US/full_description.txt"
      - "fastlane/metadata/android/en-US/short_description.txt"

  - source: "fastlane/metadata/android/en-US/changelogs/*.txt"
    translation: "fastlane/metadata/android/%locale%/changelogs/%original_file_name%"
    languages_mapping:
      locale: *play-locale
