project_id_env: "CROWDIN_PROJECT_ID"
api_token_env: "CROWDIN_PERSONAL_TOKEN"
base_path: "../"

preserve_hierarchy: true

files:
  - source: "nym-vpn-app/src/i18n/en/*.json"
    translation: "nym-vpn-app/src/i18n/%two_letters_code%/%original_file_name%"
    # zh-TW would collapse to `zh` under %two_letters_code% and collide with
    # Simplified Chinese; map it explicitly so it lands in src/i18n/zh-TW/.
    languages_mapping:
      two_letters_code:
        zh-TW: zh-TW
