project_id_env: "CROWDIN_PROJECT_ID"
api_token_env: "CROWDIN_PERSONAL_TOKEN"
base_path: "../"

preserve_hierarchy: true

files:
  - source: "nym-vpn-app/src/i18n/en/*.json"
    translation: "nym-vpn-app/src/i18n/%two_letters_code%/%original_file_name%"
    # Traditional Chinese is Crowdin language `zh-TW`; emit it as the script code
    # `zh-Hant` (region-neutral), not %two_letters_code%'s `zh`, which would
    # collide with Simplified in src/i18n/zh/.
    languages_mapping:
      two_letters_code:
        zh-TW: zh-Hant
