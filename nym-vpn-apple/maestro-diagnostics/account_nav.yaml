# Diagnostic only - NOT part of the suite (lives outside maestro/ so the
# `maestro test maestro` run does not pick it up). Navigates from the home screen
# to the Account and devices screen and stops, so the CI can dump that screen's
# accessibility tree. Every login flow fails there looking for content that the
# code says should render; this captures what is actually shown.
appId: net.nymtech.vpn
---
- launchApp:
    clearState: true
    arguments:
      MOCK_MODE: "1"

- runFlow:
    when:
      visible: ".*most private VPN.*"
    commands:
      - tapOn: "Get started"

- extendedWaitUntil:
    visible:
      text: "Connect"
    timeout: 20000

- tapOn: "Settings"
- extendedWaitUntil:
    visible:
      text: "Account and devices"
    timeout: 10000

- tapOn: "Account and devices"

- extendedWaitUntil:
    visible:
      text: "Account status"
    timeout: 15000

# Perform the full logout so the CI dump shows the POST-logout screen - the
# login flows now get this far but never see "Welcome!", so capture what does
# appear instead.
- scrollUntilVisible:
    element:
      text: "Log out ?"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Log out ?"

# Confirm via the dialog's exact "Log out" (no trailing space), then dump the
# post-logout screen so we can confirm it reaches Welcome.
- extendedWaitUntil:
    visible:
      text: "Log out of this device?"
    timeout: 10000
- tapOn:
    text: "Log out"
- waitForAnimationToEnd:
    timeout: 8000
