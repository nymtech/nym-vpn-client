# Diagnostic only - NOT part of the suite (lives outside maestro/ so the
# `maestro test maestro` run does not pick it up). Navigates from the home screen
# to the Account and devices screen and stops, so the CI can dump that screen's
# accessibility tree. Every login flow fails there looking for content that the
# code says should render; this captures what is actually shown.
appId: net.nymtech.vpn
---
- launchApp:
    clearState: true
    arguments:
      MOCK_MODE: "1"

- runFlow:
    when:
      visible: ".*most private VPN.*"
    commands:
      - tapOn: "Get started"

- extendedWaitUntil:
    visible:
      text: "Connect"
    timeout: 20000

- tapOn: "Settings"
- extendedWaitUntil:
    visible:
      text: "Account and devices"
    timeout: 10000

- tapOn: "Account and devices"

# Let the destination settle; do not assert anything so the flow always succeeds
# and leaves the app on whatever screen the tap produced.
- waitForAnimationToEnd:
    timeout: 5000
