appId: net.nymtech.vpn
tags:
  - ui-validation
onFlowStart:
  - clearState
# Maestro only picks up flows at the top level of the workspace unless told
# otherwise, and every flow here lives in a subdirectory. This also keeps
# subflows/ out of the run - those are building blocks invoked via runFlow,
# not standalone tests. Matches nym-vpn-android/maestro/config.yaml.
flows:
  - flows/**
