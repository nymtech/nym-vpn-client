# Searching for a server in the exit gateway picker returns results.
appId: net.nymtech.vpn
tags:
  - ui-validation
---
- runFlow: ../../subflows/open_app.yaml
- runFlow: ../../subflows/reveal_servers.yaml

- tapOn: "Exit server"
- extendedWaitUntil:
    visible:
      text: "Search location or server"
    timeout: 10000

- tapOn: "Search location or server"
- inputText: "United"
# The list is live network data; both countries consistently host gateways.
# Full-match regex, so the "United" typed into the search field cannot satisfy it.
- extendedWaitUntil:
    visible:
      text: "United (States|Kingdom)"
    timeout: 10000
- assertNotVisible: "No results found."
