# Gateway picker renders its server list and details affordance.
#
# NOTE: the per-row "info" button that opens ServerDetailsView has no stable
# text/accessibilityIdentifier resolvable from source (GatewaysView builds it via
# CustomNavBarButton(type: .info) / infoButtonTapCompletion). The commented block
# below reaches "Server details" once the selector is confirmed against a running
# build in CI — see tasks.md 5.3.
appId: net.nymtech.vpn
tags:
  - ui-validation
---
- runFlow: ../../subflows/open_app.yaml

- tapOn: "Exit server"
- extendedWaitUntil:
    visible:
      text: "Search location or server"
    timeout: 10000

# The gateway list renders, including the Random (fastest) entry.
- assertVisible: "Random"

