appId: net.nymtech.vpn
---
- launchApp

- runFlow:
    when:
      visible: "Welcome to NymVPN"
    commands:
      - tapOn:
          point: "95%,12%"

- extendedWaitUntil:
    visible:
      text: "Disconnected"
    timeout: 15000

- assertVisible:
    text: "Entry location"

- assertVisible:
    text: "Exit location"

- tapOn:
    text: "Entry location"

- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 10000
