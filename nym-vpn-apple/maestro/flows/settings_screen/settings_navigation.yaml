# Settings screen opens from home and lists its main entries.
appId: net.nymtech.vpn
tags:
  - ui-validation
  - smoke
---
- runFlow: ../../subflows/open_app.yaml

- tapOn: "Settings"
- extendedWaitUntil:
    visible:
      text: "Account and devices"
    timeout: 10000

# Entries visible without scrolling. "Customize DNS" is below the fold (see
# customize_dns.yaml) and "Split tunneling" is macOS-only, so neither is asserted
# here.
- assertVisible: "Appearance"
- assertVisible: "Anti-censorship"
