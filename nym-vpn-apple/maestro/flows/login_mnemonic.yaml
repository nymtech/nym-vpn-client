appId: net.nymtech.vpn
---
- clearState
- launchApp:
    arguments:
      MOCK_MODE: "1"

- extendedWaitUntil:
    visible:
      text: "Welcome to NymVPN"
    timeout: 15000

# Tap Log in on onboarding
- tapOn:
    text: "Log in"

# PR #4692 fix: "Log in anonymously" button now appears
- extendedWaitUntil:
    visible:
      text: "Log in anonymously"
    timeout: 10000

- tapOn:
    text: "Log in anonymously"

# Wait for the passphrase input screen
- extendedWaitUntil:
    visible:
      text: ".*passphrase.*"
    timeout: 10000

# Tap the text field area (placeholder shows "word1 word2 word3 word4...")
- tapOn:
    text: "word1 word2.*"

- inputText: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

# Dismiss keyboard by tapping on the title area
- tapOn:
    point: "50%,20%"

# Tap the "Log in" button (second occurrence; first is the page title)
- tapOn:
    text: "Log in"
    index: 1

# Handle post-login onboarding screens
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

# Verify login succeeded - should reach the main screen
- extendedWaitUntil:
    visible:
      text: "Connect"
    timeout: 20000
