# Home screen renders correctly in its disconnected state.
appId: net.nymtech.vpn
tags:
  - ui-validation
  - smoke
---
- runFlow: ../../subflows/open_app.yaml

# "Entry server"/"Exit server" are deliberately not asserted here - OneClick
# renders those only in .nerd display mode, and a cleared launch defaults to
# .powerUser. Covering them needs a flow that switches mode first.
- assertVisible: "Connect"
