# Full connect and disconnect round trip against the mock backend.
appId: net.nymtech.vpn
tags:
  - ui-validation
  - smoke
---
- runFlow: ../../subflows/open_app.yaml

- assertVisible: "Connect"
- runFlow: ../../subflows/connect.yaml
- extendedWaitUntil:
    visible:
      text: "Disconnect"
    timeout: 30000
# dVPN is the default mode; the status label proves the tunnel state, not just the button.
- extendedWaitUntil:
    visible:
      text: "dVPN mode protection"
    timeout: 30000
- assertNotVisible: "Not protected"

- tapOn: "Disconnect"

- extendedWaitUntil:
    visible:
      text: "Connect"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "Not protected"
    timeout: 10000
