# Switching between Fast and Mixnet speed modes on the home screen.
appId: net.nymtech.vpn
tags:
  - ui-validation
---
- runFlow: ../../subflows/open_app.yaml

- extendedWaitUntil:
    visible:
      text: "Fast"
    timeout: 10000
- assertVisible: "Mixnet"

- tapOn: "Mixnet"
- extendedWaitUntil:
    visible:
      text: "Mixnet"
    timeout: 10000

- tapOn: "Fast"
- extendedWaitUntil:
    visible:
      text: "Fast"
    timeout: 10000
