# Switching between Fast and Mixnet speed modes on the home screen.
appId: net.nymtech.vpn
tags:
  - ui-validation
---
- runFlow: ../../subflows/open_app.yaml

- assertVisible: "Fast"
- assertVisible: "Mixnet"

- tapOn: "Mixnet"
- extendedWaitUntil:
    visible:
      text: "Mixnet"
      selected: true
    timeout: 5000

- tapOn: "Fast"
- extendedWaitUntil:
    visible:
      text: "Fast"
      selected: true
    timeout: 5000
