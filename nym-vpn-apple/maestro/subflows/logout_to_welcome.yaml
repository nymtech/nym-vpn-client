# Logs out of the mock's default session and lands on the welcome sheet.
appId: net.nymtech.vpn
---
- runFlow: open_app.yaml

- tapOn: "Settings"
- extendedWaitUntil:
    visible:
      text: "Account and devices"
    timeout: 10000

- tapOn: "Account and devices"

# The account screen loads asynchronously (its .task polls the account summary).
# Wait for "Account status" - a header near the top - so the screen is populated
# before interacting.
- extendedWaitUntil:
    visible:
      text: "Account status"
    timeout: 15000

# The button renders as "Log out " WITH A TRAILING SPACE. Maestro anchors its
# text regex to the whole string, so a bare "Log out" never matches - the button
# is on screen the whole time but reported "not found". Match the trailing space.
# scrollUntilVisible still handles smaller screens where it sits below the fold.
- scrollUntilVisible:
    element:
      text: "Log out ?"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Log out ?"

# Tapping Log out opens a "Log out of this device?" confirmation dialog whose Yes
# button ALSO reads "Log out". With the list button still behind it, a plain
# tapOn "Log out" is ambiguous and previously hit the wrong one (cancelling the
# dialog). Wait for the dialog title, then tap the dialog's Log out - it is the
# second match (index 1): the dialog is a SwiftUI overlay, so it comes after the
# list button in the tree.
- extendedWaitUntil:
    visible:
      text: "Log out of this device?"
    timeout: 10000
- tapOn:
    text: "Log out ?"
    index: 1

- extendedWaitUntil:
    visible:
      text: "Welcome!"
    timeout: 20000
