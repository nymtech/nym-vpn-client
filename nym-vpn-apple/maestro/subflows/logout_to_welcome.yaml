# Logs out of the mock's default session and lands on the welcome sheet.
appId: net.nymtech.vpn
---
- runFlow: open_app.yaml

- tapOn: "Settings"
- extendedWaitUntil:
    visible:
      text: "Account and devices"
    timeout: 10000

- tapOn: "Account and devices"

# The account screen loads asynchronously (its .task polls the account summary).
# Wait for "Account status" - a header near the top that is on screen without
# scrolling - so the screen is populated before we scroll. Scrolling too early
# (the original bug) moves an empty screen and finds nothing. The Log out button
# and most of the content sit below the fold, so they are reached by scrolling,
# not asserted visible on entry.
- extendedWaitUntil:
    visible:
      text: "Account status"
    timeout: 15000

- scrollUntilVisible:
    element:
      text: "Log out"
    direction: DOWN
    timeout: 20000
- tapOn: "Log out"

# Confirm the logout if a confirmation prompt is shown.
- runFlow:
    when:
      visible: "Log out"
    commands:
      - tapOn: "Log out"

- extendedWaitUntil:
    visible:
      text: "Welcome!"
    timeout: 20000
