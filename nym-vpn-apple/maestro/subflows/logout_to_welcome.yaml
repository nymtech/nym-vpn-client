# Logs out of the mock's default session and lands on the welcome sheet.
appId: net.nymtech.vpn
---
- runFlow: open_app.yaml

- tapOn: "Settings"
- extendedWaitUntil:
    visible:
      text: "Account and devices"
    timeout: 10000

- tapOn: "Account and devices"

# Confirm we actually landed on the account screen before scrolling. This device
# blurb is rendered unconditionally on the account screen (unlike "Account ID",
# which only appears when a real account identifier exists - never in the mock),
# and it shares the content stack with the Log out button below it. If THIS step
# fails, navigation - not the scroll - is the problem.
- extendedWaitUntil:
    visible:
      text: "Use this to link"
    timeout: 10000

# The Log out button sits at the bottom of the account screen, below the fold -
# scroll to it rather than waiting for it to be visible on entry.
- scrollUntilVisible:
    element:
      text: "Log out"
    direction: DOWN
    timeout: 20000
- tapOn: "Log out"

# Confirm the logout if a confirmation prompt is shown.
- runFlow:
    when:
      visible: "Log out"
    commands:
      - tapOn: "Log out"

- extendedWaitUntil:
    visible:
      text: "Welcome!"
    timeout: 20000
