# Taps Connect and clears any VPN permission dialog, leaving the tunnel
# transitioning toward the connected state. Assumes the home screen is showing.
#
# Does not assert the transient "Connecting" label: the mock advances
# connecting -> connected on its own timer and the window is easy to miss, so
# callers wait for the stable "Disconnect" (connected) state instead.
appId: net.nymtech.vpn
---
- tapOn: "Connect"

# Accept the system VPN configuration prompt if the simulator surfaces one.
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
