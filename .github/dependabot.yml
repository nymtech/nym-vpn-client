version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - "pronebird"
    milestone: 6
  - package-ecosystem: gradle
    directory: /nym-vpn-android
    assignees:
      - "mrkiwi"
    schedule:
      interval: weekly
    milestone: 6
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
  - package-ecosystem: swift
    directory: /nym-vpn-apple
    schedule:
      interval: weekly
    milestone: 6
    assignees:
      - "pronebird"
  - package-ecosystem: cargo
    directory: /nym-vpn-core
    assignees:
      - "pronebird"
      - "neacsu"
    schedule:
      interval: weekly
    milestone: 6
    ignore:
      - dependency-name: "nym-*"
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
  # - package-ecosystem: cargo
  #   directory: /nym-vpn-app/src-tauri
  #   assignees:
  #     - "agentpietrucha"
  #   schedule:
  #     interval: weekly
  #   milestone: 6
  #   groups:
  #     patch-updates:
  #       patterns:
  #         - "*"
  #       update-types:
  #         - "patch"
  - package-ecosystem: npm
    directory: /nym-vpn-app
    assignees:
      - "agentpietrucha"
    schedule:
      interval: weekly
    milestone: 6
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
