name: Apple unit tests
description: Run the Apple UnitTests-macOS test plan (PR), summarize to the job step summary, then upload + clean result bundles.
inputs:
  account-report-path:
    description: Absolute path where the ConnectionTypes suite writes account-report.md.
    required: true
runs:
  using: composite
  steps:
    - name: Tests
      shell: bash
      env:
        ACCOUNT_REPORT_PATH: ${{ inputs.account-report-path }}
        TEST_RUNNER_ACCOUNT_REPORT_PATH: ${{ inputs.account-report-path }}
      run: |
          set -uo pipefail
          which jq >/dev/null || brew install jq

          APPLE="$GITHUB_WORKSPACE/nym-vpn-apple"
          BUNDLE="$APPLE/TestResults.xcresult"
          OVERALL=0

          # Suites are selected by UnitTests-macOS.xctestplan. We never abort on a red
          # run — we still want the full summary + report — but OVERALL gates the exit.
          rm -rf "$BUNDLE"
          if ! ( cd "$APPLE" && xcodebuild test \
              -workspace NymVPN.xcworkspace \
              -scheme UnitTests-macOS \
              -destination 'platform=macOS' \
              CODE_SIGNING_ALLOWED=NO \
              -resultBundlePath "$BUNDLE" \
            | xcbeautify --renderer github-actions ); then OVERALL=1; fi

          {
            echo "## 🧪 Apple unit tests"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -d "$BUNDLE" ]]; then
            echo "- ⚠️ no result bundle produced" >> "$GITHUB_STEP_SUMMARY"
            OVERALL=1
          else
            # One line per test target, counted from the leaf test cases.
            TESTS_JSON="$(xcrun xcresulttool get test-results tests --path "$BUNDLE" --format json)"
            jq -r '
              [.. | objects | select(.nodeType? == "Unit test bundle")]
              | .[]
              | [.. | objects | select(.nodeType? == "Test Case") | .result] as $r
              | ($r | map(select(. == "Passed")) | length) as $p
              | ($r | map(select(. == "Failed")) | length) as $f
              | ($r | map(select(. == "Skipped")) | length) as $s
              | "- \(if $f == 0 then "✅" else "❌" end) **\(.name)** — \($p) passed, \($f) failed, \($s) skipped"
            ' <<<"$TESTS_JSON" >> "$GITHUB_STEP_SUMMARY"

            SUMMARY_JSON="$(xcrun xcresulttool get test-results summary --path "$BUNDLE" --format json)"
            TP=$(jq -r '.passedTests // 0' <<<"$SUMMARY_JSON")
            TF=$(jq -r '.failedTests // 0' <<<"$SUMMARY_JSON")
            TS=$(jq -r '.skippedTests // 0' <<<"$SUMMARY_JSON")
            if [[ "$TF" != "0" ]]; then
              OVERALL=1
              {
                echo ""
                echo "| Target | Test | Failure |"
                echo "| --- | --- | --- |"
                jq -r '.testFailures[]? | "| \(.targetName // "") | \(.testName) | \((.failureText // "") | gsub("[\r\n]+"; " ")) |"' <<<"$SUMMARY_JSON"
              } >> "$GITHUB_STEP_SUMMARY"
            fi

            TOT=$((TP + TF + TS))
            ICON="✅"; [[ "$TF" != "0" ]] && ICON="❌"
            {
              echo ""
              echo "$ICON **Total** — ${TP}/${TOT} passed, ${TF} failed, ${TS} skipped"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Account report → step summary
          if [[ -f "$ACCOUNT_REPORT_PATH" ]]; then
            cat "$ACCOUNT_REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "account-report.md not produced" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$OVERALL"

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: apple-unit-tests
        path: |
          nym-vpn-apple/TestResults.xcresult
          account-report.md
        if-no-files-found: warn
        retention-days: 1

    - name: Clean up test results
      if: always()
      shell: bash
      run: |
        rm -rf nym-vpn-apple/TestResults.xcresult
