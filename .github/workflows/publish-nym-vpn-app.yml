name: publish-nym-vpn-app
on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        description: 'Release type, "stable" for public releases (signed Windows only), "rc" for release candidates (signed Windows only), "nightly" for nightly build, "dev" for any other releases'
        options:
          - dev
          - nightly
          - rc
          - stable
        default: dev
        required: true
      pre_release:
        description: 'Label as "Pre-release"'
        required: false
        type: boolean
        default: false
      updater:
        description: "Enable updater (Windows only) and bump metadata (always enabled for stable releases)"
        required: false
        type: boolean
        default: false
      dev_mode:
        description: "Enable dev mode (in-app dev menu)"
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      version_tag:
        description: "Unified release tag (empty = legacy; nym-vpn-nightly = mutable; nym-vpn-v* = immutable ship)"
        type: string
        default: ""
      version:
        description: "Orchestrated app version to embed (empty = use src-tauri/Cargo.toml as before)"
        type: string
        default: ""
      linux:
        type: boolean
        default: false
      windows:
        type: boolean
        default: false
      release_type:
        type: string
        default: "stable"
      core_release_tag:
        type: string
        default: ""
      core_artifact_url:
        type: string
        default: ""

permissions:
  contents: read
  packages: read

env:
  S3_ENDPOINT: https://s3.nymte.ch     # API endpoint for uploads
  S3_BUCKET: builds

jobs:
  download-translations:
    runs-on: arc-linux-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Crowdin CLI
        run: npm install -g @crowdin/cli

      - name: Verify Crowdin install
        run: crowdin --version

      - name: Download translations from Crowdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          crowdin download translations \
            --config crowdin-configs/linux-windows.yml

      - name: Upload translations artifact
        uses: actions/upload-artifact@v7
        with:
          name: translations
          path: nym-vpn-app/src/i18n
          if-no-files-found: error
          retention-days: 1

  build-linux:
    needs: download-translations
    uses: ./.github/workflows/build-nym-vpn-app-linux.yml
    with:
      dev_mode: ${{ github.event_name == 'schedule' || contains(github.ref_name, 'dev') || contains(github.ref_name, 'nightly') || inputs.dev_mode == true }}
      version: ${{ inputs.version }}
    secrets: inherit
  build-windows-x64:
    needs: download-translations
    uses: ./.github/workflows/build-nym-vpn-app-windows.yml
    with:
      cpu_arch: x64
      version: ${{ inputs.version }}
      dev_mode: ${{ github.event_name == 'schedule' || contains(github.ref_name, 'dev') || contains(github.ref_name, 'nightly') || inputs.dev_mode == true  }}
      core_build_it: ${{ inputs.core_release_tag == '' }}
      core_release_tag: ${{ inputs.core_release_tag }}
      sign: ${{ inputs.release_type == 'stable' || inputs.release_type == 'rc' }}
      updater_bundle: ${{ inputs.updater == true || inputs.release_type == 'stable' }}
      updater_channel: ${{ inputs.release_type == 'stable' && 'stable' || 'dev' }}
    secrets: inherit

  build-windows-arm64:
    needs: download-translations
    uses: ./.github/workflows/build-nym-vpn-app-windows.yml
    with:
      cpu_arch: ARM64
      version: ${{ inputs.version }}
      dev_mode: ${{ github.event_name == 'schedule' || contains(github.ref_name, 'dev') || contains(github.ref_name, 'nightly') || inputs.dev_mode == true  }}
      core_build_it: ${{ inputs.core_release_tag == '' }}
      core_release_tag: ${{ inputs.core_release_tag }}
      sign: ${{ inputs.release_type == 'stable' || inputs.release_type == 'rc' }}
      updater_bundle: ${{ inputs.updater == true || inputs.release_type == 'stable' }}
      updater_channel: ${{ inputs.release_type == 'stable' && 'stable' || 'dev' }}
    secrets: inherit

  # For rc builds, also build the Linux core (binaries + .deb) from this branch
  # and upload it to the CI www server, so the Zulip core link resolves to a
  # matching build without a separate publish-nym-vpn-core run. Windows is not
  # uploaded: its installer bundles the core, so there is nothing to publish.
  # Builds both the Linux core binaries and the .deb packages in a single job
  # (the .deb step reuses the release build, so there is no second compile).
  build-core-linux:
    if: ${{ inputs.release_type == 'rc' }}
    uses: ./.github/workflows/build-nym-vpn-core-linux.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  publish-core:
    if: ${{ inputs.release_type == 'rc' }}
    needs:
      - build-core-linux
    runs-on: arc-linux-latest
    outputs:
      # path relative to the nym-vpn-core www base url, e.g. /release/2026.10-tatry/202606091200
      core_build_url_path: ${{ steps.prepare-output-dir.outputs.core_build_url_path }}
    env:
      # core artifact names produced by the reusable build workflows
      # (note: hyphenated; distinct from the app's underscore-named linux_artifacts_*)
      UPLOAD_DIR_LINUX_X86_64: linux_artifacts-x86_64
      UPLOAD_DIR_LINUX_AARCH64: linux_artifacts-aarch64
      UPLOAD_DIR_DEB_X86_64: deb_artifacts-x86_64
      UPLOAD_DIR_DEB_AARCH64: deb_artifacts-aarch64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Install system dependencies
        run: |
          sudo apt update && sudo apt install -y zip

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Install cargo-get
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Get nym-vpn-core workspace version
        id: workspace-version
        uses: nicolaiunrein/cargo-get@master
        with:
          subcommand: workspace.package.version --entry nym-vpn-core

      # Only fetch the core artifacts (skip the app installers/AppImages in this run)
      - name: Download core linux artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: linux_artifacts-*
      - name: Download core deb artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: deb_artifacts-*

      - name: Generate checksums and create archive per platform
        env:
          BASENAME: nym-vpn-core-v${{ steps.workspace-version.outputs.metadata }}
        run: |
          ARCHIVE_LINUX_X86_64=${BASENAME}_linux_x86_64
          ARCHIVE_LINUX_AARCH64=${BASENAME}_linux_aarch64
          echo "ARCHIVE_LINUX_X86_64=${ARCHIVE_LINUX_X86_64}" >> $GITHUB_ENV
          echo "ARCHIVE_LINUX_AARCH64=${ARCHIVE_LINUX_AARCH64}" >> $GITHUB_ENV

          mv -v ${{ env.UPLOAD_DIR_LINUX_X86_64 }} ${ARCHIVE_LINUX_X86_64}
          mv -v ${{ env.UPLOAD_DIR_LINUX_AARCH64 }} ${ARCHIVE_LINUX_AARCH64}

          tar cvzf ${ARCHIVE_LINUX_X86_64}.tar.gz ${ARCHIVE_LINUX_X86_64}
          tar cvzf ${ARCHIVE_LINUX_AARCH64}.tar.gz ${ARCHIVE_LINUX_AARCH64}

          sha256sum ${ARCHIVE_LINUX_X86_64}.tar.gz > "${ARCHIVE_LINUX_X86_64}.tar.gz.sha256sum"
          sha256sum ${ARCHIVE_LINUX_AARCH64}.tar.gz > "${ARCHIVE_LINUX_AARCH64}.tar.gz.sha256sum"

          for dir in "${{ env.UPLOAD_DIR_DEB_X86_64 }}" "${{ env.UPLOAD_DIR_DEB_AARCH64 }}"; do
            pushd "$dir"
            for deb in *.deb; do
              sha256sum "$deb" > "$deb.sha256sum"
            done
            popd
          done

      - name: Prepare build output directory
        id: prepare-output-dir
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          OUTPUT_DIR_BASE: ci-builds
        run: |
          BRANCH_PATH="${BRANCH_NAME//[^a-zA-Z0-9._\/-]/}"
          TIMESTAMP=$(date +%Y%m%d%H%M) # Short and suitable for paths
          OUTPUT_DIR="$OUTPUT_DIR_BASE/$BRANCH_PATH/$TIMESTAMP"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV
          rm -rf ci-builds || true
          mkdir -p "$OUTPUT_DIR"
          echo "core_build_url_path=/$BRANCH_PATH/$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT_DIR"

      - name: Prepare build output artifacts
        run: |
          cp -v ${{ env.ARCHIVE_LINUX_X86_64 }}.tar.gz ${{ env.OUTPUT_DIR }}
          cp -v ${{ env.ARCHIVE_LINUX_X86_64 }}.tar.gz.sha256sum ${{ env.OUTPUT_DIR }}
          cp -v ${{ env.ARCHIVE_LINUX_AARCH64 }}.tar.gz ${{ env.OUTPUT_DIR }}
          cp -v ${{ env.ARCHIVE_LINUX_AARCH64 }}.tar.gz.sha256sum ${{ env.OUTPUT_DIR }}
          cp -v ${{ env.UPLOAD_DIR_DEB_X86_64 }}/*.{deb,sha256sum} ${{ env.OUTPUT_DIR }}
          cp -v ${{ env.UPLOAD_DIR_DEB_AARCH64 }}/*.{deb,sha256sum} ${{ env.OUTPUT_DIR }}

      # Garage's web vhost serves no directory listings, so this producer must
      # emit the same discovery contract consumers expect (latest.json pointer +
      # per-build manifest.json). Canonical implementation: publish-nym-vpn-core.yml
      # "Generate build manifest" — keep these two in sync. This (rc) job ships
      # only the linux core + debs, so the required-artifact set is smaller (no
      # windows/android). Shape: { "timestamp": "<YYYYMMDDhhmm>", "files": [...] }.
      - name: Generate build manifest
        shell: bash
        run: |
          set -euo pipefail
          TIMESTAMP="$(basename "${{ env.OUTPUT_DIR }}")"
          BRANCH_DIR="$(dirname "${{ env.OUTPUT_DIR }}")"
          MANIFEST="${{ env.OUTPUT_DIR }}/manifest.json"

          manifest_json="$(cd "${{ env.OUTPUT_DIR }}" && ls -1 | sort | jq -R . \
            | jq -s --arg ts "$TIMESTAMP" '{timestamp: $ts, files: .}')"
          printf '%s\n' "$manifest_json" > "$MANIFEST"

          # validate + sanity-check the consumer-facing artifacts this job publishes
          jq empty "$MANIFEST"
          for must in _linux_x86_64.tar.gz _linux_aarch64.tar.gz _amd64.deb _arm64.deb; do
            jq -e --arg s "$must" '[.files[] | select(endswith($s))] | length > 0' "$MANIFEST" >/dev/null \
              || { echo "manifest missing expected artifact *$must" >&2; exit 1; }
          done

          cp "$MANIFEST" "${BRANCH_DIR}/latest.json"
          echo "---- manifest ----"
          cat "$MANIFEST"

      - name: Publish build to S3
        uses: ./.github/actions/push-to-s3
        with:
          source_path: ci-builds/
          destination: nym-vpn-client/nym-vpn-core/
          endpoint: ${{ env.S3_ENDPOINT }}
          bucket: ${{ env.S3_BUCKET }}
          aws_access_key_id: ${{ secrets.GARAGE_AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.GARAGE_AWS_SECRET_ACCESS_KEY }}

  generate-build-info-nym-vpn-app:
    uses: ./.github/workflows/generate-build-info-nym-vpn-app.yml
    needs: build-linux
    with:
      build-profile: release

  publish:
    needs:
      - build-linux
      - build-windows-x64
      - build-windows-arm64
      - generate-build-info-nym-vpn-app
    runs-on: arc-linux-latest
    outputs:
      release_tag: ${{ steps.set_tag.outputs.tag }}
      core_release_tag: ${{ steps.set_core_tag.outputs.tag }}
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.cargo-get.outputs.metadata }}
      win_updater_x64_exe: ${{ steps.win_updater_x64.outputs.exe }}
      win_updater_x64_sig: ${{ steps.win_updater_x64.outputs.sig }}
      win_updater_arm64_exe: ${{ steps.win_updater_arm64.outputs.exe }}
      win_updater_arm64_sig: ${{ steps.win_updater_arm64.outputs.sig }}
      core_build_url_path: ${{ needs.build-windows-x64.outputs.core_build_url_path }}
    env:
      # stable | nightly | dev
      RELEASE_TYPE: ${{ inputs.release_type || (github.event_name == 'schedule' && 'nightly' || 'dev') }}
      # GH needed for gh cli
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPLOAD_DIR_LINUX_X86_64: linux_artifacts_x86_64
      UPLOAD_DIR_LINUX_AARCH64: linux_artifacts_aarch64
      UPLOAD_DIR_WINDOWS_X64: ${{ needs.build-windows-x64.outputs.UPLOAD_DIR_WINDOWS }}
      UPLOAD_DIR_WINDOWS_ARM64: ${{ needs.build-windows-arm64.outputs.UPLOAD_DIR_WINDOWS }}
      UPDATER_ENABLED: ${{ inputs.updater == true || inputs.release_type == 'stable' }}
    permissions: write-all
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Get package version
        id: cargo-get
        uses: nicolaiunrein/cargo-get@master
        with:
          subcommand: package.version --entry nym-vpn-app/src-tauri

      - name: Get nym-vpn-core workspace version
        id: cargo-get-core
        uses: nicolaiunrein/cargo-get@master
        with:
          subcommand: workspace.package.version --entry nym-vpn-core

      - name: Set output 'core_release_tag'
        id: set_core_tag
        run: echo "tag=nym-vpn-core-v${{ steps.cargo-get-core.outputs.metadata }}" >> "$GITHUB_OUTPUT"

      - name: Check tag name consistency
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ nym-vpn-app-v${{ steps.cargo-get.outputs.metadata }} != ${{ github.ref_name }} ]]; then
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8

      # Setup TAG_NAME
      - if: github.event_name == 'workflow_dispatch'
        run: echo "TAG_NAME=nym-vpn-app-v${{ steps.cargo-get.outputs.metadata }}" >> $GITHUB_ENV
      - if: ${{ env.RELEASE_TYPE == 'nightly' }}
        run: echo "TAG_NAME=nym-vpn-app-nightly" >> $GITHUB_ENV
      - if: github.event_name == 'push'
        run: echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Set output 'tag'
        id: set_tag
        run: echo "tag=${{ env.TAG_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Set output for updater (Windows x64)
        if: ${{ env.UPDATER_ENABLED == 'true' }}
        id: win_updater_x64
        working-directory: ${{ env.UPLOAD_DIR_WINDOWS_X64 }}
        run: |
          shopt -s failglob
          exe=(*setup.exe)
          echo "exe=${exe[0]}" >> "$GITHUB_OUTPUT"
          sig=$(head -n 1 *.exe.sig)
          echo "sig=$sig" >> "$GITHUB_OUTPUT"

      - name: Set output for updater (Windows ARM64)
        if: ${{ env.UPDATER_ENABLED == 'true' }}
        id: win_updater_arm64
        working-directory: ${{ env.UPLOAD_DIR_WINDOWS_ARM64 }}
        run: |
          shopt -s failglob
          exe=(*setup.exe)
          echo "exe=${exe[0]}" >> "$GITHUB_OUTPUT"
          sig=$(head -n 1 *.exe.sig)
          echo "sig=$sig" >> "$GITHUB_OUTPUT"

      - name: Remove previous nightly release
        if: ${{ env.RELEASE_TYPE == 'nightly' }}
        run: |
          gh release delete nym-vpn-app-nightly --yes || true
          git push origin :nym-vpn-app-nightly || true

      - name: Generate checksums
        run: |
          pushd ${{ env.UPLOAD_DIR_LINUX_X86_64 }} || exit 1
            for f in *; do sha256sum "$f" > "$f.sha256sum"; done
          popd

          pushd ${{ env.UPLOAD_DIR_LINUX_AARCH64 }} || exit 1
            for f in *; do sha256sum "$f" > "$f.sha256sum"; done
          popd

          pushd ${{ env.UPLOAD_DIR_WINDOWS_X64 }} || exit 1
            exe=(*setup.exe)
            sha256sum "${exe[0]}" > "${exe[0]}.sha256sum";
          popd

          pushd ${{ env.UPLOAD_DIR_WINDOWS_ARM64 }} || exit 1
            exe=(*setup.exe)
            sha256sum "${exe[0]}" > "${exe[0]}.sha256sum";
          popd

          echo 'SHA256SUMS<<EOF' >> $GITHUB_ENV
          cat ${{ env.UPLOAD_DIR_LINUX_X86_64 }}/*.sha256sum >> $GITHUB_ENV
          cat ${{ env.UPLOAD_DIR_LINUX_AARCH64 }}/*.sha256sum >> $GITHUB_ENV
          cat ${{ env.UPLOAD_DIR_WINDOWS_X64 }}/*.sha256sum >> $GITHUB_ENV
          cat ${{ env.UPLOAD_DIR_WINDOWS_ARM64 }}/*.sha256sum >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: Build info
        run: |
          echo 'BUILD_INFO<<EOF' >> $GITHUB_ENV
          cat build-info/build-info.txt >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: Set release notes header (stable)
        if: ${{ env.RELEASE_TYPE == 'stable' }}
        env:
          EMOJI: ":ship:"
        run: echo "RELEASE_NOTES_HEADER='$EMOJI Linux and Windows desktop app'" >> $GITHUB_ENV

      - name: Set release notes header (dev + rc)
        if: ${{ env.RELEASE_TYPE == 'dev' || env.RELEASE_TYPE == 'rc' }}
        env:
          EMOJI: ":hammer_and_wrench:"
        run: echo "RELEASE_NOTES_HEADER='$EMOJI Linux and Windows desktop app, **dev** build'" >> $GITHUB_ENV

      - name: Set release notes header (nightly)
        if: ${{ env.RELEASE_TYPE == 'nightly' }}
        env:
          EMOJI: ":night_with_stars:"
        run: echo "RELEASE_NOTES_HEADER='$EMOJI Linux and Windows desktop app, **nightly** build'" >> $GITHUB_ENV

      - name: Release notes
        run: |
          {
            echo 'RELEASE_NOTES<<EOF'
            echo '${{ env.RELEASE_NOTES_HEADER }}

          ```
          ${{ env.BUILD_INFO }}
          ```

          [CHANGELOG](https://github.com/nymtech/nym-vpn-client/blob/develop/nym-vpn-app/CHANGELOG.md)
          '
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Create release
        id: create_release
        if: ${{ inputs.version_tag == '' && env.RELEASE_TYPE != 'dev' }}
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ env.RELEASE_NOTES }}
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          draft: false
          make_latest: ${{ env.RELEASE_TYPE == 'stable' }}
          prerelease: ${{ env.RELEASE_TYPE != 'stable' || inputs.pre_release }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.UPLOAD_DIR_LINUX_X86_64 }}/*
            ${{ env.UPLOAD_DIR_LINUX_AARCH64 }}/*
            ${{ env.UPLOAD_DIR_WINDOWS_X64 }}/*
            ${{ env.UPLOAD_DIR_WINDOWS_ARM64 }}/*

      - name: Append linux + windows artifacts to unified release
        if: ${{ inputs.version_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          files=()
          # Collect files, dropping byte-identical duplicate basenames (e.g. the
          # arch-independent `.pkg/linux/install` script copied into every arch dir).
          # A release can hold only one asset per name, and we upload without
          # --clobber; FAIL loudly if two same-named files actually differ so a real
          # collision is renamed rather than silently dropped.
          # Plain indexed array (no `declare -A`/`mapfile`) so it runs on any bash.
          collect() {
            local f b i dup
            while IFS= read -r f; do
              b=$(basename "$f")
              dup=""
              for i in "${files[@]:-}"; do
                [ -n "$i" ] || continue
                if [ "$(basename "$i")" = "$b" ]; then dup="$i"; break; fi
              done
              if [ -n "$dup" ]; then
                cmp -s "$f" "$dup" || { echo "::error:: distinct files share asset name '$b' ('$f' vs '$dup')"; exit 1; }
                echo "::notice:: skipping duplicate asset '$b' ($f); identical to $dup"
                continue
              fi
              files+=( "$f" )
            done
          }
          if [ "${{ inputs.linux }}" = "true" ]; then
            collect < <(find "${{ env.UPLOAD_DIR_LINUX_X86_64 }}" "${{ env.UPLOAD_DIR_LINUX_AARCH64 }}" -type f)
          fi
          if [ "${{ inputs.windows }}" = "true" ]; then
            collect < <(find "${{ env.UPLOAD_DIR_WINDOWS_X64 }}" "${{ env.UPLOAD_DIR_WINDOWS_ARM64 }}" -type f)
          fi
          [ "${#files[@]}" -gt 0 ] || { echo "::error:: no files selected to append"; exit 1; }
          # Append to the draft. No --clobber: gh refuses a duplicate so files
          # can't be overwritten. GitHub freezes the release at publish.
          gh release upload "$VERSION_TAG" "${files[@]}"

  windows-updater:
    uses: ./.github/workflows/tauri-updater.yml
    permissions:
      contents: write
      pull-requests: write
    needs: publish
    # version_tag set = orchestrated unified run: release is a DRAFT, so defer the
    # updater feed (references public release-download URLs) until manual publish.
    if: ${{ (inputs.updater == true || inputs.release_type == 'stable') && inputs.version_tag == '' }}
    with:
      channel: ${{ inputs.release_type == 'stable' && 'stable' || 'dev' }}
      version: ${{ needs.publish.outputs.version }}
      base_url: https://github.com/nymtech/nym-vpn-client/releases/download/${{ needs.publish.outputs.release_tag }}
      signature_x64: ${{ needs.publish.outputs.win_updater_x64_sig }}
      signature_arm64: ${{ needs.publish.outputs.win_updater_arm64_sig }}

  update-aur-app:
    uses: ./.github/workflows/publish-aur-nym-vpn-app.yml
    needs: publish
    # Deferred under orchestration (version_tag set): AUR pulls public release assets
    # which 404 while the unified release is a draft. Run after manual publish.
    if: ${{ inputs.release_type == 'stable' && inputs.version_tag == '' }}
    with:
      release_tag: ${{ needs.publish.outputs.release_tag }}
      pkgrel: 1
      publish_aur: true
      commit_msg: "v${{ needs.publish.outputs.version }}"
    secrets: inherit

  post-release:
    uses: ./.github/workflows/tauri-post-release.yml
    needs: publish
    permissions:
      contents: write
      pull-requests: write
    # Deferred under orchestration (version_tag set): opens PRs against public release
    # assets. Run after manual publish.
    if: ${{ inputs.release_type == 'stable' && inputs.version_tag == '' }}
    with:
      release_tag: ${{ needs.publish.outputs.release_tag }}
      version: ${{ needs.publish.outputs.version }}
      core_release_tag: ${{ needs.publish.outputs.core_release_tag }}

  zulip-notify:
    runs-on: arc-linux-latest
    needs:
      - publish
      - publish-core
    # publish-core is skipped for non-rc builds; still notify as long as publish succeeded
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    continue-on-error: true
    env:
      # stable | nightly | dev
      RELEASE_TYPE: ${{ inputs.release_type || (github.event_name == 'schedule' && 'nightly' || 'dev') }}
    steps:
      - name: Set topic
        # tauri-release | tauri-dev
        run: |
          topic=${{ inputs.release_type == 'stable' && 'tauri-release' || 'tauri-dev' }}
          echo $topic
          echo "TOPIC=$topic" >> "$GITHUB_ENV"

      - name: Set release link
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
        run: |
          if [[ -n "$VERSION_TAG" ]]; then
            # orchestrated unified run: release is pre-created at VERSION_TAG and assets
            # are uploaded to it; the per-product release_tag is not the published one.
            url="https://github.com/${{ github.repository }}/releases/tag/$VERSION_TAG"
          elif [[ "${{ env.RELEASE_TYPE }}" == "dev" ]]; then
            # dev builds create no GitHub release; link to the workflow run instead.
            url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            # standalone run: per-product release created at RELEASE_TAG.
            url="https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
          fi
          echo "RELEASE_LINK=$url" >> "$GITHUB_ENV"

      - name: Set message
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          EMOJI: ${{ (env.RELEASE_TYPE == 'stable' && ':ship:') || (env.RELEASE_TYPE == 'nightly' && ':night:') || ':hammer_and_wrench:' }}
          NAME: ${{ env.RELEASE_TYPE == 'stable' && 'release' || (env.RELEASE_TYPE == 'nightly' && 'nightly build') || 'dev build' }}
        run: |
          {
            echo 'MESSAGE<<EOF'
            printf '%s **%s** `%s`\n[release](%s)\n' "$EMOJI" "$NAME" "$VERSION" "$RELEASE_LINK"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Send Zulip message
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_APE_BOT_API_KEY }}
          email: ${{ secrets.ZULIP_APE_BOT_EMAIL }}
          organization-url: ${{ secrets.ZULIP_EXTERNALS_ORG_URL }}
          to: "24"
          type: "stream"
          topic: ${{ env.TOPIC }}
          content: ${{ env.MESSAGE }}

  gen-hashes:
    uses: ./.github/workflows/gen-hashes-json.yml
    needs: publish
    # Deferred under orchestration (version_tag set): hashes the public release assets.
    # Run after manual publish.
    if: ${{ inputs.release_type == 'stable' && inputs.version_tag == '' }}
    permissions:
      contents: write
    with:
      release_tag: ${{ needs.publish.outputs.release_tag }}
    secrets: inherit
