name: ci-nym-ifconfig-macos
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ci-nym-ifconfig-macos.yml
      - "crates/nym-ifconfig/**/*.rs"
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    strategy:
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build
        working-directory: nym-vpn-core
        run: cargo build --profile ci --package nym-ifconfig --locked

      - name: Test
        working-directory: nym-vpn-core
        run: sudo -E cargo test --profile ci --package nym-ifconfig --locked
