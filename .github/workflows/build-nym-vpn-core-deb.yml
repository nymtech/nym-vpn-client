name: build-nym-vpn-core-deb
on:
  pull_request:
    types: [opened]
    paths:
      - ".github/workflows/build-nym-vpn-core-deb.yml"
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wireguard-go-linux:
    uses: ./.github/workflows/build-wireguard-go-linux.yml
    with:
      artifact_suffix: "deb"

  build-linux:
    strategy:
      matrix:
        include:
          - os: "ubuntu-22.04"
            arch: "x86_64"
          - os: "ubuntu-22.04-arm"
            arch: "aarch64"

    if: github.actor != 'dependabot[bot]'
    needs: build-wireguard-go-linux
    runs-on: ${{ matrix.os }}
    env:
      UPLOAD_DIR_DEB: deb_artifacts-${{ matrix.arch }}
    outputs:
      UPLOAD_DIR_DEB: ${{ env.UPLOAD_DIR_DEB }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev libmnl-dev libnftnl-dev protobuf-compiler

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Install cargo-deb
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deb
          cache-key: ${{ matrix.arch }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "21.12" # 3.21.12: the version on ubuntu 24.04. Don't change this!
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get workspace version
        id: workspace-version
        uses: nicolaiunrein/cargo-get@master
        with:
          subcommand: workspace.package.version --entry nym-vpn-core

      - name: Install cargo-edit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-edit
          cache-key: ${{ matrix.arch }}

      - name: Append timestamp if it's a dev version
        run:
          ./scripts/append-timestamp-to-version.sh nym-vpn-core/Cargo.toml ${{
          steps.workspace-version.outputs.metadata }}

      - name: Download wireguard-go artifacts
        uses: actions/download-artifact@v8
        with:
          name: wireguard_go_deb-${{ matrix.arch }}
          path: build/lib

      - name: Build nym-vpn-core debian packages
        working-directory: nym-vpn-core
        env:
          SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}
        run: |
          cargo deb -p nym-vpnd
          cargo deb -p nym-vpnc
          ls -la target/debian/ || true

      - name: Move things around to prepare for upload
        env:
          SRC_BINARY: nym-vpn-core/target/debian
        run: |
          mkdir ${{ env.UPLOAD_DIR_DEB }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-vpnc_*.deb ${{ env.UPLOAD_DIR_DEB }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-vpnd_*.deb ${{ env.UPLOAD_DIR_DEB }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UPLOAD_DIR_DEB }}
          path: ${{ env.UPLOAD_DIR_DEB }}
          if-no-files-found: error
          retention-days: 1
