name: crowdin-android-upload

on:
  push:
    branches:
      - develop
    paths:
      - "nym-vpn-android/app/src/main/res/values/strings.xml"
      - "nym-vpn-android/core/src/main/res/values/strings.xml"
      - "fastlane/metadata/android/en-US/changelogs/**"
  workflow_dispatch:

jobs:
  crowdin-upload:
    runs-on: arc-linux-latest-dind

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: crowdin action
        uses: crowdin/github-action@v3
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          config: "crowdin-configs/android.yml"
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}