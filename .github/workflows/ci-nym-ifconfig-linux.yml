name: ci-nym-ifconfig-linux
on:
  pull_request:
    paths:
      - .github/workflows/ci-nym-ifconfig-linux.yml
      - "crates/nym-ifconfig/**/*.rs"
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Set Rust caching env vars only on non-release runs
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - uses: actions/checkout@v6

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ vars.REQUIRED_RUSTC_VERSION }}

      - name: Build
        working-directory: nym-vpn-core
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo build --package nym-ifconfig --locked

      - name: Build tests
        working-directory: nym-vpn-core
        id: build-tests
        run: |
          EXEC=$(cargo test --package nym-ifconfig --no-run --locked --message-format json | jq 'select(.reason == "compiler-artifact" and .target.name == "nym_ifconfig" and .executable != null) | .executable')
          echo "Got executable: $EXEC"
          echo "exec=$EXEC" >> "$GITHUB_OUTPUT"

      - name: Set cap_net_admin
        working-directory: nym-vpn-core
        run: sudo setcap 'cap_net_admin=ep' "${{ steps.build-tests.outputs.exec }}"

      - name: Test
        working-directory: nym-vpn-core
        run: cargo test --package nym-ifconfig
