name: ci-nym-ifconfig-linux
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ci-nym-ifconfig-linux.yml
      - "crates/nym-ifconfig/**/*.rs"
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build
        working-directory: nym-vpn-core
        run: cargo build --profile ci --package nym-ifconfig --locked

      - name: Build tests
        working-directory: nym-vpn-core
        id: build-tests
        run: |
          EXEC=$(cargo test --profile ci --package nym-ifconfig --no-run --locked --message-format json | jq 'select(.reason == "compiler-artifact" and .target.name == "nym_ifconfig" and .executable != null) | .executable')
          echo "Got executable: $EXEC"
          echo "exec=$EXEC" >> "$GITHUB_OUTPUT"

      - name: Set cap_net_admin
        working-directory: nym-vpn-core
        run: sudo setcap 'cap_net_admin=ep' "${{ steps.build-tests.outputs.exec }}"

      - name: Test
        working-directory: nym-vpn-core
        run: cargo test --profile ci --package nym-ifconfig
