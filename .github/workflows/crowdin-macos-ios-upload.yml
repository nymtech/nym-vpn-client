name: crowdin-macos-ios-upload

on:
  push:
    branches:
      - develop
    paths: "nym-vpn-apple/NymVPN/Resources/Localizable.xcstrings"
  workflow_dispatch:

concurrency:
  group: crowdin-global-sync
  cancel-in-progress: false
  queue: max

jobs:
  crowdin-upload:
    runs-on: arc-linux-latest-dind

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: crowdin action
        uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v3.6.0
        with:
          upload_sources: true
          upload_translations: true
          download_translations: false
          config: "crowdin-configs/macos-ios.yml"
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
