name: build-nym-vpn-core-linux
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/build-nym-vpn-core-linux.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Orchestrated app version to embed (empty = self-bump as before)"
        type: string
        default: ""
    secrets:
      VPND_SENTRY_DSN:
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wireguard-go-linux:
    uses: ./.github/workflows/build-wireguard-go-linux.yml

  build-nym-vpn-core-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "arc-ubuntu-22.04"
            arch: "x86_64"
            target: "x86_64-unknown-linux-gnu"
          - os: "arc-ubuntu-22.04"
            arch: "aarch64"
            target: "aarch64-unknown-linux-gnu"

    if: github.actor != 'dependabot[bot]'
    needs: build-wireguard-go-linux
    env:
      UPLOAD_DIR_LINUX: core_artifacts_linux_${{ matrix.arch }}
      UPLOAD_DIR_DEB: deb_artifacts_${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    outputs:
      UPLOAD_DIR_LINUX: ${{ env.UPLOAD_DIR_LINUX }}
      UPLOAD_DIR_DEB: ${{ env.UPLOAD_DIR_DEB }}
      RUST_VERSION: ${{ steps.rust-version.outputs.rustc }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Install system dependencies
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo add-apt-repository --remove "deb http://archive.ubuntu.com/ubuntu jammy main restricted"
            sudo dpkg --add-architecture arm64
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libdbus-1-dev:arm64 libmnl-dev:arm64 libnftnl-dev:arm64 protobuf-compiler
          else
            sudo apt-get update && sudo apt-get install -y libdbus-1-dev libmnl-dev libnftnl-dev protobuf-compiler
          fi

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "21.12" # 3.21.12: the version on ubuntu 24.04. Don't change this!
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-edit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-edit
          cache-key: ${{ matrix.arch }}

      - name: Install cargo-deb
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deb
          cache-key: ${{ matrix.arch }}

      - name: Install cargo-get
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get
          cache-key: ${{ matrix.arch }}

      - name: Install toml-cli
        uses: baptiste0928/cargo-install@v3
        with:
          crate: toml-cli
          cache-key: ${{ matrix.arch }}

      - name: Apply orchestrated version
        uses: ./.github/workflows/platform/apply-version
        with:
          version: ${{ inputs.version }}
          target: core

      - name: Download wireguard-go artifacts
        uses: actions/download-artifact@v8
        with:
          name: wireguard-go_${{ matrix.arch }}-linux-unknown
          path: build/lib

      - name: Build nym-vpn-core
        working-directory: nym-vpn-core
        env:
          SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          PKG_CONFIG_PATH: ${{ matrix.arch == 'aarch64' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.arch == 'aarch64' && '1' || '' }}
        run: |
          cargo build --release --target ${{ matrix.target }}

      # Reuses the release artifacts compiled above (same target dir), so this
      # only packages the .deb files instead of recompiling from scratch.
      - name: Build nym-vpn-core debian packages
        working-directory: nym-vpn-core
        env:
          SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          PKG_CONFIG_PATH: ${{ matrix.arch == 'aarch64' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.arch == 'aarch64' && '1' || '' }}
        run: |
          cargo deb --target ${{ matrix.target }} -p nym-vpnd --no-build
          cargo deb --target ${{ matrix.target }} -p nym-vpnc --no-build

      - name: Get rust version used for build
        id: rust-version
        run: |
          echo "rustc=$(rustc -V)" >> $GITHUB_OUTPUT

      - name: Move things around to prepare for upload
        env:
          SRC_BINARY: nym-vpn-core/target/${{ matrix.target }}/release
          SRC_DEB: nym-vpn-core/target/${{ matrix.target }}/debian
        run: |
          mkdir ${{ env.UPLOAD_DIR_LINUX }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-vpnc ${{ env.UPLOAD_DIR_LINUX }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-vpnd ${{ env.UPLOAD_DIR_LINUX }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-exclude ${{ env.UPLOAD_DIR_LINUX }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-socks5-proxy ${{ env.UPLOAD_DIR_LINUX }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-diagnostic ${{ env.UPLOAD_DIR_LINUX }}

          mkdir ${{ env.UPLOAD_DIR_DEB }}
          cp -vpr ${{ env.SRC_DEB }}/nym-vpnc_*.deb ${{ env.UPLOAD_DIR_DEB }}
          cp -vpr ${{ env.SRC_DEB }}/nym-vpnd_*.deb ${{ env.UPLOAD_DIR_DEB }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UPLOAD_DIR_LINUX }}
          path: ${{ env.UPLOAD_DIR_LINUX }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UPLOAD_DIR_DEB }}
          path: ${{ env.UPLOAD_DIR_DEB }}
          if-no-files-found: error
          retention-days: 1
