name: build-nym-vpn-core-linux
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/build-nym-vpn-core-linux.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Orchestrated app version to embed (empty = self-bump as before)"
        type: string
        default: ""
    secrets:
      VPND_SENTRY_DSN:
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wireguard-go-linux:
    uses: ./.github/workflows/build-wireguard-go-linux.yml

  build-nym-vpn-core-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "arc-ubuntu-22.04"
            arch: "x86_64"
          - os: "ubuntu-22.04-8c-arm"
            arch: "aarch64"

    if: github.actor != 'dependabot[bot]'
    needs: build-wireguard-go-linux
    env:
      UPLOAD_DIR_LINUX: core_artifacts_linux_${{ matrix.arch }}
      UPLOAD_DIR_DEB: deb_artifacts_${{ matrix.arch }}
      DEBUG_SYMBOLS_DIR_LINUX: core_debug_symbols_linux_${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    outputs:
      UPLOAD_DIR_LINUX: ${{ env.UPLOAD_DIR_LINUX }}
      UPLOAD_DIR_DEB: ${{ env.UPLOAD_DIR_DEB }}
      RUST_VERSION: ${{ steps.rust-version.outputs.rustc }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev libmnl-dev libnftnl-dev protobuf-compiler libnm-dev libgtk-3-dev libgtk-4-dev

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "21.12" # 3.21.12: the version on ubuntu 24.04. Don't change this!
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-edit
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-edit
          cache-key: ${{ matrix.arch }}

      - name: Install cargo-deb
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-deb
          cache-key: ${{ matrix.arch }}

      - name: Install cargo-get
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-get
          cache-key: ${{ matrix.arch }}

      - name: Install toml-cli
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: toml-cli
          cache-key: ${{ matrix.arch }}

      - name: Apply orchestrated version
        uses: ./.github/actions/apply-version
        with:
          version: ${{ inputs.version }}
          target: core

      - name: Download wireguard-go artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wireguard-go_${{ matrix.arch }}-linux-unknown
          path: build/lib

      - name: Build nym-vpn-core
        working-directory: nym-vpn-core
        env:
          SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}
          # Keep debug info in the binaries so it can be split off with objcopy
          # below. Sentry can't read split DWARF packages (.dwp).
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
          CARGO_PROFILE_RELEASE_STRIP: none
        run: |
          export RUSTFLAGS="--remap-path-prefix $HOME= --remap-path-prefix $GITHUB_WORKSPACE= --remap-path-prefix $(rustc --print sysroot)= -C link-arg=-Wl,--build-id=sha1"
          cargo build --release

      - name: Split debug symbols from binaries
        env:
          SRC_BINARY: nym-vpn-core/target/release
        run: |
          set -euo pipefail
          mkdir ${{ env.DEBUG_SYMBOLS_DIR_LINUX }}
          for bin in nym-vpnc nym-vpnd nym-exclude nym-socks5-proxy nym-diagnostic nm-nymvpn-service; do
            if ! readelf -n "$SRC_BINARY/$bin" | grep -q "Build ID"; then
              echo "::error::$bin has no GNU build ID, Sentry won't be able to match debug symbols"
              exit 1
            fi
            debug_file="${{ env.DEBUG_SYMBOLS_DIR_LINUX }}/$bin.debug"
            objcopy --only-keep-debug "$SRC_BINARY/$bin" "$debug_file"
            objcopy --strip-debug --add-gnu-debuglink="$debug_file" "$SRC_BINARY/$bin"
          done

      # Must run before packaging: the nym-vpnc deb assets include these files.
      - name: Generate nym-vpnc shell completions
        working-directory: nym-vpn-core
        run: |
          COMPLETIONS_DIR=target/release/completions
          mkdir -p "$COMPLETIONS_DIR"
          target/release/nym-vpnc completions bash > "$COMPLETIONS_DIR/nym-vpnc.bash"
          target/release/nym-vpnc completions zsh > "$COMPLETIONS_DIR/_nym-vpnc"
          target/release/nym-vpnc completions fish > "$COMPLETIONS_DIR/nym-vpnc.fish"

      - name: Build NetworkManager editor plugin libraries
        run: make -C nym-vpn-core/crates/nym-nm-vpn-plugin/editor

      # Reuses the release artifacts compiled above (same target dir), so this
      # only packages the .deb files instead of recompiling from scratch.
      - name: Build nym-vpn-core debian packages
        working-directory: nym-vpn-core
        env:
          SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}
        run: |
          cargo deb -p nym-vpnd --no-build
          cargo deb -p nym-vpnc --no-build
          cargo deb -p nym-nm-vpn-plugin --no-build

      - name: Get rust version used for build
        id: rust-version
        run: |
          echo "rustc=$(rustc -V)" >> $GITHUB_OUTPUT

      - name: Move things around to prepare for upload
        env:
          SRC_BINARY: nym-vpn-core/target/release
          SRC_DEB: nym-vpn-core/target/debian
        run: |
          mkdir ${{ env.UPLOAD_DIR_LINUX }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-vpnc ${{ env.UPLOAD_DIR_LINUX }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-vpnd ${{ env.UPLOAD_DIR_LINUX }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-exclude ${{ env.UPLOAD_DIR_LINUX }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-socks5-proxy ${{ env.UPLOAD_DIR_LINUX }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-diagnostic ${{ env.UPLOAD_DIR_LINUX }}
          cp -vpr ${{ env.SRC_BINARY }}/nm-nymvpn-service ${{ env.UPLOAD_DIR_LINUX }}

          mkdir ${{ env.UPLOAD_DIR_DEB }}
          cp -vpr ${{ env.SRC_DEB }}/nym-vpnc_*.deb ${{ env.UPLOAD_DIR_DEB }}
          cp -vpr ${{ env.SRC_DEB }}/nym-vpnd_*.deb ${{ env.UPLOAD_DIR_DEB }}
          cp -vpr ${{ env.SRC_DEB }}/nym-vpn-networkmanager_*.deb ${{ env.UPLOAD_DIR_DEB }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.UPLOAD_DIR_LINUX }}
          path: ${{ env.UPLOAD_DIR_LINUX }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload deb artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.UPLOAD_DIR_DEB }}
          path: ${{ env.UPLOAD_DIR_DEB }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.DEBUG_SYMBOLS_DIR_LINUX }}
          path: ${{ env.DEBUG_SYMBOLS_DIR_LINUX }}
          if-no-files-found: error
          retention-days: 1
