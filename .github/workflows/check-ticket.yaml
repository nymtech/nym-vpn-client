name: check-ticket

on:
  pull_request:
    branches:
      - develop
      - "release/**"
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read
  issues: read

jobs:
  check-ticket:
    name: Check ticket in PR description
    runs-on: arc-linux-latest
    if: >
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'no-ticket') == false
    env:
      PR_BODY: ${{ toJSON(github.event.pull_request.body) }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require JIRA ticket or nymtech GitHub issue
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request
          body = json.loads(os.environ["PR_BODY"] or "null") or ""
          pr_number = int(os.environ["PR_NUMBER"])
          repo = os.environ["GITHUB_REPOSITORY"].lower()
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          MAX_API_REQUESTS = 5

          def is_issue(full, num):
              req = urllib.request.Request(
                  f"{api}/repos/{full}/issues/{num}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.load(resp)
              except urllib.error.HTTPError as e:
                  if e.code in (404, 410):
                      return False
                  raise
              return "pull_request" not in data

          if re.search(r"(?i)(?<![\w-])(?:JIRA-)?(?:NYM|VPN)-\d+(?![\w-])", body):
              sys.exit(0)
          refs = re.findall(
              r"(?i)https?://(?:www\.)?github\.com/(nymtech/[\w.-]+)/issues/(\d+)",
              body,
          ) + re.findall(
              r"(?i)(?<![\w/#&])(nymtech/[\w.-]+)?#(\d+)(?!\w)",
              body,
          )
          external_refs = []
          nums = []
          for full, num in refs:
              if full and full.lower() != repo:
                  external_refs.append((full, num))
              elif int(num) != pr_number and int(num) not in nums:
                  nums.append(int(num))
          for full, num in external_refs:
              print(f"Accepting {full}#{num} without verification")
              sys.exit(0)
          for num in nums[:MAX_API_REQUESTS]:
              if is_issue(repo, num):
                  sys.exit(0)
          print(f"::error::Need a real JIRA ticket (NYM-1234) or nymtech GitHub issue (URL, #1234 or nymtech/repo#1234). Pull requests do not count. Only the first {MAX_API_REQUESTS} references to this repository are checked. Use label no-ticket to skip.")
          sys.exit(1)
          PY
