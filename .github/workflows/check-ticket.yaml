name: check-ticket

on:
  pull_request:
    branches:
      - develop
      - "release/**"
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read

jobs:
  check-ticket:
    name: Check ticket in PR description
    runs-on: arc-linux-latest
    if: >
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'no-ticket') == false
    env:
      PR_BODY: ${{ toJSON(github.event.pull_request.body) }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Require JIRA ticket or nymtech GitHub issue
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          body = json.loads(os.environ["PR_BODY"] or "null") or ""
          n = int(os.environ["PR_NUMBER"])
          repo = os.environ["GITHUB_REPOSITORY"].lower()
          if re.search(r"(?i)(?<![\w-])(?:JIRA-)?(?:NYM|VPN)-\d+(?![\w-])", body):
              sys.exit(0)
          for full, num in re.findall(
              r"(?i)https?://(?:www\.)?github\.com/(nymtech/[\w.-]+)/issues/(\d+)",
              body,
          ):
              if full.lower() == repo and int(num) == n:
                  continue
              sys.exit(0)
          print("::error::Need a real JIRA ticket (NYM-1234) or nymtech GitHub issue URL. Linking this PR does not count. Use label no-ticket to skip.")
          sys.exit(1)
          PY
