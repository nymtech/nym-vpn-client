name: on-release-publish

# Auto-runs the post-publish steps that release-all-platforms DEFERS while the
# unified release is still a draft (they consume PUBLIC release assets that 404
# on a draft). Fires the moment a human clicks "Publish release" on the ship draft:
#   aur-vpnd, aur-app        -> publish PKGBUILDs to AUR
#   post-release             -> changelog/installer/flatpak PR
#   win-sigs + windows-updater -> tauri Windows updater feed PR (skips if no win build)
#
# (macOS Sparkle appcast PR is opened during the build/draft phase by
#  build-nym-vpn-apple.yml as a DRAFT PR — not deferred here.)
#
# Why 'released' (not 'published'):
#   - 'released'  matches NON-prerelease publishes only  -> ship  (nym-vpn-v*)
#   - nightlies are created with --prerelease            -> never match here
# Why this is safe vs. nightlies (belt + braces):
#   1. nightly drafts are --prerelease, so 'released' never fires for them;
#   2. nightly drafts are auto-published by finalize-nightly via GITHUB_TOKEN,
#      and releases published by GITHUB_TOKEN do NOT emit a release event at all.
#   Nightlies therefore never reach AUR -- which is intended (canonical
#   nym-vpnd / nym-vpn-app AUR packages stay stable-only).
#
# Assumes this workflow + its callees exist on the release commit / default
# branch (reusable callees resolve at the caller's ref).
on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: on-release-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  setup:
    # Guard: only act on the unified ship tag (nym-vpn-v*). Ignores legacy
    # (nym-vpn-core-v*, nym-vpn-app-v*) and nightly (nym-vpn-nightly-*) tags --
    # none of those share the 'nym-vpn-v' prefix.
    if: ${{ startsWith(github.event.release.tag_name, 'nym-vpn-v') }}
    runs-on: arc-linux-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve tag + version
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#nym-vpn-v}"
          {
            echo "tag=${TAG}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice:: post-release fan-out for ${TAG} (version ${version})"

  # Ship is the line's final release: clear the -beta.N releases that led to it so
  # the Releases page shows only shipped versions. Scoped to the shipped base line
  # (a ship of 2026.11.0 only clears 2026.11.0-beta.*). Tags are KEPT (no
  # --cleanup-tag) — they stay the immutable ledger that resolve-version reads to
  # never recompute onto a used beta number. Only fires on ship: beta releases are
  # --prerelease, and 'released' never fires for prereleases.
  delete-betas:
    needs: setup
    runs-on: arc-linux-latest
    permissions:
      contents: write
    steps:
      - name: Delete shipped-line beta releases (keep tags)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          BASE="${VERSION%%-*}"          # major.minor.patch of the shipped line
          BASE_RE="${BASE//./[.]}"       # literal-dot regex for jq test()
          mapfile -t betas < <(gh release list --limit 200 --json tagName \
            -q ".[] | .tagName | select(test(\"^nym-vpn-v${BASE_RE}-beta[.][0-9]+\$\"))")
          if [ "${#betas[@]}" -eq 0 ]; then
            echo "::notice:: no beta releases for ${BASE} to delete"
            exit 0
          fi
          for t in "${betas[@]}"; do
            echo "::notice:: deleting beta release ${t} (keeping tag)"
            gh release delete "$t" --yes   # no --cleanup-tag → tag stays
          done

  aur-vpnd:
    needs: setup
    uses: ./.github/workflows/publish-aur-nym-vpnd.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.setup.outputs.tag }}
      pkgrel: 1
      publish_aur: true
      commit_msg: "release ${{ needs.setup.outputs.tag }}"

  aur-vpnc:
    needs: setup
    uses: ./.github/workflows/publish-aur-nym-vpnc.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.setup.outputs.tag }}
      pkgrel: 1
      publish_aur: true
      commit_msg: "release ${{ needs.setup.outputs.tag }}"

  aur-app:
    needs: setup
    uses: ./.github/workflows/publish-aur-nym-vpn-app.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.setup.outputs.tag }}
      pkgrel: 1
      publish_aur: true
      commit_msg: "v${{ needs.setup.outputs.version }}"

  post-release:
    needs: setup
    uses: ./.github/workflows/tauri-post-release.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      release_tag: ${{ needs.setup.outputs.tag }}
      version: ${{ needs.setup.outputs.version }}
      core_release_tag: ${{ needs.setup.outputs.tag }}

  # Tauri Windows updater feed. tauri-updater.yml wants the bundle signatures as
  # inputs; under orchestration they came from the build job's outputs, which are
  # gone by publish time. Recover them from the *setup.exe.sig assets attached to
  # the release. The app version is embedded in the .sig filename
  # (NymVPN_<ver>_x64-setup.exe.sig) — parse it rather than assume tag==app version.
  win-sigs:
    needs: setup
    runs-on: arc-linux-latest
    outputs:
      enabled: ${{ steps.sig.outputs.enabled }}
      app_version: ${{ steps.sig.outputs.app_version }}
      sig_x64: ${{ steps.sig.outputs.sig_x64 }}
      sig_arm64: ${{ steps.sig.outputs.sig_arm64 }}
    steps:
      - name: Recover Windows updater signatures from release assets
        id: sig
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t sigs < <(gh release view "$TAG" --json assets \
            -q '.assets[].name | select(endswith("setup.exe.sig"))')
          if [ "${#sigs[@]}" -eq 0 ]; then
            echo "::notice:: no Windows updater sigs on ${TAG} — skipping updater feed"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          x64=$(printf '%s\n' "${sigs[@]}" | grep -E 'x64-setup\.exe\.sig$' || true)
          arm64=$(printf '%s\n' "${sigs[@]}" | grep -E 'arm64-setup\.exe\.sig$' || true)
          if [ -z "$x64" ] || [ -z "$arm64" ]; then
            echo "::warning:: incomplete Windows sigs (x64='${x64}' arm64='${arm64}') — skipping updater feed"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ver=$(printf '%s' "$x64" | sed -E 's/^NymVPN_(.+)_x64-setup\.exe\.sig$/\1/')
          gh release download "$TAG" --pattern "$x64" --pattern "$arm64" --clobber
          {
            echo "enabled=true"
            echo "app_version=${ver}"
            echo "sig_x64=$(head -n1 "$x64")"
            echo "sig_arm64=$(head -n1 "$arm64")"
          } >> "$GITHUB_OUTPUT"

  windows-updater:
    needs: [setup, win-sigs]
    if: ${{ needs.win-sigs.outputs.enabled == 'true' }}
    uses: ./.github/workflows/tauri-updater.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      channel: stable
      version: ${{ needs.win-sigs.outputs.app_version }}
      base_url: https://github.com/${{ github.repository }}/releases/download/${{ needs.setup.outputs.tag }}
      signature_x64: ${{ needs.win-sigs.outputs.sig_x64 }}
      signature_arm64: ${{ needs.win-sigs.outputs.sig_arm64 }}

  # Sparkle appcast feed. macos-updater.yml downloads NymVPN-*.pkg off the release, so a
  # ship that did not build macOS has nothing for it to do -- probe first rather than
  # letting `gh release download` fail the job with "no assets match the file pattern".
  # Same shape as win-sigs above.
  mac-pkg:
    needs: setup
    runs-on: arc-linux-latest
    outputs:
      enabled: ${{ steps.pkg.outputs.enabled }}
    steps:
      - name: Check for a macOS pkg on the release
        id: pkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          pkg=$(gh release view "$TAG" --json assets \
            -q '.assets[].name | select(startswith("NymVPN-") and endswith(".pkg"))' | head -n1)
          if [ -z "$pkg" ]; then
            echo "::notice:: no macOS pkg on ${TAG} — skipping Sparkle appcast"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice:: found ${pkg} — will update Sparkle appcast"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  macos-updater:
    needs: [setup, mac-pkg]
    if: ${{ needs.mac-pkg.outputs.enabled == 'true' }}
    uses: ./.github/workflows/macos-updater.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      version_tag: ${{ needs.setup.outputs.tag }}

  update-nym-fdroid:
    runs-on: arc-linux-latest
    needs: setup
    steps:
      - name: Dispatch update for fdroid repo
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.ANDROID_PAT }}
          repository: nymtech/fdroid
          event-type: fdroid-update

  # Bust the nym.com (Next.js) release cache tag so the public download page picks
  # up the freshly published version. Only fires here, gated on `setup`, so it runs
  # exactly when a ship (non-prerelease) release with the nym-vpn-v* tag goes public
  # — nightly/beta prereleases never reach this workflow. Signs the payload with an
  # HMAC-SHA256 the endpoint verifies via the X-Hub-Signature-256 header.
  revalidate-website:
    needs: setup
    runs-on: arc-linux-latest
    steps:
      - name: Invalidate release cache
        env:
          REVALIDATE_SECRET: ${{ secrets.WEBSITE_REVALIDATE_SECRET }}
          RELEASE_TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          BODY='{"event":"release"}'
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$REVALIDATE_SECRET" | awk '{print $2}')"
          curl -fsS --retry 3 --retry-delay 5 -X POST https://nym.com/api/github/revalidate \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$BODY"

          echo "::notice:: revalidated nym.com release cache for ${RELEASE_TAG}"
