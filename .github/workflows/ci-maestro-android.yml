name: ci-maestro-android

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci-maestro-android.yml'
      - 'nym-vpn-android/**'
      - 'nym-vpn-core/**'
  workflow_dispatch:

jobs:
  maestro-ui-tests:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # Android.mk cross-compiles three ABIs, so all three rust targets are needed.
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install cargo-license
        run: cargo install cargo-license

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Install protobuf
        run: sudo apt-get install -y protobuf-compiler

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r28b

      - name: Cache cargo build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nym-vpn-core/target
            ~/.cargo/registry
            ~/.cargo/git
          key: android-cargo-v2-${{ hashFiles('nym-vpn-core/Cargo.lock') }}

      - name: Log tool versions
        run: |
          echo "--- Rust ---"
          rustc --version
          cargo --version
          cargo ndk --version
          echo "--- Go ---"
          go version
          echo "--- Protobuf ---"
          protoc --version
          echo "--- Java ---"
          java -version
          echo "--- NDK ---"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}"

      - name: Build mock debug APK
        working-directory: nym-vpn-android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew assembleMockDebug --refresh-dependencies

      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.2.0"
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          curl -fsSL -o checksums_sha256.txt "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/checksums_sha256.txt"
          sha256sum --check --ignore-missing checksums_sha256.txt
          unzip -q maestro.zip
          mv maestro "$HOME/.maestro"
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          "$HOME/.maestro/bin/maestro" --version

      - name: Run Maestro UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          # Pixel 6 profile: the default AVD is a tiny 320x640 mdpi screen where most of the UI is off-screen.
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install nym-vpn-android/app/build/outputs/apk/mock/debug/*.apk
            mkdir -p maestro-debug
            adb logcat -c || true
            maestro test nym-vpn-android/maestro --format junit --output maestro-report.xml --debug-output maestro-debug; STATUS=$?; adb logcat -d > maestro-debug/logcat.txt; exit $STATUS

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-android-report
          path: maestro-report.xml
          retention-days: 14

      - name: Upload Maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-android-debug
          path: maestro-debug
          retention-days: 14
          if-no-files-found: warn
