name: ci-maestro-android

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci-maestro-android.yml'
      - 'nym-vpn-android/**'
      - 'nym-vpn-core/**'
  workflow_dispatch:

jobs:
  maestro-ui-tests:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install protobuf
        run: sudo apt-get install -y protobuf-compiler

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b

      - name: Cache cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            nym-vpn-core/target
            ~/.cargo/registry
            ~/.cargo/git
          key: android-cargo-${{ hashFiles('nym-vpn-core/Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Log tool versions
        run: |
          echo "--- Rust ---"
          rustc --version
          cargo --version
          cargo ndk --version
          echo "--- Go ---"
          go version
          echo "--- Protobuf ---"
          protoc --version
          echo "--- Java ---"
          java -version
          echo "--- NDK ---"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}"

      - name: Build mock debug APK
        working-directory: nym-vpn-android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew assembleMockDebug

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          $HOME/.maestro/bin/maestro --version

      - name: Run Maestro UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install nym-vpn-android/app/build/outputs/apk/mock/debug/*.apk
            maestro test nym-vpn-android/maestro/flows/ --format junit --output maestro-report.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-report
          path: maestro-report.xml
          retention-days: 14
