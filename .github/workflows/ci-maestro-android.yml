name: ci-maestro-android

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci-maestro-android.yml'
      - 'nym-vpn-android/**'
      - 'nym-vpn-core/**'
  workflow_dispatch:

jobs:
  maestro-ui-tests:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install cargo-license
        run: cargo install cargo-license

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 'stable'

      - name: Install protobuf
        run: sudo apt-get install -y protobuf-compiler

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r28b

      - name: Cache cargo build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            nym-vpn-core/target
            ~/.cargo/registry
            ~/.cargo/git
          key: android-cargo-${{ hashFiles('nym-vpn-core/Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Log tool versions
        run: |
          echo "--- Rust ---"
          rustc --version
          cargo --version
          cargo ndk --version
          echo "--- Go ---"
          go version
          echo "--- Protobuf ---"
          protoc --version
          echo "--- Java ---"
          java -version
          echo "--- NDK ---"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}"

      - name: Build mock debug APK
        working-directory: nym-vpn-android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew assembleMockDebug --refresh-dependencies

      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.2.0"
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          curl -fsSL -o checksums_sha256.txt "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/checksums_sha256.txt"
          sha256sum --check --ignore-missing checksums_sha256.txt
          unzip -q maestro.zip
          mv maestro "$HOME/.maestro"
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          "$HOME/.maestro/bin/maestro" --version

      - name: Run Maestro UI tests
        uses: reactivecircus/android-emulator-runner@e93c997dcab69054e999e3924af3d21c4a736e13 # v2.9.0
        with:
          api-level: 34
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install nym-vpn-android/app/build/outputs/apk/mock/debug/*.apk
            maestro test nym-vpn-android/maestro/flows/ --format junit --output maestro-report.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-android-report
          path: maestro-report.xml
          retention-days: 14
