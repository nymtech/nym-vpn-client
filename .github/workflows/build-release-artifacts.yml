name: build-release-artifacts

on:
  # Temporary for initial PR
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/build-release-artifacts.yml"
  # NOTE: pick the release branch in the "Run workflow" ref selector. Reusable callees
  # always run at the SAME ref as this orchestrator, so the dispatch ref IS the release
  # branch — there is no separate branch input (it could not redirect the callees).
  # Scheduled (nightly) runs use the repository default branch (develop).
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel"
        type: choice
        default: nightly
        options:
          - nightly   # mutable, auto-published prerelease; app version <base>-nightly
          - beta      # release candidate; core version MUST contain -beta; prerelease draft
          - ship      # stable release; core version MUST NOT contain -beta; draft
      android:
        description: "Android → Google Play"
        type: boolean
        default: false
      fdroid:
        description: "F-Droid"
        type: boolean
        default: false
      linux:
        description: "Linux (deb/AppImage + AUR)"
        type: boolean
        default: false
      windows:
        description: "Windows (signed exe + updater)"
        type: boolean
        default: false
      ios:
        description: "iOS → TestFlight/App Store"
        type: boolean
        default: false
      macos:
        description: "macOS (.pkg + Sparkle)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_channel:
        description: "Release channel"
        type: string
        default: nightly
      android:
        description: "Android → Google Play"
        type: boolean
        default: false
      fdroid:
        description: "F-Droid"
        type: boolean
        default: false
      linux:
        description: "Linux (deb/AppImage + AUR)"
        type: boolean
        default: false
      windows:
        description: "Windows (signed exe + updater)"
        type: boolean
        default: false
      ios:
        description: "iOS → TestFlight/App Store"
        type: boolean
        default: false
      macos:
        description: "macOS (.pkg + Sparkle)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      android: ${{ steps.process-inputs.outputs.android }}
      fdroid: ${{ steps.process-inputs.outputs.fdroid }}
      linux: ${{ steps.process-inputs.outputs.linux }}
      windows: ${{ steps.process-inputs.outputs.windows }}
      ios: ${{ steps.process-inputs.outputs.ios }}
      macos: ${{ steps.process-inputs.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Process inputs
        id: process-inputs
        run: |
          if ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}; then
            RELEASE_CHANNEL='nightly'
            ANDROID=true
            FDROID=true
            LINUX=true
            WINDOWS=true
            IOS=true
            MACOS=true
          else
            RELEASE_CHANNEL="${{ inputs.release_channel }}"
            ANDROID="${{ inputs.outputs.android }}"
            FDROID="${{ inputs.outputs.fdroid }}"
            LINUX="${{ inputs.outputs.linux }}"
            WINDOWS="${{ inputs.outputs.windows }}"
            IOS="${{ inputs.outputs.ios }}"
            MACOS="${{ inputs.outputs.macos }}"
          fi

          echo "release_channel=$RELEASE_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "fdroid=$FDROID" >> "$GITHUB_OUTPUT"
          echo "linux=$LINUX" >> "$GITHUB_OUTPUT"
          echo "windows=$WINDOWS" >> "$GITHUB_OUTPUT"
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"
          echo "macos=$MACOS" >> "$GITHUB_OUTPUT"

          echo "::notice:: release_channel=$RELEASE_CHANNEL, android=$ANDROID, fdroid=$FDROID, linux=$LINUX, windows=$WINDOWS, ios=$IOS, macos=$MACOS"

      - name: Resolve version + tag
        id: v
        env:
          RELEASE_CHANNEL: ${{ steps.process-inputs.outputs.release_channel }}
          # beta auto-advances its -beta.N by reading prior beta releases/tags
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release/resolve-version.sh

  core:
    needs: [resolve]
    uses: ./.github/workflows/build-nym-vpn-core.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit

  apple:
    needs: [resolve]
    if: ${{ needs.resolve.outputs.ios == 'true' || needs.resolve.outputs.macos == 'true' }}
    uses: ./.github/workflows/build-nym-vpn-apple.yml
    with:
      # beta maps to qa (apple ship-only path creates a standalone macOS release + appcast).
      release_type: ${{ needs.resolve.outputs.channel == 'ship' && 'ship' || 'qa' }}
      version: ${{ needs.resolve.outputs.version }}
      build_ios: ${{ needs.resolve.outputs.ios == 'true' }}
      build_macos: ${{ needs.resolve.outputs.macos == 'true' }}
    secrets: inherit

  android:
    needs: [resolve]
    if: ${{ needs.resolve.outputs.android == 'true' || needs.resolve.outputs.fdroid == 'true' }}
    uses: ./.github/workflows/build-release-artifacts-android.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      fdroid: ${{ needs.resolve.outputs.fdroid == 'true' }}
      play: ${{ needs.resolve.outputs.android == 'true' }}
      release_type: ${{ needs.resolve.outputs.channel == 'ship' && 'release' || (needs.resolve.outputs.channel == 'beta' && 'prerelease' || 'nightly') }}
    secrets: inherit

  # Linux + Windows desktop app. build-nym-vpn-app.yml builds each OS as its own
  # internal job (build-linux on ubuntu, build-windows-* on windows) and aggregates in
  # one Linux publish job, so a single invocation covers both. Core is built INLINE here
  # (no core_release_tag): consuming core from the unified release can't work because it
  # is a DRAFT at build time and /releases/tags/<tag> doesn't return drafts. The `linux`/
  # `windows` flags only gate which built artifacts get appended to the release.
  app:
    needs: [resolve, core]
    if: ${{ needs.resolve.outputs.linux == 'true' || needs.resolve.outputs.windows == 'true' }}
    uses: ./.github/workflows/build-nym-vpn-app.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      linux: ${{ needs.resolve.outputs.linux == 'true' }}
      windows: ${{ needs.resolve.outputs.windows == 'true' }}
      release_type: ${{ needs.resolve.outputs.channel == 'ship' && 'stable' || (needs.resolve.outputs.channel == 'beta' && 'rc' || 'nightly') }}
    secrets: inherit
