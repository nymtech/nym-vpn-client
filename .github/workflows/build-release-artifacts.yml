name: build-release-artifacts

on:
  # pull_request:
  #   types: [opened, synchronize, reopened]
  #   paths:
  #     - ".github/workflows/build-release-artifacts.yml"
  workflow_call:
    inputs:
      release_channel:
        description: "Release channel"
        type: string
        default: nightly
      version:
        description: "Orchestrated app version to embed (empty = use the one from Cargo.toml as before)"
        required: false
        type: string
        default: ""
      nightly_timestamp:
        description: "Nightly timestamp used by Android app (nightly only)"
        required: false
        type: string
        default: ""
      android:
        description: "Android → Google Play"
        type: boolean
        default: false
      fdroid:
        description: "F-Droid"
        type: boolean
        default: false
      linux:
        description: "Linux (deb/AppImage + AUR)"
        type: boolean
        default: false
      windows:
        description: "Windows (signed exe + updater)"
        type: boolean
        default: false
      ios:
        description: "iOS → TestFlight/App Store"
        type: boolean
        default: false
      macos:
        description: "macOS (.pkg + Sparkle)"
        type: boolean
        default: false
    secrets:
      VPND_SENTRY_DSN:
        required: true
      SCCACHE_REDIS_ENDPOINT:
        required: true
      SCCACHE_REDIS_PASSWORD:
        required: true
      ANDROID_SIGNING_KEY_ALIAS:
        required: true
      ANDROID_SIGNING_KEY_PASSWORD:
        required: true
      ANDROID_SIGNING_STORE_PASSWORD:
        required: true
      ANDROID_SENTRY_DSN:
        required: true
      ANDROID_SERVICE_ACCOUNT_JSON:
        required: true
      ANDROID_KEYSTORE:
        required: true
      CROWDIN_PROJECT_ID:
        required: true
      CROWDIN_PERSONAL_TOKEN:
        required: true
      APPLE_DEVELOPER_ID_APPLICATION_CERT:
        required: true
      APPLE_DEVELOPER_ID_APPLICATION_CERT_PASS:
        required: true
      APPLE_DEVELOPER_ID_INSTALLER_CERT:
        required: true
      APPLE_DEVELOPER_ID_INSTALLER_CERT_PASS:
        required: true
      APP_STORE_CONNECT_API_KEY:
        required: true
      APP_STORE_CONNECT_API_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_API_PRIVATE_KEY:
        required: true
      APPLE_TEAM_ID:
        required: true
      SSL_COM_USERNAME:
        required: true
      SSL_COM_PASSWORD:
        required: true
      SSL_COM_TOTP_SECRET:
        required: true
      TAURI_PRIVATE_KEY:
        required: true
      TAURI_KEY_PASSWORD:
        required: true
      DESKTOP_JS_SENTRY_DSN:
        required: true
      WINDOWS_SIGNING_PFX_BASE64:
        required: true
      WINDOWS_SIGNING_PFX_PASSWORD:
        required: true
    outputs:
      pkg_installer_name:
        description: "Name of the PKG installer artifact"
        value: ${{ jobs.apple.outputs.pkg_installer_name }}
      vpnc_pkg_installer_name:
        description: "Name of the nym-vpnc PKG installer artifact"
        value: ${{ jobs.apple.outputs.vpnc_pkg_installer_name }}
      ios_ipa_name:
        description: "Name of the IPA artifact"
        value: ${{ jobs.apple.outputs.ios_ipa_name }}
      ios_build:
        description: "Build number of the iOS app"
        value: ${{ jobs.apple.outputs.ios_build }}
      fdroid_artifact_name:
        description: "Name of the F-Droid artifact"
        value: ${{ jobs.android.outputs.fdroid_artifact_name }}
      play_artifact_name:
        description: "Name of the Google Play artifact"
        value: ${{ jobs.android.outputs.play_artifact_name }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: arc-linux-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      nightly_timestamp: ${{ steps.resolve.outputs.nightly_timestamp }}
      channel: ${{ steps.resolve.outputs.channel }}
      android: ${{ steps.resolve.outputs.android }}
      fdroid: ${{ steps.resolve.outputs.fdroid }}
      linux: ${{ steps.resolve.outputs.linux }}
      windows: ${{ steps.resolve.outputs.windows }}
      ios: ${{ steps.resolve.outputs.ios }}
      macos: ${{ steps.resolve.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Resolve
        id: resolve
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_NIGHTLY_TIMESTAMP: ${{ inputs.nightly_timestamp }}
          IN_RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          if ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}; then
            RELEASE_CHANNEL="nightly"
            VERSION="$IN_VERSION"
            NIGHTLY_TIMESTAMP="$IN_NIGHTLY_TIMESTAMP"
            ANDROID=true
            FDROID=true
            LINUX=true
            WINDOWS=true
            IOS=true
            MACOS=true
          else
            RELEASE_CHANNEL="$IN_RELEASE_CHANNEL"
            VERSION="$IN_VERSION"
            NIGHTLY_TIMESTAMP="$IN_NIGHTLY_TIMESTAMP"
            ANDROID="${{ inputs.android }}"
            FDROID="${{ inputs.fdroid }}"
            LINUX="${{ inputs.linux }}"
            WINDOWS="${{ inputs.windows }}"
            IOS="${{ inputs.ios }}"
            MACOS="${{ inputs.macos }}"
          fi

          echo "channel=$RELEASE_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "fdroid=$FDROID" >> "$GITHUB_OUTPUT"
          echo "linux=$LINUX" >> "$GITHUB_OUTPUT"
          echo "windows=$WINDOWS" >> "$GITHUB_OUTPUT"
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"
          echo "macos=$MACOS" >> "$GITHUB_OUTPUT"
          echo "nightly_timestamp=$NIGHTLY_TIMESTAMP" >> "$GITHUB_OUTPUT"

          echo "::notice:: channel=$RELEASE_CHANNEL, version=$VERSION, nightly_timestamp=$NIGHTLY_TIMESTAMP, android=$ANDROID, fdroid=$FDROID, linux=$LINUX, windows=$WINDOWS, ios=$IOS, macos=$MACOS"

  core:
    needs: [resolve]
    if: ${{ needs.resolve.outputs.linux == 'true' || needs.resolve.outputs.windows == 'true' || needs.resolve.outputs.macos == 'true' }}
    uses: ./.github/workflows/build-nym-vpn-core.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      linux: ${{ needs.resolve.outputs.linux == 'true' }}
      windows: ${{ needs.resolve.outputs.windows == 'true' }}
      ios: ${{ needs.resolve.outputs.ios == 'true' }}
      macos: ${{ needs.resolve.outputs.macos == 'true' }}
    secrets: inherit

  apple:
    needs: [resolve, core]
    if: ${{ needs.resolve.outputs.ios == 'true' || needs.resolve.outputs.macos == 'true' }}
    uses: ./.github/workflows/build-release-artifacts-apple.yml
    with:
      release_type: ${{ needs.resolve.outputs.channel == 'ship' && 'ship' || 'qa' }}
      version: ${{ needs.resolve.outputs.version }}
      build_ios: ${{ needs.resolve.outputs.ios == 'true' }}
      build_macos: ${{ needs.resolve.outputs.macos == 'true' }}
    secrets: inherit

  android:
    needs: [resolve]
    if: ${{ needs.resolve.outputs.android == 'true' || needs.resolve.outputs.fdroid == 'true' }}
    uses: ./.github/workflows/build-release-artifacts-android.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      nightly_timestamp: ${{ needs.resolve.outputs.nightly_timestamp }}
      fdroid: ${{ needs.resolve.outputs.fdroid == 'true' }}
      play: ${{ needs.resolve.outputs.android == 'true' }}
      release_type: ${{ needs.resolve.outputs.channel == 'ship' && 'release' || (needs.resolve.outputs.channel == 'beta' && 'prerelease' || 'nightly') }}
    secrets: inherit

  app:
    needs: [resolve, core]
    if: ${{ needs.resolve.outputs.linux == 'true' || needs.resolve.outputs.windows == 'true' }}
    uses: ./.github/workflows/build-nym-vpn-app.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      linux: ${{ needs.resolve.outputs.linux == 'true' }}
      windows: ${{ needs.resolve.outputs.windows == 'true' }}
      release_type: ${{ needs.resolve.outputs.channel == 'ship' && 'stable' || (needs.resolve.outputs.channel == 'beta' && 'rc' || 'nightly') }}
      dev_mode: ${{ needs.resolve.outputs.channel == 'nightly' }}
    secrets: inherit
