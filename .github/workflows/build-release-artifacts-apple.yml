name: build-nym-vpn-apple

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/build-release-artifacts-apple.yml"
  workflow_dispatch:
    inputs:
      release_type:
        description: |
          Select build mode:
          🚜 pr — Pull Request
          🧪 qa — QA Release
          🚢 ship — Ship Release
        type: choice
        options:
          - pr
          - qa
          - ship
        default: "pr"
      build_ios:
        description: "📱 iOS app (only applies for QA/Ship builds)"
        required: false
        type: boolean
        default: false
      build_macos:
        description: "🖥️ macOS app (only applies for QA/Ship builds)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_type:
        description: "Build type: pr | qa | ship (raw or labeled)"
        type: string
        default: "pr"
      version:
        description: "Orchestrated app version (empty = use Xcode MARKETING_VERSION as before)"
        type: string
        default: ""
      build_ios:
        type: boolean
        default: false
      build_macos:
        type: boolean
        default: false
env:
  CARGO_TERM_COLOR: always

jobs:
  build-ios-app:
    uses: ./.github/workflows/build-nym-vpn-app-ios.yml
    if: ${{ inputs.build_ios == 'true' }}
    with:
      release_type: ${{ inputs.release_type }}
      version: ${{ inputs.version }}
    secrets: inherit

  build-macos-app:
    uses: ./.github/workflows/build-nym-vpn-app-macos.yml
    if: ${{ inputs.build_ios == 'true' }}
    with:
      release_type: ${{ inputs.release_type }}
      version: ${{ inputs.version }}
    secrets: inherit
