name: publish-nym-vpn-android-metadata

# Metadata-only: listing text, images, screenshots, changelogs. Runs after a release, or manually.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track whose release notes/changelog to target"
        type: choice
        default: "alpha"
        options:
          - internal
          - alpha
          - beta
          - production
      skip_changelogs:
        description: "Skip changelog upload"
        type: boolean
        default: false
  workflow_call:
    inputs:
      track:
        description: "Play Store track whose release notes/changelog to target"
        type: string
        default: "alpha"
      skip_changelogs:
        description: "Skip changelog upload"
        type: boolean
        default: false
    secrets:
      ANDROID_SERVICE_ACCOUNT_JSON:
        required: true

permissions:
  contents: read

env:
  RELEASE_NOTES: ""

jobs:
  publish-metadata:
    runs-on: arc-linux-latest
    timeout-minutes: 15
    env:
      RUBYOPT: "-rresolv-replace"
      BUNDLE_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Create service_account.json
        id: createServiceAccount
        working-directory: nym-vpn-android
        env:
          ANDROID_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$ANDROID_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Install fastlane
        working-directory: nym-vpn-android
        run: bundle install

      - name: Set locale (for Fastlane)
        run: |
          echo "LC_ALL=C.utf8" >> $GITHUB_ENV
          echo "LANG=C.utf8" >> $GITHUB_ENV

      # Screenshots live in the nym-vpn-client-screenshots bucket, never in git.
      # Extract to a scratch dir and copy only screenshot files into the checkout, so a
      # tampered archive can't overwrite Appfile/Fastfile/workflows (which supply would
      # then run with Play publishing credentials). icon.png / featureGraphic.png stay in git.
      - name: Fetch Play Store screenshots from CDN
        run: |
          set -euo pipefail
          url="https://nym-vpn-client-screenshots.cdn.nymte.ch/android-screenshots.zip"
          tmp="$(mktemp -d)"
          curl -fSL --proto '=https' --retry 3 --retry-delay 5 -o "$tmp/shots.zip" "$url"
          unzip -q "$tmp/shots.zip" -d "$tmp/x"
          if find "$tmp/x" -type l | grep -q .; then
            echo "::error::archive contains a symlink"; exit 1
          fi
          # Every entry must be an image in a recognized Play screenshot dir under a
          # single locale dir, anchored at the extraction root (rejects misplaced files
          # like <locale>/extra/images/... that pass a loose match but supply ignores).
          if find "$tmp/x" -type f -regextype egrep \
               ! -iregex "$tmp/x/fastlane/metadata/android/[^/]+/images/(phone|sevenInch|tenInch|tv|wear)Screenshots/[^/]+\.(jpg|jpeg|png)" | grep -q .; then
            echo "::error::archive contains unexpected files"; find "$tmp/x" -type f | head; exit 1
          fi
          n=$(find "$tmp/x/fastlane/metadata/android" -type f | wc -l | tr -d ' ')
          echo "Fetched $n Android screenshots"
          test "$n" -gt 0
          # Merge screenshot dirs into the checkout (icon.png / featureGraphic.png already there).
          cp -R "$tmp/x/fastlane/metadata/android/." fastlane/metadata/android/

      - name: Get Android version code
        id: version_code
        run: |
          set -euo pipefail
          version_code=$(grep "VERSION_CODE" "${GITHUB_WORKSPACE}/nym-vpn-android/buildSrc/src/main/kotlin/Constants.kt" | awk '{print $5}' | tr -d '\n')
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"

      - name: Update Google Play metadata (track=${{ inputs.track }}) 🚀
        env:
          FASTLANE_OPT_OUT_USAGE: "YES"
          TRACK: ${{ inputs.track }}
          VERSION_CODE: ${{ steps.version_code.outputs.version_code }}
          SKIP_CHANGELOGS: ${{ inputs.skip_changelogs }}
        run: |
          echo "🚀 Updating Google Play Store metadata... (track=$TRACK, version_code=$VERSION_CODE, skip_changelogs=$SKIP_CHANGELOGS)"

          version_code_args=()
          if [ "$SKIP_CHANGELOGS" != "true" ]; then
            version_code_args=(--version_code "$VERSION_CODE")
          fi

          bundle exec fastlane supply \
            --track "$TRACK" \
            "${version_code_args[@]}" \
            --skip_upload_aab true \
            --skip_upload_apk true \
            --skip_upload_metadata false \
            --skip_upload_images false \
            --skip_upload_screenshots false \
            --skip_upload_changelogs "$SKIP_CHANGELOGS"
