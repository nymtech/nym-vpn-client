name: release-all-platforms

on:
  # NOTE: pick the release branch in the "Run workflow" ref selector. Reusable callees
  # always run at the SAME ref as this orchestrator, so the dispatch ref IS the release
  # branch — there is no separate branch input (it could not redirect the callees).
  # Scheduled (nightly) runs use the repository default branch (develop).
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel"
        type: choice
        default: nightly
        options:
          - nightly   # mutable, auto-published prerelease; app version <base>-nightly
          - beta      # release candidate; core version MUST contain -beta; prerelease draft
          - ship      # stable release; core version MUST NOT contain -beta; draft
      android:
        description: "Android → Google Play"
        type: boolean
        default: false
      fdroid:
        description: "F-Droid (ship only)"
        type: boolean
        default: false
      linux:
        description: "Linux (deb/AppImage + AUR)"
        type: boolean
        default: false
      windows:
        description: "Windows (signed exe + updater)"
        type: boolean
        default: false
      ios:
        description: "iOS → TestFlight/App Store"
        type: boolean
        default: false
      macos:
        description: "macOS (.pkg + Sparkle)"
        type: boolean
        default: false
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

# Ship/beta runs key off the ref so different release branches/versions run in parallel.
# Nightly runs (cron + the no-platform-selected fallback) all share ONE group:
# ensure-release.sh deletes ALL prior nightly releases, so two concurrent nightlies would
# clobber each other's release state regardless of ref.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || (inputs.release_channel != 'ship' && inputs.release_channel != 'beta')) && 'nightly' || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      app_version: ${{ steps.v.outputs.app_version }}
      core_version: ${{ steps.v.outputs.core_version }}
      channel: ${{ steps.flags.outputs.channel }}
      android: ${{ steps.flags.outputs.android }}
      fdroid: ${{ steps.flags.outputs.fdroid }}
      linux: ${{ steps.flags.outputs.linux }}
      windows: ${{ steps.flags.outputs.windows }}
      ios: ${{ steps.flags.outputs.ios }}
      macos: ${{ steps.flags.outputs.macos }}
    steps:
      - name: Resolve channel + flags (cron OR no platform selected = nightly + all platforms except fdroid)
        id: flags
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_CHANNEL: ${{ inputs.release_channel }}
          IN_ANDROID: ${{ inputs.android }}
          IN_FDROID: ${{ inputs.fdroid }}
          IN_LINUX: ${{ inputs.linux }}
          IN_WINDOWS: ${{ inputs.windows }}
          IN_IOS: ${{ inputs.ios }}
          IN_MACOS: ${{ inputs.macos }}
        run: |
          set -euo pipefail
          echo "::notice:: releasing from ref $REF_NAME (event $EVENT)"
          # Nightly when scheduled, OR a manual dispatch with NO platform box ticked
          # (fdroid counts as a platform). The channel input is ignored in that fallback.
          nightly=false
          if [ "$EVENT" = "schedule" ]; then
            nightly=true
          elif [ "$IN_ANDROID" != "true" ] && [ "$IN_FDROID" != "true" ] \
            && [ "$IN_LINUX" != "true" ] && [ "$IN_WINDOWS" != "true" ] \
            && [ "$IN_IOS" != "true" ] && [ "$IN_MACOS" != "true" ]; then
            nightly=true
          fi
          if [ "$nightly" = "true" ]; then
            echo "::notice:: scheduled or no platform selected → nightly build of all platforms except fdroid"
            { echo "channel=nightly";
              echo "android=true"; echo "fdroid=false"; echo "linux=true";
              echo "windows=true"; echo "ios=true"; echo "macos=true"; } >> "$GITHUB_OUTPUT"
          else
            { echo "channel=${IN_CHANNEL:-nightly}";
              echo "android=$IN_ANDROID"; echo "fdroid=$IN_FDROID";
              echo "linux=$IN_LINUX"; echo "windows=$IN_WINDOWS";
              echo "ios=$IN_IOS"; echo "macos=$IN_MACOS"; } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Resolve version + tag
        id: v
        env:
          RELEASE_CHANNEL: ${{ steps.flags.outputs.channel }}
        run: bash .github/scripts/release/resolve-version.sh

  prepare-release:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Ensure unified release object
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          NOTES: "Unified release ${{ needs.resolve.outputs.tag }} assembled by release-all-platforms."
        run: bash .github/scripts/release/ensure-release.sh

  core:
    needs: [resolve, prepare-release]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-nym-vpn-core.yml
    with:
      version: ${{ needs.resolve.outputs.app_version }}
      version_tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit

  apple:
    needs: [resolve, prepare-release]
    if: ${{ needs.resolve.outputs.ios == 'true' || needs.resolve.outputs.macos == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-nym-vpn-apple.yml
    with:
      # beta maps to qa (apple ship-only path creates a standalone macOS release + appcast).
      release_type: ${{ needs.resolve.outputs.channel == 'ship' && 'ship' || 'qa' }}
      version: ${{ needs.resolve.outputs.app_version }}
      version_tag: ${{ needs.resolve.outputs.tag }}
      build_ios: ${{ needs.resolve.outputs.ios == 'true' }}
      build_macos: ${{ needs.resolve.outputs.macos == 'true' }}
    secrets: inherit

  android:
    needs: [resolve, prepare-release]
    if: ${{ needs.resolve.outputs.android == 'true' || needs.resolve.outputs.fdroid == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-nym-vpn-android.yml
    with:
      version: ${{ needs.resolve.outputs.app_version }}
      version_tag: ${{ needs.resolve.outputs.tag }}
      fdroid: ${{ needs.resolve.outputs.fdroid == 'true' }}
      release_type: ${{ needs.resolve.outputs.channel == 'ship' && 'release' || (needs.resolve.outputs.channel == 'beta' && 'prerelease' || 'nightly') }}
      # Only push a Play track when Android (not just F-Droid) is selected; nightly never pushes.
      track: ${{ needs.resolve.outputs.android == 'true' && (needs.resolve.outputs.channel == 'ship' && 'production' || (needs.resolve.outputs.channel == 'beta' && 'beta' || 'none')) || 'none' }}
    secrets: inherit

  # Linux + Windows desktop app. publish-nym-vpn-app.yml builds each OS as its own
  # internal job (build-linux on ubuntu, build-windows-* on windows) and aggregates in
  # one Linux publish job, so a single invocation covers both. Core is built INLINE here
  # (no core_release_tag): consuming core from the unified release can't work because it
  # is a DRAFT at build time and /releases/tags/<tag> doesn't return drafts. The `linux`/
  # `windows` flags only gate which built artifacts get appended to the release.
  app:
    needs: [resolve, prepare-release]
    if: ${{ needs.resolve.outputs.linux == 'true' || needs.resolve.outputs.windows == 'true' }}
    permissions: write-all
    uses: ./.github/workflows/publish-nym-vpn-app.yml
    with:
      version: ${{ needs.resolve.outputs.app_version }}
      version_tag: ${{ needs.resolve.outputs.tag }}
      linux: ${{ needs.resolve.outputs.linux == 'true' }}
      windows: ${{ needs.resolve.outputs.windows == 'true' }}
      release_type: ${{ needs.resolve.outputs.channel == 'ship' && 'stable' || (needs.resolve.outputs.channel == 'beta' && 'rc' || 'nightly') }}
    secrets: inherit

  # Nightly only: assets can't be added after publish, so platforms assemble into a
  # draft and this job publishes it once they finish. Beta + ship are published manually.
  finalize-nightly:
    needs: [resolve, prepare-release, core, apple, android, app]
    if: ${{ always() && needs.resolve.outputs.channel == 'nightly' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish nightly draft (only if it has assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          count=$(gh release view "$TAG" --json assets -q '.assets | length' 2>/dev/null || echo 0)
          if [ "${count:-0}" -gt 0 ]; then
            gh release edit "$TAG" --draft=false
            echo "::notice:: published nightly $TAG ($count assets)"
          else
            echo "::warning:: nightly $TAG has no assets — leaving as draft"
          fi
