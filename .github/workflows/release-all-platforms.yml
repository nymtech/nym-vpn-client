  #         key: ${{ env.DANGER_BUILD_CACHE_KEY }}

  build-outputs:
    runs-on: arc-linux-latest
    needs: [build, restore-build-cache]
    if: |
      !cancelled() && (
        needs.restore-build-cache.outputs.cache-hit == 'true' ||
        needs.build.result == 'success'
      )
    outputs:
      pkg_installer_name: ${{ steps.set-outputs.outputs.pkg_installer_name }}
      vpnc_pkg_installer_name: ${{ steps.set-outputs.outputs.vpnc_pkg_installer_name }}
      fdroid_artifact_name: ${{ steps.set-outputs.outputs.fdroid_artifact_name }}
      play_artifact_name: ${{ steps.set-outputs.outputs.play_artifact_name }}
      ios_ipa_name: ${{ steps.set-outputs.outputs.ios_ipa_name }}
      ios_build: ${{ steps.set-outputs.outputs.ios_build }}
    steps:
      - name: Resolve build outputs
        id: set-outputs
        env:
          PKG_INSTALLER_NAME: ${{ needs.build.outputs.pkg_installer_name || needs.restore-build-cache.outputs.pkg_installer_name }}
          VPNC_PKG_INSTALLER_NAME: ${{ needs.build.outputs.vpnc_pkg_installer_name || needs.restore-build-cache.outputs.vpnc_pkg_installer_name }}
          FDROID_ARTIFACT_NAME: ${{ needs.build.outputs.fdroid_artifact_name || needs.restore-build-cache.outputs.fdroid_artifact_name }}
          PLAY_ARTIFACT_NAME: ${{ needs.build.outputs.play_artifact_name || needs.restore-build-cache.outputs.play_artifact_name }}
          IOS_IPA_NAME: ${{ needs.build.outputs.ios_ipa_name || needs.restore-build-cache.outputs.ios_ipa_name }}
          IOS_BUILD: ${{ needs.build.outputs.ios_build || needs.restore-build-cache.outputs.ios_build }}
        run: |
          echo "pkg_installer_name=$PKG_INSTALLER_NAME" >> $GITHUB_OUTPUT
          echo "vpnc_pkg_installer_name=$VPNC_PKG_INSTALLER_NAME" >> $GITHUB_OUTPUT
          echo "fdroid_artifact_name=$FDROID_ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "play_artifact_name=$PLAY_ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "ios_ipa_name=$IOS_IPA_NAME" >> $GITHUB_OUTPUT
          echo "ios_build=$IOS_BUILD" >> $GITHUB_OUTPUT

  release:
    needs: [resolve, build-outputs]
    if: |
      !cancelled() && needs.build-outputs.result == 'success' && (needs.resolve.outputs.publish_github == 'true' || needs.resolve.outputs.publish_s3 == 'true')
    uses: ./.github/workflows/release-release-artifacts.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      github_release_type: ${{ needs.resolve.outputs.gh_release_type }}
      publish_github: ${{ needs.resolve.outputs.publish_github == 'true' }}
      publish_s3: ${{ needs.resolve.outputs.publish_s3 == 'true' }}
      github_branch: ${{ github.ref_name }}
      build_timestamp: ${{ needs.resolve.outputs.build_timestamp }}
      version: ${{ needs.resolve.outputs.version }}
      android: ${{ needs.resolve.outputs.android == 'true' && needs.resolve.outputs.channel == 'ship' }}
      fdroid: ${{ needs.resolve.outputs.fdroid == 'true' }}
      linux: ${{ needs.resolve.outputs.linux == 'true' }}
      windows: ${{ needs.resolve.outputs.windows == 'true' }}
      ios: ${{ needs.resolve.outputs.ios == 'true' }}
      macos: ${{ needs.resolve.outputs.macos == 'true' }}
      pkg_installer_name: ${{ needs.build-outputs.outputs.pkg_installer_name }}
      vpnc_pkg_installer_name: ${{ needs.build-outputs.outputs.vpnc_pkg_installer_name }}
      fdroid_artifact_name: ${{ needs.build-outputs.outputs.fdroid_artifact_name }}
    secrets: inherit

  distribute:
    needs: [resolve, build-outputs, release]
    # condition is needed because 'release' may be skipped due to dependence on cache actions
    if: |
      !cancelled() && needs.release.result == 'success' && needs.build-outputs.result == 'success' &&
      needs.resolve.outputs.publish_github && needs.resolve.outputs.gh_release_type != 'draft'
    uses: ./.github/workflows/distribute-release.yml
    permissions:
      contents: read
    with:
      publish_play: ${{ needs.resolve.outputs.android == 'true' && needs.resolve.outputs.channel == 'ship' }}
      publish_play_metadata: ${{ needs.resolve.outputs.publish_metadata == 'true' }}
      # only publish nightly builds to avoid downgrades
      publish_testflight: ${{ needs.resolve.outputs.ios == 'true' }}
      ios_ipa_name: ${{ needs.build-outputs.outputs.ios_ipa_name }}
      publish_to_public_testflight: true
      play_artifact_name: ${{ needs.build-outputs.outputs.play_artifact_name }}
      github_branch: ${{ github.ref_name }}
      github_sha: ${{ github.sha }}
    secrets: inherit

  update_beta_shortlink:
    needs: [resolve, release]
    if: |
      !cancelled() && needs.release.result == 'success' &&
      needs.resolve.outputs.publish_github && needs.resolve.outputs.gh_release_type == 'prerelease' &&
      needs.resolve.outputs.channel == 'beta' && needs.release.outputs.github_release_url != ''
    uses: ./.github/workflows/update-shortlink.yml
    with:
      short_code: beta
      long_url: ${{ needs.release.outputs.github_release_url }}
      title: ${{ needs.resolve.outputs.version }}
    secrets: inherit

  zulip:
    needs: [resolve, release, build-outputs, distribute]
    if: |
      !cancelled() && needs.release.result == 'success' && needs.build-outputs.result == 'success' &&
      needs.resolve.outputs.publish_github && needs.resolve.outputs.gh_release_type != 'draft'
    uses: ./.github/workflows/zulip-notify-release.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      release_channel: ${{ needs.resolve.outputs.channel }}
      github_branch: ${{ github.ref_name }}
      github_release_url: ${{ needs.release.outputs.github_release_url }}
      linux_app_deb_x64_url: ${{ needs.release.outputs.linux_app_deb_x64_url }}
      linux_app_deb_arm64_url: ${{ needs.release.outputs.linux_app_deb_arm64_url }}
      linux_app_appimage_x64_url: ${{ needs.release.outputs.linux_app_appimage_x64_url }}
      linux_app_appimage_arm64_url: ${{ needs.release.outputs.linux_app_appimage_arm64_url }}
      windows_installer_x64_url: ${{ needs.release.outputs.windows_installer_x64_url }}
      windows_installer_arm64_url: ${{ needs.release.outputs.windows_installer_arm64_url }}
      macos_installer_url: ${{ needs.release.outputs.macos_installer_url }}
      vpnc_macos_installer_url: ${{ needs.release.outputs.vpnc_macos_installer_url }}
      android_apk_url: ${{ needs.release.outputs.android_apk_url }}
      ios_build: ${{ needs.build-outputs.outputs.ios_build }}
    secrets: inherit

  # Post-publish fan-out: changelog/installer PR, tauri + Sparkle updater feeds, AUR
  # packages, F-Droid dispatch, nym.com cache bust. Normally on-release-publish.yml
  # drives itself off `release: [released]` when a human clicks Publish on a draft.
  #
  # That webhook NEVER fires on the gh_release=auto + ship path: create-release
  # publishes the release itself with GITHUB_TOKEN, and GitHub deliberately emits no
  # events for actions taken with GITHUB_TOKEN. So call it directly instead of
  # relying on a webhook that cannot arrive.
  #
  # Scoped to gh_release_type == 'release' on purpose:
  #   draft      -> stays on the human-publish route, where the webhook does fire
  #   prerelease -> beta/nightly must not reach AUR or the stable updater feeds
  # so this can never double-run against the webhook path.
  post-release-fanout:
    needs: [resolve, release]
    if: |
      !cancelled() && needs.release.result == 'success' &&
      needs.resolve.outputs.publish_github == 'true' &&
      needs.resolve.outputs.gh_release_type == 'release'
    uses: ./.github/workflows/on-release-publish.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      tag_name: ${{ needs.resolve.outputs.tag }}
    secrets: inherit
