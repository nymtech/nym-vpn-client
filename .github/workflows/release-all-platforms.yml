name: release-all-platforms

on:
  # Temporary for initial PR
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/release-all-platforms.yml"
  # NOTE: pick the release branch in the "Run workflow" ref selector. Reusable callees
  # always run at the SAME ref as this orchestrator, so the dispatch ref IS the release
  # branch — there is no separate branch input (it could not redirect the callees).
  # Scheduled (nightly) runs use the repository default branch (develop).
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel"
        type: choice
        default: nightly
        options:
          - nightly   # immutable, auto-published prerelease; app version <base>-nightly
          - beta      # release candidate; core version MUST contain -beta; prerelease draft
          - ship      # stable release; core version MUST NOT contain -beta; draft
      android:
        description: "Android → Google Play"
        type: boolean
        default: false
      fdroid:
        description: "F-Droid (ship only)"
        type: boolean
        default: false
      linux:
        description: "Linux (deb/AppImage + AUR)"
        type: boolean
        default: false
      windows:
        description: "Windows (signed exe + updater)"
        type: boolean
        default: false
      ios:
        description: "iOS → TestFlight/App Store"
        type: boolean
        default: false
      macos:
        description: "macOS (.pkg + Sparkle)"
        type: boolean
        default: false
      publish-metadata:
        description: "Publish Google Play metadata"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_channel:
        description: "Release channel"
        type: string # nightly, beta, ship
        default: nightly
      android:
        description: "Android → Google Play"
        type: boolean
        default: false
      fdroid:
        description: "F-Droid (ship only)"
        type: boolean
        default: false
      linux:
        description: "Linux (deb/AppImage + AUR)"
        type: boolean
        default: false
      windows:
        description: "Windows (signed exe + updater)"
        type: boolean
        default: false
      ios:
        description: "iOS → TestFlight/App Store"
        type: boolean
        default: false
      macos:
        description: "macOS (.pkg + Sparkle)"
        type: boolean
        default: false
      publish-metadata:
        description: "Publish Google Play metadata"
        type: boolean
        default: false

permissions:
  contents: read

# Ship/beta runs key off the ref so different release branches/versions run in parallel.
# Nightly runs (cron + the no-platform-selected fallback) all share ONE group:
# ensure-release.sh deletes ALL prior nightly releases, so two concurrent nightlies would
# clobber each other's release state regardless of ref.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_channel }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      android: ${{ steps.flags.outputs.android }}
      fdroid: ${{ steps.flags.outputs.fdroid }}
      linux: ${{ steps.flags.outputs.linux }}
      windows: ${{ steps.flags.outputs.windows }}
      ios: ${{ steps.flags.outputs.ios }}
      macos: ${{ steps.flags.outputs.macos }}
      publish_metadata: ${{ steps.flags.outputs.publish_metadata }}
    steps:
      - name: Resolve channel + platform flags
        id: flags
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_CHANNEL: ${{ inputs.release_channel }}
          IN_ANDROID: ${{ inputs.android }}
          IN_FDROID: ${{ inputs.fdroid }}
          IN_LINUX: ${{ inputs.linux }}
          IN_WINDOWS: ${{ inputs.windows }}
          IN_IOS: ${{ inputs.ios }}
          IN_MACOS: ${{ inputs.macos }}
          IN_PUBLISH_METADATA: ${{ inputs.publish-metadata }}
        run: |
          set -euo pipefail

          # Used for testing purposes when running this workflow from PR
          if ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}; then
            echo "::notice:: dry-run release from ref $REF_NAME (event $EVENT)"
            echo "::notice:: nightly → all platforms (dry run)"
            {
              echo "channel=nightly"
              echo "android=true"; echo "fdroid=true"; echo "linux=true"
              echo "windows=true"; echo "ios=true"; echo "macos=true"
              echo "publish_metadata=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice:: releasing from ref $REF_NAME (event $EVENT)"

          # Channel: scheduled runs are always nightly; a manual dispatch honours the
          # chosen release_channel (the platform selection no longer overrides it).
          if [ "$EVENT" = "schedule" ]; then
            CHANNEL=nightly
          else
            CHANNEL="${IN_CHANNEL:-nightly}"
          fi

          # Platform set: a cron run, OR a dispatch with NO platform box ticked, builds
          # EVERY platform for that channel. Any box ticked builds only the ticked ones.
          if [ "$EVENT" = "schedule" ] \
            || { [ "$IN_ANDROID" != "true" ] && [ "$IN_FDROID" != "true" ] \
              && [ "$IN_LINUX" != "true" ] && [ "$IN_WINDOWS" != "true" ] \
              && [ "$IN_IOS" != "true" ] && [ "$IN_MACOS" != "true" ]; }; then
            ALL=true
          else
            ALL=false
          fi

          if [ "$ALL" = "true" ]; then
            ANDROID=true; LINUX=true; WINDOWS=true; IOS=true; MACOS=true
            # The F-Droid APK is built + attached by the Android job regardless of this
            # flag; `fdroid` only DISPATCHES the F-Droid repo (a store) = ship-only.
            if [ "$CHANNEL" = "ship" ]; then FDROID=true; else FDROID=false; fi
            echo "::notice:: $CHANNEL → all platforms (F-Droid submission: $FDROID)"
          else
            ANDROID="${IN_ANDROID:-false}"; LINUX="${IN_LINUX:-false}"
            WINDOWS="${IN_WINDOWS:-false}"; IOS="${IN_IOS:-false}"; MACOS="${IN_MACOS:-false}"
            # F-Droid repo dispatch is ship-only; on nightly/beta the box is a no-op
            # (the F-Droid APK still builds + attaches via the Android job).
            if [ "$CHANNEL" = "ship" ] && [ "$IN_FDROID" = "true" ]; then FDROID=true; else FDROID=false; fi
            echo "::notice:: $CHANNEL → selected platforms"
          fi

          # Google Play metadata skip toggle (schedule/cron defaults to true = skip).
          PUBLISH_METADATA="${IN_PUBLISH_METADATA:-true}"

          {
            echo "channel=$CHANNEL"
            echo "android=$ANDROID"; echo "fdroid=$FDROID"; echo "linux=$LINUX"
            echo "windows=$WINDOWS"; echo "ios=$IOS"; echo "macos=$MACOS"
            echo "publish_metadata=$PUBLISH_METADATA"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Resolve version + tag
        id: v
        env:
          RELEASE_CHANNEL: ${{ steps.flags.outputs.channel }}
          # beta auto-advances its -beta.N by reading prior beta releases/tags
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release/resolve-version.sh

  download-runtime:
    needs: [resolve]
    permissions:
      contents: write
    uses: ./.github/workflows/download-runtime.yml
    secrets: inherit

  build:
    needs: [resolve]
    permissions:
      contents: write
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      release_channel: ${{ needs.resolve.outputs.channel }}
      android: ${{ needs.resolve.outputs.android == 'true' }}
      fdroid: ${{ needs.resolve.outputs.fdroid == 'true' }}
      linux: ${{ needs.resolve.outputs.linux == 'true' }}
      windows: ${{ needs.resolve.outputs.windows == 'true' }}
      ios: ${{ needs.resolve.outputs.ios == 'true' }}
      macos: ${{ needs.resolve.outputs.macos == 'true' }}
    secrets: inherit

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - run: |
          ls -la
          tree -d .

      # - name: Publish GitHub Release
      #   if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
      #   uses: softprops/action-gh-release@v3
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     tag_name: ${{ needs.resolve.outputs.tag }}
      #     name: "nym-vpn-v${{ needs.resolve.outputs.version }}"
      #     prerelease: false
      #     draft: true
      #     files: |
      #       tbd

  distribute:
    needs: [resolve, build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Publish to Google Play
        uses: ./.github/workflows/publish-nym-vpn-android.yml
        with:
          track: alpha
          publish-bundle: ${{ github.event_name != 'push' && github.event_name != 'pull_request' }}
          publish-metadata: ${{ needs.resolve.outputs.publish-metadata }}
          release_type: ${{ needs.resolve.outputs.channel == 'ship' && 'release' || (needs.resolve.outputs.channel == 'beta' && 'prerelease' || 'nightly') }}
