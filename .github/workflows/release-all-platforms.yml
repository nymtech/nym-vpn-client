  restore-build-cache:
    name: Restore build cache (noop)
    runs-on: arc-linux-latest
    needs: [resolve, check-release-exists]
    steps:
      - run: exit 0

  build:
    needs: [resolve, check-release-exists, restore-build-cache]
    if: |
        !cancelled() && needs.check-release-exists.result == 'success' &&  needs.restore-build-cache.outputs.cache-hit != 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      release_channel: ${{ needs.resolve.outputs.channel }}
      version: ${{ needs.resolve.outputs.version }}
      nightly_timestamp: ${{ needs.resolve.outputs.nightly_timestamp }}
      android: ${{ needs.resolve.outputs.android == 'true' && needs.resolve.outputs.channel == 'ship' }}
      fdroid: ${{ needs.resolve.outputs.fdroid == 'true' }}
      linux: ${{ needs.resolve.outputs.linux == 'true' }}
      windows: ${{ needs.resolve.outputs.windows == 'true' }}
      ios: ${{ needs.resolve.outputs.ios == 'true' }}
      macos: ${{ needs.resolve.outputs.macos == 'true' }}
    secrets: inherit

