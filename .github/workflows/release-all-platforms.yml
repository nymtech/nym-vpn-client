name: release-all-platforms

on:
  # NOTE: pick the release branch in the "Run workflow" ref selector.
  workflow_dispatch:
    inputs:
      # Github release mode:
      # - none = no release
      # - draft = draft release
      # - auto = based on branch and release channel;
      #   release/*, ship -> release;
      #   release/*, beta -> prerelease;
      #   develop, nightly -> prerelease;
      #   rest: draft
      gh_release:
        description: Github release
        type: choice
        default: 'none'
        options:
          - none
          - draft
          - auto
      publish_s3:
        description: "Publish to S3 (Garage)"
        type: boolean
        default: true
      android:
        description: "Android → Google Play"
        type: boolean
        default: false
      fdroid:
        description: "F-Droid (ship only)"
        type: boolean
        default: false
      linux:
        description: "Linux (deb/AppImage + AUR)"
        type: boolean
        default: false
      windows:
        description: "Windows (signed exe + updater)"
        type: boolean
        default: false
      ios:
        description: "iOS → TestFlight/App Store"
        type: boolean
        default: false
      macos:
        description: "macOS (.pkg + Sparkle)"
        type: boolean
        default: false
      publish-metadata:
        description: "Publish Google Play metadata"
        type: boolean
        default: false
      build_run_id:
        description: "Reuse build artifacts from this workflow run ID instead of building (for testing)"
        type: string
        default: ""
  workflow_call:
    inputs:
      gh_release:
        description: "Github release mode (none, draft, auto)"
        type: string
        default: 'draft' # none, draft, public
      publish_s3:
        description: "Publish to S3 (Garage)"
        type: boolean
        default: true
      is_nightly:
        description: "Nightly release"
        type: boolean
        default: false
      android:
        description: "Android → Google Play"
        type: boolean
        default: false
      fdroid:
        description: "F-Droid (ship only)"
        type: boolean
        default: false
      linux:
        description: "Linux (deb/AppImage + AUR)"
        type: boolean
        default: false
      windows:
        description: "Windows (signed exe + updater)"
        type: boolean
        default: false
      ios:
        description: "iOS → TestFlight/App Store"
        type: boolean
        default: false
      macos:
        description: "macOS (.pkg + Sparkle)"
        type: boolean
        default: false
      publish-metadata:
        description: "Publish Google Play metadata"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  APP_ARTIFACTS_LINUX_AARCH64: app_artifacts_linux_aarch64
  APP_ARTIFACTS_LINUX_X86_64: app_artifacts_linux_x86_64
  APP_ARTIFACTS_WINDOWS_ARM64: app_artifacts_windows_arm64
  APP_ARTIFACTS_WINDOWS_X64: app_artifacts_windows_x64
  APP_ARTIFACTS_ANDROID_FDROID: android_artifacts_fdroid
  APP_ARTIFACTS_ANDROID_PLAY: android_artifacts_play
  CORE_ARTIFACTS_LINUX_X86_64: core_artifacts_linux_x86_64
  CORE_ARTIFACTS_LINUX_AARCH64: core_artifacts_linux_aarch64
  CORE_ARTIFACTS_WINDOWS_X64: core_artifacts_windows_x64
  CORE_ARTIFACTS_WINDOWS_ARM64: core_artifacts_windows_arm64
  DEB_ARTIFACTS_X86_64: deb_artifacts_x86_64
  DEB_ARTIFACTS_AARCH64: deb_artifacts_aarch64
  IOS_ARTIFACTS: ios_artifacts
  MACOS_ARTIFACTS: macos_artifacts
  VPNC_MACOS_ARTIFACTS: vpnc_macos_artifacts

jobs:
  resolve:
    runs-on: arc-linux-latest
    outputs:
      gh_release_type: ${{ steps.flags.outputs.gh_release_type }}
      build_timestamp: ${{ steps.v.outputs.build_timestamp }}
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      nightly_timestamp: ${{ steps.v.outputs.nightly_timestamp || '' }}
      channel: ${{ steps.v.outputs.channel }}
      android: ${{ steps.flags.outputs.android }}
      fdroid: ${{ steps.flags.outputs.fdroid }}
      linux: ${{ steps.flags.outputs.linux }}
      windows: ${{ steps.flags.outputs.windows }}
      ios: ${{ steps.flags.outputs.ios }}
      macos: ${{ steps.flags.outputs.macos }}
      publish_metadata: ${{ steps.flags.outputs.publish_metadata }}
      publish_github: ${{ steps.flags.outputs.publish_github }}
      publish_s3: ${{ steps.flags.outputs.publish_s3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Get package version
        id: package-version
        uses: nicolaiunrein/cargo-get@597a0a7ed638a120eadba0bbcc418b54a4ab3672 # master
        with:
          subcommand: workspace.package.version --entry nym-vpn-core/Cargo.toml

      - name: Resolve channel + version + tag
        id: v
        env:
          IS_NIGHTLY: ${{ inputs.is_nightly }}
          FULL: ${{ steps.package-version.outputs.metadata }}
        run: |
          set -euo pipefail

          BASE="${FULL%%-*}"
          NIGHTLY_TIMESTAMP=""
          BUILD_TIMESTAMP="$(date -u +%Y%m%d%H%M)"

          if [ "$IS_NIGHTLY" = "true" ]; then
            CHANNEL="nightly"
            NIGHTLY_TIMESTAMP="${BUILD_TIMESTAMP:0:8}"
            VERSION="${BASE}-nightly.${NIGHTLY_TIMESTAMP}"
          elif [[ "$FULL" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            CHANNEL="beta"
            VERSION="${FULL}"
          elif [[ "$FULL" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="ship"
            VERSION="${FULL}"
          else
            echo "::error:: unsupported version: ${FULL} (expected X.Y.Z or X.Y.Z-beta.N)"
            exit 1
          fi
          TAG="nym-vpn-v${VERSION}"

          echo "::notice:: channel=${CHANNEL} cargo_version=${FULL} version=${VERSION} tag=${TAG}"
          {
            echo "channel=${CHANNEL}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "build_timestamp=${BUILD_TIMESTAMP}"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$NIGHTLY_TIMESTAMP" ]; then
            echo "nightly_timestamp=${NIGHTLY_TIMESTAMP}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve platform flags
        id: flags
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CHANNEL: ${{ steps.v.outputs.channel }}
          IN_ANDROID: ${{ inputs.android }}
          IN_FDROID: ${{ inputs.fdroid }}
          IN_LINUX: ${{ inputs.linux }}
          IN_WINDOWS: ${{ inputs.windows }}
          IN_IOS: ${{ inputs.ios }}
          IN_MACOS: ${{ inputs.macos }}
          IN_PUBLISH_METADATA: ${{ inputs.publish-metadata }}
          IN_GH_RELEASE: ${{ inputs.gh_release }}
          IN_PUBLISH_S3: ${{ inputs.publish_s3 }}
        run: |
          set -euo pipefail

          echo "::notice:: releasing from ref $REF_NAME (event $EVENT)"

          # Platform set: a cron run, OR a dispatch with NO platform box ticked, builds
          # EVERY platform for that channel. Any box ticked builds only the ticked ones.
          if [ "$IN_ANDROID" != "true" ] && [ "$IN_FDROID" != "true" ] \
            && [ "$IN_LINUX" != "true" ] && [ "$IN_WINDOWS" != "true" ] \
            && [ "$IN_IOS" != "true" ] && [ "$IN_MACOS" != "true" ]; then
            ALL=true
          else
            ALL=false
          fi

          if [ "$ALL" = "true" ]; then
            ANDROID=true; FDROID=true; LINUX=true; WINDOWS=true; IOS=true; MACOS=true
            echo "::notice:: $CHANNEL → all platforms"
          else
            ANDROID="${IN_ANDROID:-false}"; FDROID="${IN_FDROID:-false}"; LINUX="${IN_LINUX:-false}"
            WINDOWS="${IN_WINDOWS:-false}"; IOS="${IN_IOS:-false}"; MACOS="${IN_MACOS:-false}"
            echo "::notice:: $CHANNEL → selected platforms"
          fi

          # Google Play metadata skip toggle
          PUBLISH_METADATA="${IN_PUBLISH_METADATA:-true}"
          GH_RELEASE="${IN_GH_RELEASE:-none}"

          if [[ "$GH_RELEASE" != "none" && "$GH_RELEASE" != "draft" && "$GH_RELEASE" != "auto"  ]]; then
            echo "::error:: Unknown GitHub release mode: $GH_RELEASE"
            exit 1
          fi

          if [[ "$GH_RELEASE" = "none" || "$GH_RELEASE" = "draft" ]]; then
            GH_RELEASE_TYPE="draft"

          elif [[ "$REF_NAME" == release/* ]] && [ "$CHANNEL" = "ship" ]; then
            GH_RELEASE_TYPE="release"

          elif [[ "$REF_NAME" == release/* ]] && [ "$CHANNEL" = "beta" ]; then
            GH_RELEASE_TYPE="prerelease"

          elif [ "$REF_NAME" = "develop" ] && [ "$CHANNEL" = "nightly" ]; then
            GH_RELEASE_TYPE="prerelease"

          else
            GH_RELEASE_TYPE="draft"
          fi

          if [[ "$GH_RELEASE" = "none" ]]; then
            PUBLISH_GITHUB=false
          else
            PUBLISH_GITHUB=true
          fi

          PUBLISH_S3="${IN_PUBLISH_S3:-false}"

          echo "::notice:: Publish to Github?: $PUBLISH_GITHUB"
          echo "::notice:: Github release type: $GH_RELEASE_TYPE"
          echo "::notice:: Publish to S3?: $PUBLISH_S3"

          {
            echo "android=$ANDROID"; echo "fdroid=$FDROID"; echo "linux=$LINUX"
            echo "windows=$WINDOWS"; echo "ios=$IOS"; echo "macos=$MACOS"
            echo "publish_metadata=$PUBLISH_METADATA"
            echo "gh_release_type=$GH_RELEASE_TYPE"
            echo "publish_github=$PUBLISH_GITHUB"
            echo "publish_s3=$PUBLISH_S3"
          } >> "$GITHUB_OUTPUT"

  check-release-exists:
    name: Check release exists
    runs-on: arc-linux-latest
    needs: [resolve]
    steps:
      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_RELEASE_TYPE: ${{ needs.resolve.outputs.gh_release_type }}
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          if [ "$GH_RELEASE_TYPE" = "draft" ] ; then
            echo "::warning:: Skip tag check for draft release"
            exit 0
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent ; then
            echo "::error:: Tag $TAG already exists. Aborting"
            exit 1
          fi

  reuse-build:
    name: Reuse build from run ${{ inputs.build_run_id }}
    needs: [resolve, check-release-exists]
    if: ${{ !cancelled() && needs.check-release-exists.result == 'success' && inputs.build_run_id }}
    runs-on: arc-linux-latest
    permissions:
      actions: read
    outputs:
      artifacts: ${{ steps.list.outputs.artifacts }}
      build_outputs: ${{ steps.list.outputs.build_outputs }}
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build_outputs
          path: build_outputs
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Read build outputs
        id: list
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          jq . build_outputs/build-outputs.json build_outputs/artifacts.json
          REUSED_VERSION="$(jq -r '.version // empty' build_outputs/build-outputs.json)"
          if [ "$REUSED_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error:: run ${BUILD_RUN_ID} has version '${REUSED_VERSION}', expected '${EXPECTED_VERSION}'"
            exit 1
          fi
          echo "artifacts=$(jq -c . build_outputs/artifacts.json)" >> "$GITHUB_OUTPUT"
          echo "build_outputs=$(jq -c . build_outputs/build-outputs.json)" >> "$GITHUB_OUTPUT"

  reuse-build-artifacts:
    name: Copy ${{ matrix.artifact }}
    needs: [reuse-build]
    runs-on: arc-linux-latest
    permissions:
      actions: read
    strategy:
      matrix:
        artifact: ${{ fromJSON(needs.reuse-build.outputs.artifacts) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: artifact
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  build:
    needs: [resolve, check-release-exists]
    if: ${{ !cancelled() && needs.check-release-exists.result == 'success' && !inputs.build_run_id }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      release_channel: ${{ needs.resolve.outputs.channel }}
      version: ${{ needs.resolve.outputs.version }}
      nightly_timestamp: ${{ needs.resolve.outputs.nightly_timestamp }}
      android: ${{ needs.resolve.outputs.android == 'true' && needs.resolve.outputs.channel == 'ship' }}
      fdroid: ${{ needs.resolve.outputs.fdroid == 'true' }}
      linux: ${{ needs.resolve.outputs.linux == 'true' }}
      windows: ${{ needs.resolve.outputs.windows == 'true' }}
      ios: ${{ needs.resolve.outputs.ios == 'true' }}
      macos: ${{ needs.resolve.outputs.macos == 'true' }}
    secrets: inherit

  build-outputs:
    runs-on: arc-linux-latest
    needs: [resolve, build, reuse-build, reuse-build-artifacts]
    permissions:
      actions: read
    if: |
      !cancelled() && (
        needs.build.result == 'success' ||
        needs.reuse-build-artifacts.result == 'success'
      )
    outputs:
      pkg_installer_name: ${{ steps.set-outputs.outputs.pkg_installer_name }}
      vpnc_pkg_installer_name: ${{ steps.set-outputs.outputs.vpnc_pkg_installer_name }}
      fdroid_artifact_name: ${{ steps.set-outputs.outputs.fdroid_artifact_name }}
      play_artifact_name: ${{ steps.set-outputs.outputs.play_artifact_name }}
      ios_ipa_name: ${{ steps.set-outputs.outputs.ios_ipa_name }}
      ios_build: ${{ steps.set-outputs.outputs.ios_build }}
    steps:
      - name: Resolve build outputs
        id: set-outputs
        env:
          REUSED_BUILD_OUTPUTS: ${{ needs.reuse-build.outputs.build_outputs }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PKG_INSTALLER_NAME: ${{ needs.build.outputs.pkg_installer_name }}
          VPNC_PKG_INSTALLER_NAME: ${{ needs.build.outputs.vpnc_pkg_installer_name }}
          FDROID_ARTIFACT_NAME: ${{ needs.build.outputs.fdroid_artifact_name }}
          PLAY_ARTIFACT_NAME: ${{ needs.build.outputs.play_artifact_name }}
          IOS_IPA_NAME: ${{ needs.build.outputs.ios_ipa_name }}
          IOS_BUILD: ${{ needs.build.outputs.ios_build }}
        run: |
          set -euo pipefail
          if [ -n "$REUSED_BUILD_OUTPUTS" ]; then
            echo "$REUSED_BUILD_OUTPUTS" > build-outputs.json
          else
            jq -n \
              --arg version "$VERSION" \
              --arg pkg_installer_name "$PKG_INSTALLER_NAME" \
              --arg vpnc_pkg_installer_name "$VPNC_PKG_INSTALLER_NAME" \
              --arg fdroid_artifact_name "$FDROID_ARTIFACT_NAME" \
              --arg play_artifact_name "$PLAY_ARTIFACT_NAME" \
              --arg ios_ipa_name "$IOS_IPA_NAME" \
              --arg ios_build "$IOS_BUILD" \
              '$ARGS.named' > build-outputs.json
          fi
          jq . build-outputs.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' build-outputs.json >> "$GITHUB_OUTPUT"

      # Lets a later run reuse this build via the build_run_id input. Only
      # artifacts that exist at this point are copied, not ones uploaded by
      # the release jobs.
      - name: List build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].name' | jq -Rsc 'split("\n") | map(select(length > 0))' > artifacts.json
          jq . artifacts.json

      - name: Upload build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build_outputs
          path: |
            build-outputs.json
            artifacts.json
          if-no-files-found: error
          retention-days: 1

  upload-debug-symbols:
    needs: [resolve, build]
    uses: ./.github/workflows/upload-debug-symbols.yml
    with:
      publish_s3: ${{ needs.resolve.outputs.publish_s3 == 'true' }}
      github_branch: ${{ github.ref_name }}
      build_timestamp: ${{ needs.resolve.outputs.build_timestamp }}
    secrets: inherit

  release:
    needs: [resolve, build-outputs]
    if: |
      !cancelled() && needs.build-outputs.result == 'success' && (needs.resolve.outputs.publish_github == 'true' || needs.resolve.outputs.publish_s3 == 'true')
    uses: ./.github/workflows/release-release-artifacts.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      github_release_type: ${{ needs.resolve.outputs.gh_release_type }}
      publish_github: ${{ needs.resolve.outputs.publish_github == 'true' }}
      publish_s3: ${{ needs.resolve.outputs.publish_s3 == 'true' }}
      github_branch: ${{ github.ref_name }}
      build_timestamp: ${{ needs.resolve.outputs.build_timestamp }}
      version: ${{ needs.resolve.outputs.version }}
      android: ${{ needs.resolve.outputs.android == 'true' && needs.resolve.outputs.channel == 'ship' }}
      fdroid: ${{ needs.resolve.outputs.fdroid == 'true' }}
      linux: ${{ needs.resolve.outputs.linux == 'true' }}
      windows: ${{ needs.resolve.outputs.windows == 'true' }}
      ios: ${{ needs.resolve.outputs.ios == 'true' }}
      macos: ${{ needs.resolve.outputs.macos == 'true' }}
      pkg_installer_name: ${{ needs.build-outputs.outputs.pkg_installer_name }}
      vpnc_pkg_installer_name: ${{ needs.build-outputs.outputs.vpnc_pkg_installer_name }}
      fdroid_artifact_name: ${{ needs.build-outputs.outputs.fdroid_artifact_name }}
    secrets: inherit

  distribute:
    needs: [resolve, build-outputs, release]
    # condition is needed because 'release' may be skipped due to dependence on cache actions
    if: |
      !cancelled() && needs.release.result == 'success' && needs.build-outputs.result == 'success' &&
      needs.resolve.outputs.publish_github && needs.resolve.outputs.gh_release_type != 'draft'
    uses: ./.github/workflows/distribute-release.yml
    permissions:
      contents: read
    with:
      publish_play: ${{ needs.resolve.outputs.android == 'true' && needs.resolve.outputs.channel == 'ship' }}
      publish_play_metadata: ${{ needs.resolve.outputs.publish_metadata == 'true' }}
      # only publish nightly builds to avoid downgrades
      publish_testflight: ${{ needs.resolve.outputs.ios == 'true' }}
      ios_ipa_name: ${{ needs.build-outputs.outputs.ios_ipa_name }}
      publish_to_public_testflight: true
      play_artifact_name: ${{ needs.build-outputs.outputs.play_artifact_name }}
      github_branch: ${{ github.ref_name }}
      github_sha: ${{ github.sha }}
    secrets: inherit

  update_beta_shortlink:
    needs: [resolve, release]
    if: |
      !cancelled() && needs.release.result == 'success' &&
      needs.resolve.outputs.publish_github && needs.resolve.outputs.gh_release_type == 'prerelease' &&
      needs.resolve.outputs.channel == 'beta' && needs.release.outputs.github_release_url != ''
    uses: ./.github/workflows/update-shortlink.yml
    with:
      short_code: beta
      long_url: ${{ needs.release.outputs.github_release_url }}
      title: ${{ needs.resolve.outputs.version }}
    secrets: inherit

  zulip:
    needs: [resolve, release, build-outputs, distribute]
    if: |
      !cancelled() && needs.release.result == 'success' && needs.build-outputs.result == 'success' &&
      needs.resolve.outputs.publish_github && needs.resolve.outputs.gh_release_type != 'draft'
    uses: ./.github/workflows/zulip-notify-release.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      release_channel: ${{ needs.resolve.outputs.channel }}
      github_branch: ${{ github.ref_name }}
      github_release_url: ${{ needs.release.outputs.github_release_url }}
      linux_app_deb_x64_url: ${{ needs.release.outputs.linux_app_deb_x64_url }}
      linux_app_deb_arm64_url: ${{ needs.release.outputs.linux_app_deb_arm64_url }}
      linux_app_appimage_x64_url: ${{ needs.release.outputs.linux_app_appimage_x64_url }}
      linux_app_appimage_arm64_url: ${{ needs.release.outputs.linux_app_appimage_arm64_url }}
      windows_installer_x64_url: ${{ needs.release.outputs.windows_installer_x64_url }}
      windows_installer_arm64_url: ${{ needs.release.outputs.windows_installer_arm64_url }}
      macos_installer_url: ${{ needs.release.outputs.macos_installer_url }}
      vpnc_macos_installer_url: ${{ needs.release.outputs.vpnc_macos_installer_url }}
      android_apk_url: ${{ needs.release.outputs.android_apk_url }}
      ios_build: ${{ needs.build-outputs.outputs.ios_build }}
    secrets: inherit

  # Post-publish fan-out: changelog/installer PR, tauri + Sparkle updater feeds, AUR
  # packages, F-Droid dispatch, nym.com cache bust. Normally on-release-publish.yml
  # drives itself off `release: [released]` when a human clicks Publish on a draft.
  #
  # That webhook NEVER fires on the gh_release=auto + ship path: create-release
  # publishes the release itself with GITHUB_TOKEN, and GitHub deliberately emits no
  # events for actions taken with GITHUB_TOKEN. So call it directly instead of
  # relying on a webhook that cannot arrive.
  #
  # Scoped to gh_release_type == 'release' on purpose:
  #   draft      -> stays on the human-publish route, where the webhook does fire
  #   prerelease -> beta/nightly must not reach AUR or the stable updater feeds
  # so this can never double-run against the webhook path.
  post-release-fanout:
    needs: [resolve, release]
    if: |
      !cancelled() && needs.release.result == 'success' &&
      needs.resolve.outputs.publish_github == 'true' &&
      needs.resolve.outputs.gh_release_type == 'release'
    uses: ./.github/workflows/on-release-publish.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      tag_name: ${{ needs.resolve.outputs.tag }}
      linux: ${{ needs.resolve.outputs.linux == 'true' }}
      windows: ${{ needs.resolve.outputs.windows == 'true' }}
      macos: ${{ needs.resolve.outputs.macos == 'true' }}
      fdroid: ${{ needs.resolve.outputs.fdroid == 'true' }}
    secrets: inherit
