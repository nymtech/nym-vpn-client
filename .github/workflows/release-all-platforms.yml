name: release-all-platforms

on:
  # NOTE: pick the release branch in the "Run workflow" ref selector.
  workflow_dispatch:
    inputs:
      # Github release mode:
      # - none = no release
      # - draft = draft release
      # - auto = based on branch and release channel;
      #   release/*, ship -> release;
      #   release/*, beta -> prerelease;
      #   develop, nightly -> prerelease;
      #   rest: draft
      gh_release:
        description: Github release
        type: choice
        default: 'none'
        options:
          - none
          - draft
          - auto
      publish_s3:
        description: "Publish to S3 (Garage)"
        type: boolean
        default: true
      release_channel:
        description: "Release channel"
        type: choice
        default: nightly
        options:
          - nightly   # daily prerelease
          - beta      # release candidate
          - ship      # stable release
      android:
        description: "Android → Google Play"
        type: boolean
        default: false
      fdroid:
        description: "F-Droid (ship only)"
        type: boolean
        default: false
      linux:
        description: "Linux (deb/AppImage + AUR)"
        type: boolean
        default: false
      windows:
        description: "Windows (signed exe + updater)"
        type: boolean
        default: false
      ios:
        description: "iOS → TestFlight/App Store"
        type: boolean
        default: false
      macos:
        description: "macOS (.pkg + Sparkle)"
        type: boolean
        default: false
      publish-metadata:
        description: "Publish Google Play metadata"
        type: boolean
        default: false
  workflow_call:
    inputs:
      gh_release:
        description: "Github release mode (none, draft, auto)"
        type: string
        default: 'draft' # none, draft, public
      release_channel:
        description: "Release channel"
        type: string # nightly, beta, ship
        default: nightly
      android:
        description: "Android → Google Play"
        type: boolean
        default: false
      fdroid:
        description: "F-Droid (ship only)"
        type: boolean
        default: false
      linux:
        description: "Linux (deb/AppImage + AUR)"
        type: boolean
        default: false
      windows:
        description: "Windows (signed exe + updater)"
        type: boolean
        default: false
      ios:
        description: "iOS → TestFlight/App Store"
        type: boolean
        default: false
      macos:
        description: "macOS (.pkg + Sparkle)"
        type: boolean
        default: false
      publish-metadata:
        description: "Publish Google Play metadata"
        type: boolean
        default: false

permissions:
  contents: read

# Ship/beta runs key off the ref so different release branches/versions run in parallel.
# Nightly runs (cron + the no-platform-selected fallback) all share ONE group:
concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_channel }}
  cancel-in-progress: false

env:
  APP_ARTIFACTS_LINUX_AARCH64: app_artifacts_linux_aarch64
  APP_ARTIFACTS_LINUX_X86_64: app_artifacts_linux_x86_64
  APP_ARTIFACTS_WINDOWS_ARM64: app_artifacts_windows_arm64
  APP_ARTIFACTS_WINDOWS_X64: app_artifacts_windows_x64
  APP_ARTIFACTS_ANDROID_FDROID: android_artifacts_fdroid
  APP_ARTIFACTS_ANDROID_PLAY: android_artifacts_play
  CORE_ARTIFACTS_LINUX_X86_64: core_artifacts_linux_x86_64
  CORE_ARTIFACTS_LINUX_AARCH64: core_artifacts_linux_aarch64
  CORE_ARTIFACTS_WINDOWS_X64: core_artifacts_windows_x64
  CORE_ARTIFACTS_WINDOWS_ARM64: core_artifacts_windows_arm64
  DEB_ARTIFACTS_X86_64: deb_artifacts_x86_64
  DEB_ARTIFACTS_AARCH64: deb_artifacts_aarch64
  IOS_ARTIFACTS: ios_artifacts
  MACOS_ARTIFACTS: macos_artifacts
  VPNC_MACOS_ARTIFACTS: vpnc_macos_artifacts
  # Only used for testing purposes and must not be used in production
  DANGER_BUILD_CACHE_KEY: all_artifacts_v10 # used when testing workflow

jobs:
  resolve:
    runs-on: arc-linux-latest
    outputs:
      gh_release_type: ${{ steps.flags.outputs.gh_release_type }}
      build_timestamp: ${{ steps.v.outputs.build_timestamp }}
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      nightly_timestamp: ${{ steps.v.outputs.nightly_timestamp || '' }}
      channel: ${{ steps.v.outputs.channel }}
      android: ${{ steps.flags.outputs.android }}
      fdroid: ${{ steps.flags.outputs.fdroid }}
      linux: ${{ steps.flags.outputs.linux }}
      windows: ${{ steps.flags.outputs.windows }}
      ios: ${{ steps.flags.outputs.ios }}
      macos: ${{ steps.flags.outputs.macos }}
      publish_metadata: ${{ steps.flags.outputs.publish_metadata }}
      publish_github: ${{ steps.flags.outputs.publish_github }}
      publish_s3: ${{ steps.flags.outputs.publish_s3 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Resolve channel + platform flags
        id: flags
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_CHANNEL: ${{ inputs.release_channel }}
          IN_ANDROID: ${{ inputs.android }}
          IN_FDROID: ${{ inputs.fdroid }}
          IN_LINUX: ${{ inputs.linux }}
          IN_WINDOWS: ${{ inputs.windows }}
          IN_IOS: ${{ inputs.ios }}
          IN_MACOS: ${{ inputs.macos }}
          IN_PUBLISH_METADATA: ${{ inputs.publish-metadata }}
          IN_GH_RELEASE: ${{ inputs.gh_release }}
          IN_PUBLISH_S3: ${{ inputs.publish_s3 }}
        run: |
          set -euo pipefail

          echo "::notice:: releasing from ref $REF_NAME (event $EVENT)"

          CHANNEL="${IN_CHANNEL:-nightly}"

          # Platform set: a cron run, OR a dispatch with NO platform box ticked, builds
          # EVERY platform for that channel. Any box ticked builds only the ticked ones.
          if [ "$IN_ANDROID" != "true" ] && [ "$IN_FDROID" != "true" ] \
            && [ "$IN_LINUX" != "true" ] && [ "$IN_WINDOWS" != "true" ] \
            && [ "$IN_IOS" != "true" ] && [ "$IN_MACOS" != "true" ]; then
            ALL=true
          else
            ALL=false
          fi

          if [ "$ALL" = "true" ]; then
            ANDROID=true; FDROID=true; LINUX=true; WINDOWS=true; IOS=true; MACOS=true
            echo "::notice:: $CHANNEL → all platforms"
          else
            ANDROID="${IN_ANDROID:-false}"; FDROID="${IN_FDROID:-false}"; LINUX="${IN_LINUX:-false}"
            WINDOWS="${IN_WINDOWS:-false}"; IOS="${IN_IOS:-false}"; MACOS="${IN_MACOS:-false}"
            echo "::notice:: $CHANNEL → selected platforms"
          fi

          # Google Play metadata skip toggle
          PUBLISH_METADATA="${IN_PUBLISH_METADATA:-true}"
          GH_RELEASE="${IN_GH_RELEASE:-none}"

          if [[ "$GH_RELEASE" != "none" && "$GH_RELEASE" != "draft" && "$GH_RELEASE" != "auto"  ]]; then
            echo "::error:: Unknown GitHub release mode: $GH_RELEASE"
            exit 1
          fi

          if [[ "$GH_RELEASE" = "none" || "$GH_RELEASE" = "draft" ]]; then
            GH_RELEASE_TYPE="draft"

          elif [[ "$REF_NAME" == release/* ]] && [ "$CHANNEL" = "ship" ]; then
            GH_RELEASE_TYPE="release"

          elif [[ "$REF_NAME" == release/* ]] && [ "$CHANNEL" = "beta" ]; then
            GH_RELEASE_TYPE="prerelease"

          elif [ "$REF_NAME" = "develop" ] && [ "$CHANNEL" = "nightly" ]; then
            GH_RELEASE_TYPE="prerelease"

          else
            GH_RELEASE_TYPE="draft"
          fi

          if [[ "$GH_RELEASE" = "none" ]]; then
            PUBLISH_GITHUB=false
          else
            PUBLISH_GITHUB=true
          fi

          PUBLISH_S3="${IN_PUBLISH_S3:-false}"

          echo "::notice:: Publish to Github?: $PUBLISH_GITHUB"
          echo "::notice:: Github release type: $GH_RELEASE_TYPE"
          echo "::notice:: Publish to S3?: $PUBLISH_S3"

          {
            echo "channel=$CHANNEL"
            echo "android=$ANDROID"; echo "fdroid=$FDROID"; echo "linux=$LINUX"
            echo "windows=$WINDOWS"; echo "ios=$IOS"; echo "macos=$MACOS"
            echo "publish_metadata=$PUBLISH_METADATA"
            echo "gh_release_type=$GH_RELEASE_TYPE"
            echo "publish_github=$PUBLISH_GITHUB"
            echo "publish_s3=$PUBLISH_S3"
          } >> "$GITHUB_OUTPUT"

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Resolve version + tag
        id: v
        env:
          RELEASE_CHANNEL: ${{ steps.flags.outputs.channel }}
          # beta auto-advances its -beta.N by reading prior beta releases/tags
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release/resolve-version.sh

  check-release-exists:
    name: Check release exists
    runs-on: arc-linux-latest
    needs: [resolve]
    steps:
      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_RELEASE_TYPE: ${{ needs.resolve.outputs.gh_release_type }}
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          if [ "$GH_RELEASE_TYPE" = "draft" ] ; then
            echo "::warning:: Skip tag check for draft release"
            exit 0
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" ; then
            echo "::error:: Release $TAG already exists. Aborting"
            exit 1
          fi

