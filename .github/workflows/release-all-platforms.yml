name: release-all-platforms

on:
  # Temporary for initial PR
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/release-all-platforms.yml"
  # NOTE: pick the release branch in the "Run workflow" ref selector. Reusable callees
  # always run at the SAME ref as this orchestrator, so the dispatch ref IS the release
  # branch — there is no separate branch input (it could not redirect the callees).
  # Scheduled (nightly) runs use the repository default branch (develop).
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel"
        type: choice
        default: nightly
        options:
          - nightly   # immutable, auto-published prerelease; app version <base>-nightly
          - beta      # release candidate; core version MUST contain -beta; prerelease draft
          - ship      # stable release; core version MUST NOT contain -beta; draft
      android:
        description: "Android → Google Play"
        type: boolean
        default: false
      fdroid:
        description: "F-Droid (ship only)"
        type: boolean
        default: false
      linux:
        description: "Linux (deb/AppImage + AUR)"
        type: boolean
        default: false
      windows:
        description: "Windows (signed exe + updater)"
        type: boolean
        default: false
      ios:
        description: "iOS → TestFlight/App Store"
        type: boolean
        default: false
      macos:
        description: "macOS (.pkg + Sparkle)"
        type: boolean
        default: false
      publish-metadata:
        description: "Publish Google Play metadata"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_channel:
        description: "Release channel"
        type: string # nightly, beta, ship
        default: nightly
      android:
        description: "Android → Google Play"
        type: boolean
        default: false
      fdroid:
        description: "F-Droid (ship only)"
        type: boolean
        default: false
      linux:
        description: "Linux (deb/AppImage + AUR)"
        type: boolean
        default: false
      windows:
        description: "Windows (signed exe + updater)"
        type: boolean
        default: false
      ios:
        description: "iOS → TestFlight/App Store"
        type: boolean
        default: false
      macos:
        description: "macOS (.pkg + Sparkle)"
        type: boolean
        default: false
      publish-metadata:
        description: "Publish Google Play metadata"
        type: boolean
        default: false

permissions:
  contents: read

# Ship/beta runs key off the ref so different release branches/versions run in parallel.
# Nightly runs (cron + the no-platform-selected fallback) all share ONE group:
# ensure-release.sh deletes ALL prior nightly releases, so two concurrent nightlies would
# clobber each other's release state regardless of ref.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_channel }}
  cancel-in-progress: false


env:
  APP_ARTIFACTS_LINUX_AARCH64: app_artifacts_linux_aarch64
  APP_ARTIFACTS_LINUX_X86_64: app_artifacts_linux_x86_64
  APP_ARTIFACTS_WINDOWS_ARM64: app_artifacts_windows_arm64
  APP_ARTIFACTS_WINDOWS_X64: app_artifacts_windows_x64
  APP_ARTIFACTS_ANDROID_FDROID: android_artifacts_fdroid
  APP_ARTIFACTS_ANDROID_PLAY: android_artifacts_play
  CORE_ARTIFACTS_LINUX_X86_64: core_artifacts_linux_x86_64
  CORE_ARTIFACTS_LINUX_AARCH64: core_artifacts_linux_aarch64
  CORE_ARTIFACTS_WINDOWS_X64: core_artifacts_windows_x64
  CORE_ARTIFACTS_WINDOWS_ARM64: core_artifacts_windows_arm64
  DEB_ARTIFACTS_X86_64: deb_artifacts_x86_64
  DEB_ARTIFACTS_AARCH64: deb_artifacts_aarch64
  IOS_ARTIFACTS: ios_artifacts
  MACOS_ARTIFACTS: macos_artifacts

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      android: ${{ steps.flags.outputs.android }}
      fdroid: ${{ steps.flags.outputs.fdroid }}
      linux: ${{ steps.flags.outputs.linux }}
      windows: ${{ steps.flags.outputs.windows }}
      ios: ${{ steps.flags.outputs.ios }}
      macos: ${{ steps.flags.outputs.macos }}
      publish_metadata: ${{ steps.flags.outputs.publish_metadata }}
    steps:
      - name: Resolve channel + platform flags
        id: flags
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_CHANNEL: ${{ inputs.release_channel }}
          IN_ANDROID: ${{ inputs.android }}
          IN_FDROID: ${{ inputs.fdroid }}
          IN_LINUX: ${{ inputs.linux }}
          IN_WINDOWS: ${{ inputs.windows }}
          IN_IOS: ${{ inputs.ios }}
          IN_MACOS: ${{ inputs.macos }}
          IN_PUBLISH_METADATA: ${{ inputs.publish-metadata }}
        run: |
          set -euo pipefail

          # Used for testing purposes when running this workflow from PR
          if ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}; then
            echo "::notice:: dry-run release from ref $REF_NAME (event $EVENT)"
            echo "::notice:: nightly → all platforms (dry run)"
            {
              echo "channel=nightly"
              echo "android=true"; echo "fdroid=true"; echo "linux=true"
              echo "windows=true"; echo "ios=true"; echo "macos=true"
              echo "publish_metadata=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice:: releasing from ref $REF_NAME (event $EVENT)"

          # Channel: scheduled runs are always nightly; a manual dispatch honours the
          # chosen release_channel (the platform selection no longer overrides it).
          if [ "$EVENT" = "schedule" ]; then
            CHANNEL=nightly
          else
            CHANNEL="${IN_CHANNEL:-nightly}"
          fi

          # Platform set: a cron run, OR a dispatch with NO platform box ticked, builds
          # EVERY platform for that channel. Any box ticked builds only the ticked ones.
          if [ "$EVENT" = "schedule" ] \
            || { [ "$IN_ANDROID" != "true" ] && [ "$IN_FDROID" != "true" ] \
              && [ "$IN_LINUX" != "true" ] && [ "$IN_WINDOWS" != "true" ] \
              && [ "$IN_IOS" != "true" ] && [ "$IN_MACOS" != "true" ]; }; then
            ALL=true
          else
            ALL=false
          fi

          if [ "$ALL" = "true" ]; then
            ANDROID=true; LINUX=true; WINDOWS=true; IOS=true; MACOS=true
            # The F-Droid APK is built + attached by the Android job regardless of this
            # flag; `fdroid` only DISPATCHES the F-Droid repo (a store) = ship-only.
            if [ "$CHANNEL" = "ship" ]; then FDROID=true; else FDROID=false; fi
            echo "::notice:: $CHANNEL → all platforms (F-Droid submission: $FDROID)"
          else
            ANDROID="${IN_ANDROID:-false}"; LINUX="${IN_LINUX:-false}"
            WINDOWS="${IN_WINDOWS:-false}"; IOS="${IN_IOS:-false}"; MACOS="${IN_MACOS:-false}"
            # F-Droid repo dispatch is ship-only; on nightly/beta the box is a no-op
            # (the F-Droid APK still builds + attaches via the Android job).
            if [ "$CHANNEL" = "ship" ] && [ "$IN_FDROID" = "true" ]; then FDROID=true; else FDROID=false; fi
            echo "::notice:: $CHANNEL → selected platforms"
          fi

          # Google Play metadata skip toggle (schedule/cron defaults to true = skip).
          PUBLISH_METADATA="${IN_PUBLISH_METADATA:-true}"

          {
            echo "channel=$CHANNEL"
            echo "android=$ANDROID"; echo "fdroid=$FDROID"; echo "linux=$LINUX"
            echo "windows=$WINDOWS"; echo "ios=$IOS"; echo "macos=$MACOS"
            echo "publish_metadata=$PUBLISH_METADATA"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Resolve version + tag
        id: v
        env:
          RELEASE_CHANNEL: ${{ steps.flags.outputs.channel }}
          # beta auto-advances its -beta.N by reading prior beta releases/tags
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release/resolve-version.sh

  restore-build-cache:
    needs: [resolve]
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            ${{ env.APP_ARTIFACTS_LINUX_AARCH64 }}
            ${{ env.APP_ARTIFACTS_LINUX_X86_64 }}
            ${{ env.APP_ARTIFACTS_WINDOWS_ARM64 }}
            ${{ env.APP_ARTIFACTS_WINDOWS_X64 }}
            ${{ env.CORE_ARTIFACTS_LINUX_X86_64 }}
            ${{ env.CORE_ARTIFACTS_LINUX_AARCH64 }}
            ${{ env.APP_ARTIFACTS_ANDROID_FDROID }}
            ${{ env.APP_ARTIFACTS_ANDROID_PLAY }}
            ${{ env.CORE_ARTIFACTS_WINDOWS_X64 }}
            ${{ env.CORE_ARTIFACTS_WINDOWS_ARM64 }}
            ${{ env.DEB_ARTIFACTS_X86_64 }}
            ${{ env.DEB_ARTIFACTS_AARCH64 }}
            ${{ env.IOS_ARTIFACTS }}
            ${{ env.MACOS_ARTIFACTS }}
          key: ${{ runner.os }}

  build:
    needs: [resolve, restore-build-cache]
    if: ${{ needs.restore-build-cache.outputs.cache-hit == false }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      release_channel: ${{ needs.resolve.outputs.channel }}
      android: ${{ needs.resolve.outputs.android == 'true' }}
      fdroid: ${{ needs.resolve.outputs.fdroid == 'true' }}
      linux: ${{ needs.resolve.outputs.linux == 'true' }}
      windows: ${{ needs.resolve.outputs.windows == 'true' }}
      ios: ${{ needs.resolve.outputs.ios == 'true' }}
      macos: ${{ needs.resolve.outputs.macos == 'true' }}
    secrets: inherit

  save-build-cache:
    needs: [resolve, build, restore-build-cache]
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ needs.restore-build-cache.outputs.cache-hit == false }}
    steps:
      - uses: actions/download-artifact@v8
      - uses: actions/cache/save@v6
        id: cache
        with:
          path: |
            ${{ env.APP_ARTIFACTS_LINUX_AARCH64 }}
            ${{ env.APP_ARTIFACTS_LINUX_X86_64 }}
            ${{ env.APP_ARTIFACTS_WINDOWS_ARM64 }}
            ${{ env.APP_ARTIFACTS_WINDOWS_X64 }}
            ${{ env.CORE_ARTIFACTS_LINUX_X86_64 }}
            ${{ env.CORE_ARTIFACTS_LINUX_AARCH64 }}
            ${{ env.APP_ARTIFACTS_ANDROID_FDROID }}
            ${{ env.APP_ARTIFACTS_ANDROID_PLAY }}
            ${{ env.CORE_ARTIFACTS_WINDOWS_X64 }}
            ${{ env.CORE_ARTIFACTS_WINDOWS_ARM64 }}
            ${{ env.DEB_ARTIFACTS_X86_64 }}
            ${{ env.DEB_ARTIFACTS_AARCH64 }}
            ${{ env.IOS_ARTIFACTS }}
            ${{ env.MACOS_ARTIFACTS }}
          key: ${{ runner.os }}

  release:
    needs: [resolve, build, restore-build-cache, save-build-cache]
    if: |
      !cancelled() && (
        needs.restore-build-cache.outputs.cache-hit == 'true' ||
        needs.build.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        if: ${{ needs.restore-build-cache.outputs.cache-hit == false }}
        uses: actions/download-artifact@v8

      - uses: actions/cache/restore@v6
        if: ${{ needs.restore-build-cache.outputs.cache-hit == true }}
        with:
          path: |
            ${{ env.APP_ARTIFACTS_LINUX_AARCH64 }}
            ${{ env.APP_ARTIFACTS_LINUX_X86_64 }}
            ${{ env.APP_ARTIFACTS_WINDOWS_ARM64 }}
            ${{ env.APP_ARTIFACTS_WINDOWS_X64 }}
            ${{ env.CORE_ARTIFACTS_LINUX_X86_64 }}
            ${{ env.CORE_ARTIFACTS_LINUX_AARCH64 }}
            ${{ env.APP_ARTIFACTS_ANDROID_FDROID }}
            ${{ env.APP_ARTIFACTS_ANDROID_PLAY }}
            ${{ env.CORE_ARTIFACTS_WINDOWS_X64 }}
            ${{ env.CORE_ARTIFACTS_WINDOWS_ARM64 }}
            ${{ env.DEB_ARTIFACTS_X86_64 }}
            ${{ env.DEB_ARTIFACTS_AARCH64 }}
            ${{ env.IOS_ARTIFACTS }}
            ${{ env.MACOS_ARTIFACTS }}
          key: ${{ runner.os }}

      - run: |
          ls -la
          tree -d .

      - name: Prepare build output directory
        shell: bash
        env:
          OUTPUT_DIR_BASE: ci-builds/${{ github.ref_name }}
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M) # Short and suitable for paths
          OUTPUT_DIR="$OUTPUT_DIR_BASE/$TIMESTAMP"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV
          rm -rf ci-builds || true
          mkdir -p $OUTPUT_DIR
          echo $OUTPUT_DIR

      - name: Copy artifacts (Linux)
        if: ${{ needs.resolve.outputs.linux == 'true' }}
        env:
          BASENAME: nym-vpn-core-v${{ needs.resolve.outputs.version }}
        run: |
          ARCHIVE_LINUX_X86_64=${BASENAME}_linux_x86_64
          ARCHIVE_LINUX_AARCH64=${BASENAME}_linux_aarch64

          echo "ARCHIVE_LINUX_X86_64=${ARCHIVE_LINUX_X86_64}" >> $GITHUB_ENV
          echo "ARCHIVE_LINUX_AARCH64=${ARCHIVE_LINUX_AARCH64}" >> $GITHUB_ENV

          mv -v ${{ env.CORE_ARTIFACTS_LINUX_X86_64 }} ${ARCHIVE_LINUX_X86_64}
          mv -v ${{ env.CORE_ARTIFACTS_LINUX_AARCH64 }} ${ARCHIVE_LINUX_AARCH64}
          mv -v ${{ env.CORE_ARTIFACTS_WINDOWS_X64 }} ${ARCHIVE_WINDOWS_X64}
          mv -v ${{ env.CORE_ARTIFACTS_WINDOWS_ARM64 }} ${ARCHIVE_WINDOWS_ARM64}

          test -d ${ARCHIVE_LINUX_X86_64} && tar cvzf ${ARCHIVE_LINUX_X86_64}.tar.gz ${ARCHIVE_LINUX_X86_64}
          test -d ${ARCHIVE_LINUX_AARCH64} && tar cvzf ${ARCHIVE_LINUX_AARCH64}.tar.gz ${ARCHIVE_LINUX_AARCH64}

          cp -v ${{ env.ARCHIVE_LINUX_X86_64 }}.tar.gz ${{ env.OUTPUT_DIR }}
          cp -v ${{ env.ARCHIVE_LINUX_AARCH64 }}.tar.gz ${{ env.OUTPUT_DIR }}
          cp -v ${{ env.DEB_ARTIFACTS_X86_64 }}/*.deb ${{ env.OUTPUT_DIR }}
          cp -v ${{ env.DEB_ARTIFACTS_AARCH64 }}/*.deb ${{ env.OUTPUT_DIR }}

      - name: Copy artifacts (Windows)
        if: ${{ needs.resolve.outputs.windows == 'true' }}
        env:
          BASENAME: nym-vpn-core-v${{ needs.resolve.outputs.version }}
        run: |
          ARCHIVE_WINDOWS_X64=${BASENAME}_windows_x86_64
          ARCHIVE_WINDOWS_ARM64=${BASENAME}_windows_aarch64

          echo "ARCHIVE_WINDOWS_X64=${ARCHIVE_WINDOWS_X64}" >> $GITHUB_ENV
          echo "ARCHIVE_WINDOWS_ARM64=${ARCHIVE_WINDOWS_ARM64}" >> $GITHUB_ENV

          mv -v ${{ env.CORE_ARTIFACTS_WINDOWS_X64 }} ${ARCHIVE_WINDOWS_X64}
          mv -v ${{ env.CORE_ARTIFACTS_WINDOWS_ARM64 }} ${ARCHIVE_WINDOWS_ARM64}

          test -d ${ARCHIVE_WINDOWS_X64} && zip -r ${ARCHIVE_WINDOWS_X64}.zip ${ARCHIVE_WINDOWS_X64}
          test -d ${ARCHIVE_WINDOWS_ARM64} && zip -r ${ARCHIVE_WINDOWS_ARM64}.zip ${ARCHIVE_WINDOWS_ARM64}

          cp -v ${{ env.ARCHIVE_WINDOWS_X64 }}.zip ${{ env.OUTPUT_DIR }}
          cp -v ${{ env.ARCHIVE_WINDOWS_ARM64 }}.zip ${{ env.OUTPUT_DIR }}

      - name: Copy artifacts (macOS)
        if: ${{ needs.resolve.outputs.macos == 'true' }}
        env:
          MACOS_INSTALLER_NAME: ${{ needs.build.outputs.pkg_installer_name }}
        run: |
          echo "MACOS_INSTALLER_NAME=${MACOS_INSTALLER_NAME}" >> $GITHUB_ENV

          cp -v ${{ env.APP_ARTIFACTS_MACOS }}/${MACOS_INSTALLER_NAME} ${{ env.OUTPUT_DIR }}

      - name: Copy artifacts (Linux/App)
        if: ${{ needs.resolve.outputs.linux == 'true' }}
        env:
          BIN_BASENAME: nym-vpn_${{ needs.resolve.outputs.version }}
          DEB_BASENAME: nym-vpn-app_${{ needs.resolve.outputs.version }}
        run: |
          LINUX_INSTALL=install
          LINUX_APP_X64_BIN="${BIN_BASENAME}_linux_x64"
          LINUX_APP_ARM64_BIN="${BIN_BASENAME}_linux_arm64"
          LINUX_APP_DEB_X64="${DEB_BASENAME}_amd64.deb"
          LINUX_APP_DEB_ARM64="${DEB_BASENAME}_arm64.deb"

          echo "LINUX_INSTALL=$LINUX_INSTALL" >> $GITHUB_ENV
          echo "LINUX_APP_X64_BIN=$LINUX_APP_X64_BIN" >> $GITHUB_ENV
          echo "LINUX_APP_ARM64_BIN=$LINUX_APP_ARM64_BIN" >> $GITHUB_ENV
          echo "LINUX_APP_DEB_X64=$LINUX_APP_DEB_X64" >> $GITHUB_ENV
          echo "LINUX_APP_DEB_ARM64=$LINUX_APP_DEB_ARM64" >> $GITHUB_ENV

          cp -v ${{ env.APP_ARTIFACTS_LINUX_X86_64 }}/$LINUX_INSTALL ${{ env.OUTPUT_DIR }}

          cp -v ${{ env.APP_ARTIFACTS_LINUX_X86_64 }}/${LINUX_APP_X64_BIN} ${{ env.OUTPUT_DIR }}
          cp -v ${{ env.APP_ARTIFACTS_LINUX_AARCH64 }}/${LINUX_APP_ARM64_BIN} ${{ env.OUTPUT_DIR }}

          cp -v ${{ env.APP_ARTIFACTS_LINUX_AARCH64 }}/${LINUX_APP_DEB_X64} ${{ env.OUTPUT_DIR }}
          cp -v ${{ env.APP_ARTIFACTS_LINUX_AARCH64 }}/${LINUX_APP_DEB_ARM64} ${{ env.OUTPUT_DIR }}

      - name: Copy artifacts (Windows/App)
        if: ${{ needs.resolve.outputs.windows == 'true' }}
        env:
          BASENAME: NymVPN_${{ needs.resolve.outputs.version }}
        run: |
          WINDOWS_APP_INSTALLER_X64="${BASENAME}_x64-setup.exe"
          WINDOWS_APP_INSTALLER_ARM64="${BASENAME}_arm64-setup.exe"

          echo "WINDOWS_APP_INSTALLER_X64=$WINDOWS_APP_INSTALLER_X64" >> $GITHUB_ENV
          echo "WINDOWS_APP_INSTALLER_ARM64=$WINDOWS_APP_INSTALLER_ARM64" >> $GITHUB_ENV

          cp -v ${{ env.APP_ARTIFACTS_WINDOWS_ARM64 }}/${WINDOWS_APP_INSTALLER_X64} ${{ env.OUTPUT_DIR }}
          cp -v ${{ env.APP_ARTIFACTS_WINDOWS_X64 }}/${WINDOWS_APP_INSTALLER_ARM64} ${{ env.OUTPUT_DIR }}

      - name: Copy artifacts (Android)
        if: ${{ needs.resolve.outputs.android == 'true' && needs.resolve.outputs.fdroid == 'true' }}
        env:
          ANDROID_APK: ${{ needs.build.outputs.fdroid_artifact_name }}
        run: |
          echo "ANDROID_APK=${ANDROID_APK}" >> $GITHUB_ENV

          cp -v ${{ env.APP_ARTIFACTS_ANDROID_FDROID }}/${ANDROID_APK}.apk {{ env.OUTPUT_DIR }}

      - name: Generate checksums
        run: |
          for file in "${{ env.OUTPUT_DIR }}/*"; do
              if [ -f "$file" ] && [[ "$file" != *.sha256sum ]]; then
                  sha256sum "$file" > "${file}.sha256sum"
              fi
          done

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          working_directory: ${{ env.OUTPUT_DIR }}
          #tag_name: ${{ needs.resolve.outputs.tag }}
          name: "nym-vpn-v${{ needs.resolve.outputs.version }}"
          prerelease: false
          draft: true
          files: |
            ${{ env.ARCHIVE_LINUX_X86_64 }}.tar.gz
            ${{ env.ARCHIVE_LINUX_X86_64 }}.tar.gz.sha256sum
            ${{ env.ARCHIVE_LINUX_AARCH64 }}.tar.gz
            ${{ env.ARCHIVE_LINUX_AARCH64 }}.tar.gz.sha256sum
            ${{ env.ARCHIVE_WINDOWS_X64 }}.tar.gz
            ${{ env.ARCHIVE_WINDOWS_X64 }}.tar.gz.sha256sum
            ${{ env.ARCHIVE_WINDOWS_ARM64 }}.zip
            ${{ env.ARCHIVE_WINDOWS_ARM64 }}.zip.sha256sum
            ${{ env.DEB_ARTIFACTS_X86_64 }}.deb
            ${{ env.DEB_ARTIFACTS_X86_64 }}.deb.sha256sum
            ${{ env.DEB_ARTIFACTS_AARCH64 }}.deb
            ${{ env.DEB_ARTIFACTS_AARCH64 }}.deb.sha256sum
            ${{ env.ANDROID_APK }}
            ${{ env.ANDROID_APK }}.sha256sum
            ${{ env.MACOS_INSTALLER_NAME }}
            ${{ env.MACOS_INSTALLER_NAME }}.sha256sum
            ${{ env.LINUX_INSTALL }}
            ${{ env.LINUX_INSTALL }}.sha256sum
            ${{ env.LINUX_APP_X64_BIN }}
            ${{ env.LINUX_APP_X64_BIN }}.sha256sum
            ${{ env.LINUX_APP_ARM64_BIN }}
            ${{ env.LINUX_APP_ARM64_BIN }}.sha256sum
            ${{ env.LINUX_APP_DEB_X64 }}
            ${{ env.LINUX_APP_DEB_X64 }}.sha256sum
            ${{ env.LINUX_APP_DEB_ARM64 }}
            ${{ env.LINUX_APP_DEB_ARM64 }}.sha256sum
            ${{ env.WINDOWS_APP_INSTALLER_X64 }}
            ${{ env.WINDOWS_APP_INSTALLER_X64 }}.sha256sum
            ${{ env.WINDOWS_APP_INSTALLER_ARM64 }}
            ${{ env.WINDOWS_APP_INSTALLER_ARM64 }}.sha256sum

