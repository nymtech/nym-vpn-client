name: ci-nym-vpn-core-windows

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "nym-vpn-core/crates/**"
      - "nym-vpn-core/Cargo.toml"
      - "nym-vpn-core/Cargo.lock"
      - "nym-vpn-windows/**"
      - ".github/workflows/ci-nym-vpn-core-windows.yml"
  workflow_dispatch:

env:
  CI_TESTING: true
  CARGO_TERM_COLOR: always
  AGENT_ISSELFHOSTED: 1 # https://github.com/actions/setup-go/issues/432
  RUSTC_WRAPPER: sccache
  SCCACHE_REDIS_ENDPOINT: ${{ secrets.SCCACHE_REDIS_OUTSIDE_CLUSTER_ENDPOINT }}
  SCCACHE_REDIS_PASSWORD: ${{ secrets.SCCACHE_REDIS_PASSWORD }}
  SCCACHE_REDIS_EXPIRATION: 86400
  WINFW_PATH: build/winfw/x64-Debug
  STDRIVER_PATH: build/st-driver/x64-Debug

jobs:
  build-wireguard-go-windows:
    uses: ./.github/workflows/build-wireguard-go-windows.yml

  build-winfw-windows:
    uses: ./.github/workflows/build-winfw-windows.yml

  build-st-driver-windows:
    uses: ./.github/workflows/build-st-driver-windows.yml

  build:
    runs-on: custom-windows-11
    needs:
      [build-wireguard-go-windows, build-winfw-windows, build-st-driver-windows]
    steps:
      - name: "Cleanup working directory"
        shell: bash
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./

      - name: Support longpaths on windows
        run: git config --system core.longpaths true

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: i686-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "21.12" # 3.21.12: the version on ubuntu 24.04. Don't change this!
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GNU make
        run: |
          winget list GnuWin32.Make || winget install --disable-interactivity --accept-source-agreements --id GnuWin32.Make
          echo "${env:ProgramFiles(x86)}\GnuWin32\bin" | Out-File -FilePath "$env:GITHUB_PATH" -Append

      - name: Install cargo-get
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Download wireguard-go-windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: wireguard-go_x86_64-pc-windows-msvc
          path: build/lib

      - name: Download winfw artifacts
        uses: actions/download-artifact@v8
        with:
          name: winfw_x64
          path: ${{ env.WINFW_PATH }}

      - name: Download st-driver artifacts
        uses: actions/download-artifact@v8
        with:
          name: st-driver
          path: ${{ env.STDRIVER_PATH }}

      - name: rustfmt check
        working-directory: nym-vpn-core
        run: |
          cargo fmt --check --all

      - name: Clippy
        working-directory: nym-vpn-core
        run: |
          cargo clippy --workspace --locked -- -Dwarnings

      - name: Build
        working-directory: nym-vpn-core
        run: |
          cargo build --verbose --workspace --locked

      - name: Run tests
        working-directory: nym-vpn-core
        run: |
          cargo test --verbose --workspace --locked
