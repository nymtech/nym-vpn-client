name: publish-nym-vpn-android

on:
  workflow_call:
    inputs:
      track:
        type: string
        default: "none"
      publish-bundle:
        type: boolean
        default: false
        description: "Publish the app bundle"
      publish-metadata:
        description: "Publish app metadata"
        type: boolean
        default: true
    secrets:
      ANDROID_SERVICE_ACCOUNT_JSON:
        required: true
      ANDROID_SIGNING_KEY_ALIAS:
        required: true
      ANDROID_SIGNING_KEY_PASSWORD:
        required: true
      ANDROID_SIGNING_STORE_PASSWORD:
        required: true

env:
  UPLOAD_DIR_ANDROID: android_artifacts_play
  RELEASE_NOTES: ""

jobs:
  publish-play:
    runs-on: arc-linux-latest
    timeout-minutes: 30
    env:
      RUBYOPT: "-rresolv-replace"
      BUNDLE_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v7

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Create service_account.json
        id: createServiceAccount
        working-directory: nym-vpn-android
        run: echo '${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Install fastlane
        working-directory: nym-vpn-android
        run: bundle install

      - name: Set locale (for Fastlane)
        run: |
          echo "LC_ALL=en_US.UTF-8" >> $GITHUB_ENV
          echo "LANG=en_US.UTF-8" >> $GITHUB_ENV

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.UPLOAD_DIR_ANDROID }}
          path: dist

      - name: Find artifact file
        id: find_artifact
        run: |
          ARTIFACT_FILE=$(find "${{ github.workspace }}/dist/" -name '*.aab' -type f | head -1)
          if [ -z "$ARTIFACT_FILE" ]; then
            echo "::error:: Failed to locate aab artifact"
            exit 1
          fi
          echo "artifact_file=$ARTIFACT_FILE" >> $GITHUB_OUTPUT
          echo "::notice:: Found artifact for upload: $ARTIFACT_FILE"

      - name: Distribute app to fastlane track ${{ inputs.track }} 🚀
        env:
          FASTLANE_OPT_OUT_USAGE: YES
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ARTIFACT_FILE: ${{ steps.find_artifact.outputs.artifact_file }}
          TRACK: ${{ inputs.track }}
          SKIP_UPLOAD_BUNDLE: ${{ !inputs.publish-bundle }}
          SKIP_UPLOAD_METADATA: ${{ !inputs.publish-metadata }}
        run: |
          echo "🚀 Uploading to Google Play Store... (track=$TRACK, skip_bundle=$SKIP_UPLOAD_BUNDLE, skip_metadata=$SKIP_UPLOAD_METADATA)"

          bundle exec fastlane supply --aab "$ARTIFACT_FILE" \
            --track "$TRACK" \
            --skip-upload-aab $SKIP_UPLOAD_BUNDLE \
            --skip-upload-metadata $SKIP_UPLOAD_METADATA
