name: publish-nym-vpn-android

on:
  workflow_dispatch:
    inputs:
      track:
        type: choice
        description: "Google play release track"
        options:
          - none
          - internal
          - alpha
          - beta
          - production
        default: alpha
        required: true
      publish-bundle:
        type: boolean
        default: false
        description: Skip app bundle
      publish-metadata:
        type: boolean
        default: true
        description: Skip app metadata
      tag_name:
        description: "Tag name for release"
        required: false
        default: nym-vpn-android-nightly
      release_type:
        type: choice
        description: "GitHub release type"
        options:
          - none
          - prerelease
          - nightly
          - release
        default: release
        required: true

  workflow_call:
    inputs:
      version_tag:
        description: "Unified release tag (empty = legacy; nym-vpn-nightly = mutable; nym-vpn-v* = immutable ship). Play push gated by 'track'."
        type: string
        default: ""
      fdroid:
        description: "Dispatch the F-Droid repo (ship only)"
        type: boolean
        default: false
      track:
        type: string
        default: "none"
      release_type:
        type: string
        default: "release"
      version:
        description: "Orchestrated app version to embed (empty = use Constants.kt as before)"
        type: string
        default: ""
      publish-metadata:
        description: "Skip app metadata"
        type: boolean
        default: true

env:
  UPLOAD_DIR_ANDROID: android_artifacts
  RELEASE_NOTES: ""

jobs:
  build-nym-vpn-android-apk:
    if: ${{ inputs.release_type != 'none' }}
    uses: ./.github/workflows/build-nym-vpn-android.yml
    secrets: inherit
    with:
      build_type: ${{ inputs.release_type == '' && 'nightly' || inputs.release_type }}
      build_format: apk
      build_flavor: fdroid
      version: ${{ inputs.version }}
      version_tag: ${{ inputs.version_tag }}

  build-nym-vpn-android-aab:
    if: ${{ inputs.release_type != 'none' }}
    uses: ./.github/workflows/build-nym-vpn-android.yml
    secrets: inherit
    with:
      build_type: ${{ inputs.release_type == '' && 'nightly' || inputs.release_type }}
      build_format: aab
      build_flavor: play
      version: ${{ inputs.version }}
      version_tag: ${{ inputs.version_tag }}

  publish-play:
    needs: [build-nym-vpn-android-aab]
    if: ${{ always() && inputs.track != 'none' && inputs.track != '' && (needs.build-nym-vpn-android-aab.result == 'success' || needs.build-nym-vpn-android-aab.result == 'skipped') }}
    runs-on: arc-linux-latest
    defaults:
      run:
        working-directory: nym-vpn-android
    env:
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SENTRY_DSN: ${{ secrets.ANDROID_SENTRY_DSN }}
      KEY_STORE_FILE: "android_keystore.jks"
      KEY_STORE_LOCATION: ${{ github.workspace }}/nym-vpn-android/app/keystore/
      RUBYOPT: "-rresolv-replace"
      BUNDLE_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v7

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev libmnl-dev libnftnl-dev protobuf-compiler git curl gcc g++ make unzip rsync

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Set env
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK_TOOLCHAIN_DIR=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-ndk

      - name: Install cargo-license
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-license

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: ${{ env.KEY_STORE_FILE }}
          fileDir: ${{ env.KEY_STORE_LOCATION }}
          encodedString: ${{ secrets.ANDROID_KEYSTORE }}

      - name: Create keystore path env var
        run: |
          store_path=${{ env.KEY_STORE_LOCATION }}${{ env.KEY_STORE_FILE }}
          echo "KEY_STORE_PATH=$store_path" >> $GITHUB_ENV

      - name: Create service_account.json
        id: createServiceAccount
        run: echo '${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Get version code
        uses: ./.github/workflows/android/get-version-code

      - name: Distribute app to fastlane track 🚀
        working-directory: ${{ github.workspace }}
        run: |
          bundle install
          bundle exec fastlane ${{ inputs.track }} skip_bundle:${{ github.event.inputs.publish-bundle == 'true' }} skip_metadata:${{ inputs.publish-metadata }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
