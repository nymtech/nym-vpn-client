name: build-nym-vpnc-macos

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release to GitHub"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *"

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: nym-vpnc
  PKG_IDENTIFIER: net.nymtech.vpnc
  PKG_INSTALL_LOCATION: /usr/local/bin
  S3_ENDPOINT: https://s3.nymte.ch # API endpoint for uploads
  S3_BUCKET: builds

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vpnc:
    if: github.actor != 'dependabot[bot]'
    runs-on: custom-macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=20G" >> "$GITHUB_ENV"

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-edit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-edit

      - name: Install cargo-get
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Install toml-cli
        uses: baptiste0928/cargo-install@v3
        with:
          crate: toml-cli

      - name: Set version for nightly builds
        shell: bash
        working-directory: nym-vpn-core
        if: ${{ github.ref_name == 'develop' }}
        run: |
          if [ ${{ github.event_name }} = 'schedule' ]; then
            TAG="nightly"
          else
            TAG="dev"
          fi
          VERSION=$(cargo-get workspace.package.version --major --minor --patch --delimiter='.')
          NEW_VERSION="${VERSION}-${TAG}.$(date -u +%Y%m%d%H%M)"
          echo "::notice:: Update version for nightly build: ${NEW_VERSION}"
          toml set Cargo.toml workspace.package.version "$NEW_VERSION" > Cargo-patched.toml
          mv Cargo-patched.toml Cargo.toml
          cargo fetch

      - name: Get workspace version
        id: workspace-version
        uses: nicolaiunrein/cargo-get@master
        with:
          subcommand: workspace.package.version --entry nym-vpn-core

      - name: Add Homebrew to PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Ensure codemagic-cli-tools uses compatible Python
        run: |
          set -euo pipefail
          if ! keychain --version >/dev/null 2>&1; then
            # The runner's system /usr/lib/libexpat.1.dylib is missing
            # _XML_SetAllocTrackerActivationThreshold. Every Homebrew Python
            # version (3.12 and 3.14) links pyexpat.so against the system
            # libexpat, so ALL versions fail — switching Python doesn't help.
            # Fix: remap each Homebrew Python's pyexpat.so to use Homebrew's
            # own expat formula (which ships the required symbol), then
            # ad-hoc re-sign the patched .so so macOS will load it.
            brew install expat
            HOMEBREW_EXPAT="$(brew --prefix expat)/lib/libexpat.1.dylib"
            while IFS= read -r -d '' so; do
              install_name_tool -change /usr/lib/libexpat.1.dylib \
                "$HOMEBREW_EXPAT" "$so" \
                && codesign -f -s - "$so" || true
            done < <(find /opt/homebrew/Cellar/python@* \
              -name 'pyexpat*.so' -not -type l -print0 2>/dev/null)
            keychain --version
          fi

      - name: Build nym-vpnc (aarch64)
        working-directory: nym-vpn-core
        run: |
          cargo build -p nym-vpnc --release --target aarch64-apple-darwin

      - name: Build nym-vpnc (x86_64)
        working-directory: nym-vpn-core
        run: |
          cargo build -p nym-vpnc --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          set -euo pipefail

          AARCH64_BIN="nym-vpn-core/target/aarch64-apple-darwin/release/nym-vpnc"
          X86_64_BIN="nym-vpn-core/target/x86_64-apple-darwin/release/nym-vpnc"
          UNIVERSAL_BIN="nym-vpn-core/target/release/nym-vpnc"

          mkdir -p "$(dirname "$UNIVERSAL_BIN")"
          lipo -create "$AARCH64_BIN" "$X86_64_BIN" -output "$UNIVERSAL_BIN"

          echo "Universal binary:"
          file "$UNIVERSAL_BIN"
          lipo -info "$UNIVERSAL_BIN"

      - name: Prepare Keychain and import certificates
        id: setup-keychain
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT }}
          DEVELOPER_ID_CERT_PASS: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASS }}
          DEVELOPER_ID_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERT }}
          DEVELOPER_ID_INSTALLER_CERT_PASS: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERT_PASS }}
        run: |
          set -euo pipefail

          KEYCHAIN_PASSPHRASE=$(echo $(date +%s%N) | sha256sum | head -c 10)
          KEYCHAIN_NAME="$(date +%d-%m-%y)_$(echo $(date +%s%N) | sha256sum | head -c 10).keychain-db"
          KEYCHAIN_PATH="$HOME/Library/codemagic-cli-tools/keychains/$KEYCHAIN_NAME"

          echo "Initializing Codemagic keychain..."
          keychain initialize --path "$KEYCHAIN_PATH" --password "$KEYCHAIN_PASSPHRASE"

          echo "Importing Developer ID Application certificate..."
          echo "$DEVELOPER_ID_CERT_BASE64" | base64 --decode > developer_id.p12
          keychain add-certificates \
            --certificate developer_id.p12 \
            --certificate-password "$DEVELOPER_ID_CERT_PASS" \
            --allow-app codesign \
            --allow-app productsign

          echo "Importing Developer ID Installer certificate..."
          echo "$DEVELOPER_ID_INSTALLER_CERT_BASE64" | base64 --decode > developer_id_installer.p12
          keychain add-certificates \
            --certificate developer_id_installer.p12 \
            --certificate-password "$DEVELOPER_ID_INSTALLER_CERT_PASS" \
            --allow-app codesign \
            --allow-app productsign

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSPHRASE" "$KEYCHAIN_PATH"

          rm -f developer_id.p12 developer_id_installer.p12
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Codesign binary
        env:
          APP_SIGNING_IDENTITY: "Developer ID Application: Nym Technologies SA (${{ secrets.APPLE_TEAM_ID }})"
        run: |
          set -euo pipefail

          BINARY="nym-vpn-core/target/release/nym-vpnc"

          echo "Codesigning $BINARY..."
          codesign --sign "$APP_SIGNING_IDENTITY" \
            --timestamp \
            --options runtime \
            --force \
            "$BINARY"

          echo "Verifying codesign..."
          codesign --verify --verbose "$BINARY"

      - name: Resolve version
        id: resolve-version
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.workspace_version }}"
          if [[ -z "$VERSION" ]]; then
            VERSION="${{ steps.workspace-version.outputs.metadata }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Create PKG
        id: make-pkg
        env:
          INSTALLER_SIGNING_IDENTITY: "Developer ID Installer: Nym Technologies SA (${{ secrets.APPLE_TEAM_ID }})"
        run: |
          set -euo pipefail
          which xmlstarlet || brew install xmlstarlet

          VERSION="${{ steps.resolve-version.outputs.version }}"
          BINARY="nym-vpn-core/target/release/nym-vpnc"
          STAGING_DIR="$PWD/build/pkg"
          STAGING_BIN_DIR="$STAGING_DIR/payload"
          NESTED_PKG="$STAGING_DIR/${PKG_IDENTIFIER}.pkg"
          DIST_XML="$STAGING_DIR/Distribution"
          UNSIGNED_PKG="$STAGING_DIR/nym-vpnc-${VERSION}-unsigned.pkg"
          PKG_PATH="$STAGING_DIR/nym-vpnc-${VERSION}.pkg"
          KEYCHAIN_PATH="${{ steps.setup-keychain.outputs.keychain_path }}"

          rm -rf "$STAGING_DIR" || true
          mkdir -p "$STAGING_BIN_DIR"

          # Copy binary into payload
          cp "$BINARY" "$STAGING_BIN_DIR/nym-vpnc"

          # Build the component package
          pkgbuild \
            --root "$STAGING_BIN_DIR" \
            --identifier "$PKG_IDENTIFIER" \
            --version "$VERSION" \
            --install-location "$PKG_INSTALL_LOCATION" \
            --min-os-version 14.0 \
            --compression latest \
            "$NESTED_PKG"

          # Synthesize Distribution XML from the component package
          productbuild --synthesize --package "$NESTED_PKG" "$DIST_XML"

          # Restrict installation to system volume only
          xmlstarlet edit --inplace \
            --subnode '//installer-gui-script' --type elem -n 'domains' \
            --append '//installer-gui-script/domains' --type attr -n 'enable_anywhere' --value 'false' \
            --append '//installer-gui-script/domains' --type attr -n 'enable_currentUserHome' --value 'false' \
            --append '//installer-gui-script/domains' --type attr -n 'enable_localSystem' --value 'true' \
            "$DIST_XML"

          # Add title
          xmlstarlet edit --inplace \
            --subnode '//installer-gui-script' \
            --type elem --name "title" --value "nym-vpnc" \
            "$DIST_XML"

          echo "Distribution XML:"
          cat "$DIST_XML"

          # Build the distribution package (unsigned)
          productbuild --distribution "$DIST_XML" --package-path "$STAGING_DIR" "$UNSIGNED_PKG"
          echo "Unsigned PKG: $UNSIGNED_PKG"

          # Sign the package
          productsign --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$INSTALLER_SIGNING_IDENTITY" \
            "$UNSIGNED_PKG" "$PKG_PATH"

          echo "Signed PKG: $PKG_PATH"
          echo "pkg_path=$PKG_PATH" >> "$GITHUB_OUTPUT"

      - name: Write App Store Connect API key
        id: asc-key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY }}.p8"
          echo "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Notarize PKG
        id: notarize-pkg
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_PATH: ${{ steps.asc-key.outputs.key_path }}
        run: |
          set -euxo pipefail
          which jq || brew install jq

          PKG="${{ steps.make-pkg.outputs.pkg_path }}"
          OUT_JSON="$PWD/build/pkg/notarytool-log.json"

          echo "Submitting $PKG for notarization..."
          xcrun notarytool submit "$PKG" \
            --key "$ASC_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait \
            --output-format json | tee "$OUT_JSON"

          STATUS=$(jq -r .status "$OUT_JSON")
          REQUEST_ID=$(jq -r .id "$OUT_JSON")

          if [[ "$STATUS" != "Accepted" ]]; then
            echo "Notarization failed ($STATUS)"
            LOG_PATH="$PWD/build/pkg/notarytool-log-detailed.json"
            xcrun notarytool log "$REQUEST_ID" \
              --key "$ASC_KEY_PATH" \
              --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID" \
              --output-format json | tee "$LOG_PATH"
            exit 1
          fi

          echo "Notarization accepted. Stapling..."
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"

          echo "pkg_path=$PKG" >> "$GITHUB_OUTPUT"

      - name: Generate artifact name
        run: |
          TIMESTAMP=$(date +"%Y%m%d-%H%M")
          SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "ARTIFACT_NAME=vpnc-macOS-${TIMESTAMP}-${SAFE_BRANCH}" >> "$GITHUB_ENV"

      - name: Rename PKG for upload
        working-directory: build/pkg
        run: |
          set -euo pipefail
          ORIGINAL_PKG=$(basename "${{ steps.notarize-pkg.outputs.pkg_path }}")
          NEW_NAME="${ARTIFACT_NAME}-${ORIGINAL_PKG}"

          echo "Renaming: $ORIGINAL_PKG -> $NEW_NAME"
          mv "$ORIGINAL_PKG" "$NEW_NAME"

          RELATIVE_PATH="build/pkg/$NEW_NAME"
          echo "renamed_pkg_relative_path=$RELATIVE_PATH" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.renamed_pkg_relative_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish PKG to S3
        uses: ./.github/actions/push-to-s3
        with:
          source_path: ${{ env.renamed_pkg_relative_path }}
          destination: nym-vpn-client/macOS/vpnc/
          endpoint: ${{ env.S3_ENDPOINT }}
          bucket: ${{ env.S3_BUCKET }}
          aws_access_key_id: ${{ secrets.GARAGE_AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.GARAGE_AWS_SECRET_ACCESS_KEY }}

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nym-vpnc-macOS-v${{ steps.resolve-version.outputs.version }}
          name: "nym-vpnc macOS v${{ steps.resolve-version.outputs.version }}"
          prerelease: false
          draft: false
          files: ${{ env.renamed_pkg_relative_path }}
          body: |
            macOS build of nym-vpnc.
            - Version: ${{ steps.resolve-version.outputs.version }}
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Built at: ${{ github.run_started_at }}

      - name: Publish GitHub Pre-release
        if: ${{ (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.release != true) }}
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: vpnc-macos-nightly
          name: "nym-vpnc macOS nightly"
          prerelease: true
          draft: false
          files: ${{ env.renamed_pkg_relative_path }}
          body: |
            macOS build of nym-vpnc.
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Built at: ${{ github.run_started_at }}

      - name: Cleanup Keychain and keys
        if: always()
        run: |
          set -euo pipefail
          echo "Cleaning up Codemagic keychain..."
          keychain delete
          echo "Removing ASC API key..."
          rm -rf "$HOME/private_keys"
