name: nightly-release

on:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish nightly release
        uses: ./.github/workflows/release-all-platforms.yml
        with:
          release: true
          release_channel: nightly
          android: true
          frdoid: true
          linux: true
          windows: true
          ios: true
          macos: true
          publish-metadata: false
