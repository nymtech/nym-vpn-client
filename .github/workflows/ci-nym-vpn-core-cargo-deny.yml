name: ci-nym-vpn-core-cargo-deny
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "nym-vpn-core/**/Cargo.lock"
      - "nym-vpn-core/**/Cargo.toml"
      - "nym-vpn-core/deny.toml"
      - ".github/workflows/ci-nym-vpn-core-cargo-deny.yml"
  workflow_dispatch:
jobs:
  cargo-deny:
    runs-on: arc-linux-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-deny
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-deny

      - name: Run cargo-deny
        run: cargo deny --manifest-path ./nym-vpn-core/Cargo.toml --locked --all-features check licenses bans sources
