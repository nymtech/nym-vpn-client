name: ci-maestro-ios

on:
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci-maestro-ios.yml'
      - 'nym-vpn-apple/**'
      - 'nym-vpn-core/**'
      - 'wireguard/**'
  workflow_dispatch:

jobs:
  maestro-ui-tests:
    if: github.actor != 'dependabot[bot]'
    # Self-hosted Apple Silicon: the mock app links NymVPNLib (the Rust FFI core),
    # which must be built for the simulator (aarch64-apple-ios-sim) before Xcode
    # can compile the NymVPN-Mock scheme. Mirrors build-nym-vpn-apple.yml.
    runs-on: AppleSilicon
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load .env versions
        uses: xom9ikk/dotenv@v2.4.0

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          # ios = device slice, ios-sim = simulator slice (needed to run the mock
          # app on the iPhone 16 simulator that Maestro drives).
          targets: aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-darwin

      - name: Install cargo-swift
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-swift
          version: ${{ env.CARGO_SWIFT_VERSION }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          # No module caching. $HOME persists on this self-hosted runner, so
          # ~/go/pkg/mod survives between jobs and the actions cache restores a
          # copy of something that was never lost - 210 MB and ~30s per run. It
          # also unpacks over files Go marks read-only (0444), producing hundreds
          # of "Can't unlink already-existing object: Permission denied" lines.
          cache: false

      # Build the iOS Rust core (libwg + NymVPNLibUniffi.xcframework) and stage it
      # where the Xcode packages expect it. Debug build (RELEASE=false) — no code
      # signing required.
      #
      # RUST_TRIPLET overrides iOS.mk's aarch64-apple-ios default so the
      # xcframework carries the simulator slice instead of the device one. Maestro
      # drives the iPhone 16 simulator, so that is the only slice needed here, and
      # cargo-swift accepts --target once. build-wireguard-go.sh --ios already
      # produces libwg.a for every iOS slice, so the libwg prerequisite resolves.
      - name: Build NymVPNLib (iOS core)
        working-directory: nym-vpn-core
        run: make -f iOS.mk RELEASE=false RUST_TRIPLET=aarch64-apple-ios-sim

      - name: Stage NymVPNLib into the apple project
        run: |
          set -euo pipefail
          LIB_SRC="nym-vpn-core/crates/nym-vpn-lib-uniffi/NymVPNLib"
          LIB_DEST="nym-vpn-apple/NymVPNLib"
          rm -rf "$LIB_DEST"
          cp -R "$LIB_SRC" "$LIB_DEST"
          echo "Staged NymVPNLib -> $LIB_DEST"
          # Flatten xcframework headers for Xcode 26+ explicit module builds
          # (matches scripts/BuildCore.sh). No-op on older Xcode.
          XCODE_VER="$(xcodebuild -version | head -1 | awk '{print $2}')"
          if [[ "$(printf '%s\n' "26.4" "$XCODE_VER" | sort -V | head -1)" == "26.4" ]]; then
            for HEADERS_DIR in "$LIB_DEST"/NymVPNLibUniffi.xcframework/*/Headers; do
              for SUBDIR in "$HEADERS_DIR"/*/; do
                [[ -d "$SUBDIR" ]] || continue
                cp -n "$SUBDIR"* "$HEADERS_DIR/" 2>/dev/null || true
              done
            done
            echo "Flattened NymVPNLib xcframework headers (Xcode $XCODE_VER)"
          fi

      # NymVPNRpc is gitignored and generated. On macOS it is built from the
      # nym-vpn-rpc-uniffi crate, but iOS never uses it - the workspace only
      # needs the package to exist so the package graph resolves. Without this
      # the build fails at Resolve Package Graph with "the package at
      # .../NymVPNRpc cannot be accessed". Mirrors ci-nym-vpn-app-ios.yml.
      - name: Add stubs for unused packages
        working-directory: nym-vpn-apple
        run: |
          echo "📦 Adding stubs for unused packages..."
          rm -rf NymVPNRpc || true
          mkdir NymVPNRpc || true
          cd NymVPNRpc
          swift package init --type library --name NymVPNRpc --disable-xctest --disable-swift-testing
          echo "✅ Stubs added successfully."

      # Runs before the build so the build destination and the device the app is
      # installed on are guaranteed to be the same one.
      #
      # The device used to be hardcoded to "iPhone 16", which no longer exists on
      # the runner - it offers iPhone 16e, 17, 17 Pro, 17 Pro Max, 17e and Air.
      # Any fixed name is fragile here: the AppleSilicon label covers more than
      # one machine and Xcode drops old simulators as it updates. So pick
      # whatever iPhone is actually available, newest runtime first. Set
      # SIMULATOR_NAME to pin an exact device if a flow ever needs one.
      #
      # The old substring test also matched "iPhone 16e", so the boot step could
      # pick a device the build step had already rejected.
      - name: Select and boot iOS simulator
        env:
          SIMULATOR_NAME: ""
        run: |
          set -euo pipefail
          SELECTED=$(xcrun simctl list devices available -j | python3 -c "
          import json, os, re, sys

          data = json.load(sys.stdin)
          want = os.environ.get('SIMULATOR_NAME', '').strip()

          candidates = []
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              match = re.search(r'iOS-(\d+)-(\d+)', runtime)
              version = (int(match.group(1)), int(match.group(2))) if match else (0, 0)
              for device in devices:
                  if not device.get('isAvailable'):
                      continue
                  if not device['name'].startswith('iPhone'):
                      continue
                  if want and device['name'] != want:
                      continue
                  candidates.append((version, device['name'], device['udid']))

          if not candidates:
              sys.stderr.write('No available iPhone simulator found.\n')
              sys.exit(1)

          # Newest runtime first, then by name, so the choice is deterministic.
          candidates.sort(reverse=True)
          version, name, udid = candidates[0]
          print('%s\t%s\t%d.%d' % (udid, name, version[0], version[1]))
          ")
          DEVICE_ID=$(printf '%s' "$SELECTED" | cut -f1)
          DEVICE_NAME=$(printf '%s' "$SELECTED" | cut -f2)
          DEVICE_OS=$(printf '%s' "$SELECTED" | cut -f3)
          echo "Selected $DEVICE_NAME (iOS $DEVICE_OS) - $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV

      - name: Build mock app for simulator
        working-directory: nym-vpn-apple
        run: |
          set -euo pipefail
          # No `|| true` here. It used to swallow the exit code, so a failed
          # build let the job continue and surface two steps later as an
          # unreadable CoreSimulator abort from `simctl install` with an empty
          # path. A broken build must fail in the step that ran it.
          #
          # Destination is the exact device booted above, addressed by id, so the
          # build target and the install target cannot drift apart.
          build_mock_app() {
            xcodebuild build-for-testing \
              -workspace NymVPN.xcworkspace \
              -scheme NymVPN-Mock \
              -destination "id=$DEVICE_ID" \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS='MOCK_MODE'
          }
          # xcpretty only prettifies; never let its absence decide the outcome.
          if command -v xcpretty >/dev/null 2>&1; then
            build_mock_app | xcpretty
          else
            build_mock_app
          fi

      # The Maestro CLI runs on the JVM. The self-hosted Apple Silicon runners
      # have no system Java, so install it per-job rather than relying on the
      # host - the AppleSilicon label covers more than one machine and their
      # ambient tooling differs. Same JDK as ci-maestro-android.yml.
      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # Installs into RUNNER_TEMP, not $HOME. ci-maestro-android.yml unpacks to
      # $HOME/.maestro, which is safe on ubuntu-latest because each job gets a
      # fresh home - but this runner is self-hosted and $HOME persists, so the
      # move failed with "Directory not empty" against the previous run's
      # install. RUNNER_TEMP is emptied per job, which also keeps concurrent
      # jobs on this shared Mac from fighting over one install directory.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.2.0"
        run: |
          set -euo pipefail
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          curl -fsSL -o checksums_sha256.txt "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/checksums_sha256.txt"
          shasum -a 256 --check --ignore-missing checksums_sha256.txt
          rm -rf maestro "$RUNNER_TEMP/maestro"
          unzip -q maestro.zip
          mv maestro "$RUNNER_TEMP/maestro"
          rm -f maestro.zip checksums_sha256.txt
          echo "$RUNNER_TEMP/maestro/bin" >> $GITHUB_PATH
          # Fail here rather than in a later step if the CLI cannot start.
          "$RUNNER_TEMP/maestro/bin/maestro" --version

      - name: Log tool versions
        run: |
          echo "--- Xcode ---"
          xcodebuild -version
          echo "--- Rust ---"
          rustc --version
          echo "--- Maestro ---"
          maestro --version
          echo "--- Simulator ---"
          xcrun simctl list devices available | head -20

      - name: Install app on simulator
        working-directory: nym-vpn-apple
        run: |
          set -euo pipefail
          APP_PATH=$(find build -name "NymVPN.app" -path "*/Debug-iphonesimulator/*" | head -1)
          # Without this guard an empty APP_PATH reaches simctl as a null URL and
          # aborts with 'Invalid parameter not satisfying: installURL' plus a
          # CoreSimulator stack trace, which says nothing about the real cause.
          if [ -z "$APP_PATH" ]; then
            echo "::error::NymVPN.app not found under nym-vpn-apple/build - the mock app build did not produce it"
            echo "--- .app bundles present ---"
            find build -name "*.app" -maxdepth 8 || echo "(none)"
            exit 1
          fi
          echo "Installing $APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

      - name: Run Maestro UI tests
        working-directory: nym-vpn-apple
        run: |
          maestro test maestro/flows/ \
            --format junit \
            --output maestro-ios-report.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-ios-report
          path: nym-vpn-apple/maestro-ios-report.xml
