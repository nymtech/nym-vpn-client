name: ci-maestro-ios

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main, develop]
    paths:
      - 'nym-vpn-apple/**'
      - 'nym-vpn-core/**'
      - 'wireguard/**'
      - '.github/workflows/ci-maestro-ios.yml'
  workflow_dispatch:

jobs:
  maestro-ui-tests:
    if: github.actor != 'dependabot[bot]'
    # Self-hosted Apple Silicon: the mock app links NymVPNLib (the Rust FFI core),
    # which must be built for the simulator (aarch64-apple-ios-sim) before Xcode
    # can compile the NymVPN-Mock scheme. Mirrors build-nym-vpn-apple.yml.
    runs-on: AppleSilicon
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load .env versions
        uses: xom9ikk/dotenv@v2.4.0

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          # ios = device slice, ios-sim = simulator slice (needed to run the mock
          # app on the iPhone 16 simulator that Maestro drives).
          targets: aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-darwin

      - name: Install cargo-swift
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-swift
          version: ${{ env.CARGO_SWIFT_VERSION }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache-dependency-path: wireguard/libwg/go.sum

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # Build the iOS Rust core (libwg + NymVPNLibUniffi.xcframework with device
      # AND simulator slices) and stage it where the Xcode packages expect it.
      # Debug build (RELEASE=false) — no code signing required.
      - name: Build NymVPNLib (iOS core)
        working-directory: nym-vpn-core
        run: make -f iOS.mk RELEASE=false

      - name: Stage NymVPNLib into the apple project
        run: |
          set -euo pipefail
          LIB_SRC="nym-vpn-core/crates/nym-vpn-lib-uniffi/NymVPNLib"
          LIB_DEST="nym-vpn-apple/NymVPNLib"
          rm -rf "$LIB_DEST"
          cp -R "$LIB_SRC" "$LIB_DEST"
          echo "Staged NymVPNLib -> $LIB_DEST"
          # Flatten xcframework headers for Xcode 26+ explicit module builds
          # (matches scripts/BuildCore.sh). No-op on older Xcode.
          XCODE_VER="$(xcodebuild -version | head -1 | awk '{print $2}')"
          if [[ "$(printf '%s\n' "26.4" "$XCODE_VER" | sort -V | head -1)" == "26.4" ]]; then
            for HEADERS_DIR in "$LIB_DEST"/NymVPNLibUniffi.xcframework/*/Headers; do
              for SUBDIR in "$HEADERS_DIR"/*/; do
                [[ -d "$SUBDIR" ]] || continue
                cp -n "$SUBDIR"* "$HEADERS_DIR/" 2>/dev/null || true
              done
            done
            echo "Flattened NymVPNLib xcframework headers (Xcode $XCODE_VER)"
          fi

      - name: Build mock app for simulator
        working-directory: nym-vpn-apple
        run: |
          xcodebuild build-for-testing \
            -workspace NymVPN.xcworkspace \
            -scheme NymVPN-Mock \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='MOCK_MODE' \
            | xcpretty || true

      - name: Boot iOS simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone 16' in d['name'] and d['isAvailable']:
                          print(d['udid'])
                          sys.exit(0)
          sys.exit(1)
          ")
          xcrun simctl boot "$DEVICE_ID" || true
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV

      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.2.0"
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          curl -fsSL -o checksums_sha256.txt "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/checksums_sha256.txt"
          shasum -a 256 --check --ignore-missing checksums_sha256.txt
          unzip -q maestro.zip
          mv maestro "$HOME/.maestro"
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Log tool versions
        run: |
          echo "--- Xcode ---"
          xcodebuild -version
          echo "--- Rust ---"
          rustc --version
          echo "--- Maestro ---"
          $HOME/.maestro/bin/maestro --version
          echo "--- Simulator ---"
          xcrun simctl list devices available | head -20

      - name: Install app on simulator
        working-directory: nym-vpn-apple
        run: |
          APP_PATH=$(find build -name "NymVPN.app" -path "*/Debug-iphonesimulator/*" | head -1)
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

      - name: Run Maestro UI tests
        working-directory: nym-vpn-apple
        run: |
          maestro test maestro/flows/ \
            --format junit \
            --output maestro-ios-report.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-ios-report
          path: nym-vpn-apple/maestro-ios-report.xml
