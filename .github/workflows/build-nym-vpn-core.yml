name: build-nym-vpn-core
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/build-nym-vpn-core.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Orchestrated app version to embed (empty = self-bump as before)"
        type: string
        default: ""
      linux:
        description: "Linux"
        type: boolean
        default: false
      windows:
        description: "Windows"
        type: boolean
        default: false
      ios:
        description: "iOS"
        type: boolean
        default: false
      macos:
        description: "macOS"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Orchestrated app version to embed (empty = self-bump as before)"
        type: string
        default: ""
      linux:
        description: "Linux"
        type: boolean
        default: false
      windows:
        description: "Windows"
        type: boolean
        default: false
      ios:
        description: "iOS"
        type: boolean
        default: false
      macos:
        description: "macOS"
        type: boolean
        default: false
    secrets:
      VPND_SENTRY_DSN:
        required: true
      SCCACHE_REDIS_ENDPOINT:
        required: true
      SCCACHE_REDIS_OUTSIDE_CLUSTER_ENDPOINT:
        required: true
      SCCACHE_REDIS_PASSWORD:
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Builds both the Linux core binaries and the .deb packages in a single job
  # (the .deb step reuses the release build, so there is no second compile).
  build-nym-vpn-core-linux:
    if: ${{ inputs.linux == true }}
    uses: ./.github/workflows/build-nym-vpn-core-linux.yml
    with:
      version: ${{ inputs.version }}
    secrets:
      inherit: true

  build-nym-vpn-core-macos:
    if: ${{ inputs.macos == true }}
    uses: ./.github/workflows/build-nym-vpn-core-macos.yml
    with:
      version: ${{ inputs.version }}
    secrets:
      inherit: true

  build-nym-vpn-core-ios:
    if: ${{ inputs.ios == true }}
    uses: ./.github/workflows/build-nym-vpn-core-ios.yml
    with:
      version: ${{ inputs.version }}
    secrets:
      inherit: true

  build-nym-vpn-core-windows:
    if: ${{ inputs.windows == true }}
    uses: ./.github/workflows/build-nym-vpn-core-windows.yml
    with:
      cpu_arch: x64
      version: ${{ inputs.version }}
    secrets:
      inherit: true

  build-nym-vpn-core-windows-arm64:
    if: ${{ inputs.windows == true }}
    uses: ./.github/workflows/build-nym-vpn-core-windows.yml
    with:
      cpu_arch: ARM64
      version: ${{ inputs.version }}
    secrets:
      inherit: true
