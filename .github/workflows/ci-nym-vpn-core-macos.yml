name: ci-nym-vpn-core-macos

on:
  pull_request:
    paths:
      - "nym-vpn-core/**"
      - ".github/workflows/ci-nym-vpn-core-macos.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  AGENT_ISSELFHOSTED: 1 # https://github.com/actions/setup-go/issues/432

jobs:
  build-wireguard-go-mac:
    uses: ./.github/workflows/build-wireguard-go-mac.yml

  # check-runner:
  #   runs-on: ubuntu-latest
  #   outputs:
  #     runner: ${{ steps.check.outputs.use-runner }}
  #   steps:
  #     - name: Check runner availability
  #       id: check
  #       uses: jimmygchen/runner-fallback-action@v1
  #       with:
  #         primary-runner: "custom-macos-15"
  #         fallback-runner: "macos-15"
  #         github-token: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: macos-15
    needs: [build-wireguard-go-mac]
    timeout-minutes: 30

    steps:
      # - name: Cleanup working directory
      #   if: fromJson(needs.check-runner.outputs.runner) == 'custom-macos-15'
      #   shell: bash
      #   run: |
      #     ls -la ./
      #     rm -rf ./* || true
      #     rm -rf ./.??* || true
      #     ls -la ./

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ vars.REQUIRED_RUSTC_VERSION }}
          components: rustfmt, clippy

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ vars.REQUIRED_GOLANG_VERSION }}
          cache: false

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "21.12" # 3.21.12: the version on ubuntu 24.04. Don't change this!
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: nym-vpn-core/target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('nym-vpn-core/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-build-

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: wireguard-go_apple_universal
          path: build/lib/universal-apple-darwin

      - name: rustfmt check
        working-directory: nym-vpn-core
        run: |
          cargo fmt --check --all

      - name: Clippy
        working-directory: nym-vpn-core
        run: |
          cargo clippy --workspace --locked -- -Dwarnings

      - name: Build
        working-directory: nym-vpn-core
        run: |
          cargo build --verbose --workspace --locked

      - name: Run tests
        working-directory: nym-vpn-core
        run: |
          cargo test --verbose --workspace --locked
