name: 'Multi Cargo Binstall'
description: 'Installs multiple Rust crates using cargo binstall'
inputs:
  crates:
    description: 'Comma or space-separated list of crates to install (e.g., "cargo-hack, cargo-nextest")'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Allow cargo-binstall installer
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
          Set-ExecutionPolicy Unrestricted -Scope Process; iex (iwr "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.ps1").Content

    - uses: cargo-bins/cargo-binstall@main

    - name: Install crates
      shell: bash
      run: |
        # Replace commas with spaces, reduce multiple spaces, and trim leading/trailing whitespace
        CRATES_LIST=$(echo "${{ inputs.crates }}" | tr ',' ' ' | xargs)

        if [ -z "$CRATES_LIST" ]; then
          echo "No crates provided to install."
          exit 1
        fi

        echo "Installing crates: $CRATES_LIST"

        # --no-confirm skips interactive prompts in CI
        # Passing multiple space-separated crates allows binstall to run them efficiently
        cargo binstall --no-confirm $CRATES_LIST
