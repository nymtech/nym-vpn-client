name: build-nym-vpn-app-linux
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/build-nym-vpn-app-linux.yml"
  workflow_dispatch:
    inputs:
      dev_mode:
        description: "dev build"
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      # set to true when it is a 'dev' build
      dev_mode:
        required: true
        type: boolean
        default: false
      version:
        description: "Orchestrated app version to embed (empty = use src-tauri/Cargo.toml as before)"
        required: false
        type: string
        default: ""
    secrets:
      TAURI_PRIVATE_KEY:
        required: true
      TAURI_KEY_PASSWORD:
        required: true
      DESKTOP_JS_SENTRY_DSN:
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-nym-vpn-app-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "arc-ubuntu-22.04"
            arch: "x86_64"
            deb_arch: "amd64"
            app_image_arch: "amd64"
            bin_arch: "x64"
          - os: "ubuntu-22.04-arm"
            arch: "aarch64"
            deb_arch: "arm64"
            app_image_arch: "aarch64"
            bin_arch: "arm64"
    runs-on: ${{ matrix.os }}
    env:
      UPLOAD_DIR_LINUX: app_artifacts_linux_${{ matrix.arch }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev libmnl-dev libnftnl-dev \
            libwebkit2gtk-4.1-dev build-essential curl wget libxdo-dev libssl-dev jq \
            libgtk-3-dev squashfs-tools libayatana-appindicator3-dev make unzip librsvg2-dev file \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev desktop-file-utils xdg-utils

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Install cargo-license
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-license

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "21.12" # version on ubuntu 24.04
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply orchestrated version (tauri)
        uses: ./.github/actions/apply-version
        with:
          version: ${{ inputs.version }}
          target: tauri

      - name: Apply orchestrated version (core)
        uses: ./.github/actions/apply-version
        with:
          version: ${{ inputs.version }}
          target: core

      - name: Get package version
        id: package-version
        uses: nicolaiunrein/cargo-get@597a0a7ed638a120eadba0bbcc418b54a4ab3672 # master
        with:
          subcommand: package.version --entry nym-vpn-app/src-tauri

      - name: Install JS dependencies
        working-directory: nym-vpn-app
        shell: bash
        run: npm ci

      - name: Generate licenses file (Js)
        working-directory: nym-vpn-app
        shell: bash
        run: |
          rm public/licenses-js.json || true
          npm run gen:licenses:js

      - name: Generate licenses file (Rust)
        working-directory: nym-vpn-app
        shell: bash
        run: |
          rm public/licenses-rust.json || true
          npm run gen:licenses:rust

      - name: Download translations artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: translations
          path: nym-vpn-app/src/i18n

      - name: Build tauri app
        working-directory: nym-vpn-app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APP_SENTRY_DSN: ${{ secrets.DESKTOP_JS_SENTRY_DSN }}
          DEV_MODE: ${{ inputs.dev_mode == true }}
          UPDATER_ENABLED: false
        run: |
          npm run tauri build -- --bundles deb,appimage
          ls -la target/release/ || true
          ls -la target/release/bundle/* || true

      - name: Repack deb package
        id: repack-deb
        env:
          SRC_DEB: nym-vpn-app/src-tauri/target/release/bundle/deb/NymVPN_${{ steps.package-version.outputs.metadata }}_${{ matrix.deb_arch }}.deb
          PKGVER: ${{ steps.package-version.outputs.metadata }}
        run: |
          ./.pkg/repack_deb.sh

      - name: Move things around to prepare for upload
        env:
          SRC_APPIMAGE: nym-vpn-app/src-tauri/target/release/bundle/appimage/NymVPN_${{ steps.package-version.outputs.metadata }}_${{ matrix.app_image_arch }}.AppImage
          DST_APPIMAGE: NymVPN_${{ steps.package-version.outputs.metadata }}_${{ matrix.app_image_arch }}.AppImage
          SRC_DEB: ${{ steps.repack-deb.outputs.package }}
          SRC_BIN: nym-vpn-app/src-tauri/target/release/nym-vpn-app
          DST_BIN: nym-vpn_${{ steps.package-version.outputs.metadata }}_linux_${{ matrix.bin_arch }}
        run: |
          mkdir ${{ env.UPLOAD_DIR_LINUX }}
          echo "Copy AppImage"
          cp -vpr ${{ env.SRC_APPIMAGE }} ${{ env.UPLOAD_DIR_LINUX }}/${{ env.DST_APPIMAGE }}
          echo "Copy debian pkg"
          cp -vpr ${{ env.SRC_DEB }} ${{ env.UPLOAD_DIR_LINUX }}
          echo "Copy plain binary"
          cp -vpr ${{ env.SRC_BIN }} ${{ env.UPLOAD_DIR_LINUX }}/${{ env.DST_BIN }}
          echo "Copy install script"
          cp -vpr .pkg/linux/install ${{ env.UPLOAD_DIR_LINUX }}/install

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.UPLOAD_DIR_LINUX }}
          path: ${{ env.UPLOAD_DIR_LINUX }}
          if-no-files-found: error
          retention-days: 1
