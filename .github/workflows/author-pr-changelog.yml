name: author-pr-changelog

# Draft this PR's changelog entry from its `## Description` (the base), backed by the diff, and post
# it as a committable GitHub *suggestion* on the dev's `- _pending changelog_` stub line (one click
# to apply) — or, if no stub is present, as a single PR comment to paste. CI never commits to the PR
# branch: the entry lands only when a human applies it, which is the proofread gate.
#
# Only runs for a PR carrying a release milestone (the team's reliable release-scope signal). For an
# empty/template description it authors one from the diff internally (to write a good entry) without
# editing the PR body. Everything downstream (add-changelog-release stamp, prepare-release-notes
# assemble) is unchanged — this just proposes the `[Unreleased]` entry instead of a human writing it.
#
# Triggers: opened, edited (only when the *description* changed), milestoned, demilestoned (the PR no
# longer qualifies -> retract the suggestion/comment), ready_for_review. NOT synchronize: code pushes
# don't re-draft. The workflow only ever posts comments/suggestions, so it needs no `contents: write`
# and can never write to a contributor's branch.

on:
  pull_request:
    types: [opened, edited, milestoned, demilestoned, ready_for_review]

permissions:
  contents: read            # checkout only; the workflow never writes to the branch
  pull-requests: write      # post the suggestion / paste comment

concurrency:
  group: author-changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  author:
    # same-repo PRs only; skip the bot's own events; on `edited` only run when the description (body)
    # actually changed, not on title/base/label edits
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.login != 'github-actions[bot]' &&
      (github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: arc-linux-latest
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # Security (B4): run the authoring script from the TRUSTED base ref, never the PR-controlled
      # checkout. The script reads the PR via the `gh` API and the PR-head tree above only as DATA
      # (the release-close gate + the "already applied" check), never executing anything from it — so
      # a malicious PR can't run its own code with ANTHROPIC_API_KEY. There is no write token at all.
      - name: Check out the trusted authoring scripts (base ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _trusted
          sparse-checkout: scripts/release-changelog
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Draft the changelog entry and post it as a suggestion
        # Skip until the authoring scripts exist on the base branch (bootstrap: the PR that first
        # adds them has nothing trusted to run against — they land on develop when it merges).
        if: ${{ hashFiles('_trusted/scripts/release-changelog/author_changelog.py') != '' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}  # only for org-scoped keys
          ANTHROPIC_MODEL: claude-opus-4-8
          GH_TOKEN: ${{ github.token }}
        # ROOT (GITHUB_WORKSPACE) is the PR-head checkout, read as data only; executed code is _trusted/.
        run: python _trusted/scripts/release-changelog/author_changelog.py --suggest
