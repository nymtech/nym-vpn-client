name: build-wireguard-go-windows
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "wireguard/**"
      - ".github/workflows/build-wireguard-go-windows.yml"

env:
  CARGO_TERM_COLOR: always
  AGENT_ISSELFHOSTED: 1 # https://github.com/actions/setup-go/issues/432

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - custom-windows-11

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ vars.REQUIRED_GOLANG_VERSION }}
          cache: false

      - name: Setup msys2
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          update: true
          msystem: MINGW64
          install: mingw-w64-x86_64-clang

      - name: Install GNU make
        run: |
          winget list GnuWin32.Make || winget install --disable-interactivity --accept-source-agreements --id GnuWin32.Make
          echo "${env:ProgramFiles(x86)}\GnuWin32\bin" | Out-File -FilePath "$env:GITHUB_PATH" -Append

      - name: Install cargo-get
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Build wireguard
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        working-directory: nym-vpn-core
        run: make -f Windows.mk libwg CPU_ARCH=AMD64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-go_x86_64-pc-windows-msvc-${{ matrix.runner }}
          path: build/lib/x86_64-pc-windows-msvc
          if-no-files-found: error
          retention-days: 1
