name: ci-nym-vpn-app-ios

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/ci-nym-vpn-app-ios.yml"
      - "nym-vpn-apple/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: custom-macos-15
    steps:
      - name: "Cleanup working directory"
        shell: bash
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./

      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache-dependency-path: wireguard/libwg/go.sum

      - name: Install cargo-swift
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-swift
          version: ${{ env.CARGO_SWIFT_VERSION }}

      - name: Install xcbeautify
        run: |
          brew install xcbeautify

      - name: Enable QA mode
        working-directory: nym-vpn-apple
        run: |
          if /usr/libexec/PlistBuddy -c "Print :IsCiBuild" "NymVPNDaemon/Resources/Info.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :IsCiBuild true" "NymVPNDaemon/Resources/Info.plist"
          else
            /usr/libexec/PlistBuddy -c "Add :IsCiBuild string true" "NymVPNDaemon/Resources/Info.plist"
          fi

          echo "✅ Updated Info.plist contents:"
          /usr/libexec/PlistBuddy -c "Print" "NymVPNDaemon/Resources/Info.plist"

      - name: Add stubs for unused packages
        working-directory: nym-vpn-apple
        run: |
          echo "📦 Adding stubs for unused packages..."
          rm -rf NymVPNRpc || true
          mkdir NymVPNRpc || true
          cd NymVPNRpc
          swift package init --type library --name NymVPNRpc --disable-xctest --disable-swift-testing
          echo "✅ Stubs added successfully."

      - name: Build core
        run: |
          ARCH=$(uname -m)

          case "$ARCH" in
              arm64)
                  RUST_TRIPLET="aarch64-apple-ios-sim"
                  ;;
              x86_64)
                  RUST_TRIPLET="x86_64-apple-ios"
                  ;;
              *)
                  echo "Unsupported architecture: $ARCH"
                  exit 1
                  ;;
          esac

          make -C nym-vpn-core -f iOS.mk swift-package RELEASE="false" RUST_TRIPLET="$RUST_TRIPLET"
          rm -rf "nym-vpn-apple/NymVPNLib"
          mv nym-vpn-core/crates/nym-vpn-lib-uniffi/NymVPNLib nym-vpn-apple/NymVPNLib

      - name: Build iOS (Debug, unsigned)
        working-directory: nym-vpn-apple
        run: |
          set -euo pipefail

          SIM_NAME=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries
            | map(select(.key | contains("iOS")))
            | sort_by(.key)
            | last
            | .value[0].name
          ')

          echo "📱 Picked iOS simulator: $SIM_NAME"

          xcodebuild -workspace "NymVPN.xcworkspace" \
           -scheme "NymVPN" \
           -configuration Debug \
           -destination "platform=iOS Simulator,name=$SIM_NAME" \
           ONLY_ACTIVE_ARCH=YES \
           build 2>&1 | xcbeautify --renderer github-actions
