      #     retention-days: 1

      - name: Upload artifacts (QA / Ship)
        if: ${{ always() && (env.RELEASE_TYPE == 'qa' || env.RELEASE_TYPE == 'ship') }}
        uses: actions/upload-artifact@v4
        with:
          name: apple-${{ env.RELEASE_TYPE }}-${{ github.run_id }}
          path: ${{ steps.notarize-pkg.outputs.pkg_path || steps.make-pkg.outputs.pkg_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup Keychain
        if: always()
        run: |
          set -euo pipefail
          echo "🧹 Cleaning up Codemagic keychain..."
          keychain delete
