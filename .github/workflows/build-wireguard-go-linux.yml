name: build-wireguard-go-linux
on:
  pull_request:
    types: [opened]
    paths:
      - "wireguard/**"
      - ".github/workflows/build-wireguard-go-linux.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_name:
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-22.04

    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Checkout nym-vpn-client
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ vars.REQUIRED_GOLANG_VERSION}}
          cache-dependency-path: wireguard/libwg/go.sum

      - name: Build wireguard
        run: |
          ./wireguard/build-wireguard-go.sh

      - name: Set artifact name
        id: set_artifact_name
        run: |
          if [ -z "${{ inputs.artifact_name }}" ]; then
            echo "artifact_name=wireguard-go_ubuntu-24.04_x86_64" >> $GITHUB_OUTPUT
          else
            echo "artifact_name=${{ inputs.artifact_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set_artifact_name.outputs.artifact_name }}
          path: build/lib/x86_64-unknown-linux-gnu
          if-no-files-found: error
          retention-days: 10
