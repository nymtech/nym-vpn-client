name: build-wireguard-go-linux
on:
  pull_request:
    types: [opened]
    paths:
      - "wireguard/**"
      - ".github/workflows/build-wireguard-go-linux.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_suffix:
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-libwg:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]

    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Checkout nym-vpn-client
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ vars.REQUIRED_GOLANG_VERSION}}
          cache-dependency-path: wireguard/libwg/go.sum

      - name: Build wireguard
        run: ./wireguard/build-wireguard-go.sh

      - name: Set artifact name
        id: set_artifact_name
        run: |
          if [ -z "${{ inputs.artifact_suffix }}" ]; then
            echo "artifact_name=wireguard_go-${{ matrix.os }}" >> $GITHUB_OUTPUT
          else
            echo "artifact_name=wireguard_go_${{ inputs.artifact_suffix }}-${{ matrix.os }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.set_artifact_name.outputs.artifact_name }}
          path: build/lib
          if-no-files-found: error
          retention-days: 10
