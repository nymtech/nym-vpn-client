name: build-nym-vpn-core-macos
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/build-nym-vpn-core-macos.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Orchestrated app version to embed (empty = self-bump as before)"
        type: string
        default: ""
    secrets:
      VPND_SENTRY_DSN:
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wireguard-go-macos:
    uses: ./.github/workflows/build-wireguard-go-mac.yml

  build-nym-vpn-core-macos:
    if: github.actor != 'dependabot[bot]'
    needs: build-wireguard-go-macos
    env:
      UPLOAD_DIR_MACOS: core_artifacts_macos
    runs-on: custom-macos-15
    outputs:
      UPLOAD_DIR_MACOS: ${{ env.UPLOAD_DIR_MACOS }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "21.12" # 3.21.12: the version on ubuntu 24.04. Don't change this!
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-edit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-edit

      - name: Install cargo-get
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Install toml-cli
        uses: baptiste0928/cargo-install@v3
        with:
          crate: toml-cli

      - name: Install cargo-swift
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-swift
          version: ${{ env.CARGO_SWIFT_VERSION }}

      - name: Apply orchestrated version
        uses: ./.github/workflows/platform/apply-version
        with:
          version: ${{ inputs.version }}
          target: core

      - name: Set version for nightly builds
        working-directory: nym-vpn-core
        if: ${{ github.ref_name == 'develop' && inputs.version == '' }}
        run: |
          if [ ${{ github.event_name }} = 'schedule' ]; then
            TAG="nightly"
          else
            TAG="dev"
          fi
          VERSION=$(cargo-get workspace.package.version --major --minor --patch --delimiter='.')
          NEW_VERSION="${VERSION}-${TAG}.$(date -u +%Y%m%d%H%M)"
          echo "::notice:: Update version for nightly build: ${NEW_VERSION}"
          toml set Cargo.toml workspace.package.version "$NEW_VERSION" > Cargo-patched.toml
          mv Cargo-patched.toml Cargo.toml
          cargo fetch

      - name: Download wireguard-go artifacts
        uses: actions/download-artifact@v8
        with:
          name: wireguard-go_apple_universal
          path: build/lib

      - name: Build nym-vpn-core
        env:
          SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}
        run: |
          make -C nym-vpn-core -f macOS.mk nym-setup nym-vpnd nym-socks5-proxy rpc-swift-package \
            RELEASE="true" \
            UPLOAD_DIR_MAC="${{ github.workspace }}/${{ env.UPLOAD_DIR_MACOS }}"

          mv "nym-vpn-core/crates/nym-vpn-rpc-uniffi/NymVPNRpc" "${{ env.UPLOAD_DIR_MACOS }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UPLOAD_DIR_MACOS }}
          path: ${{ env.UPLOAD_DIR_MACOS }}
          if-no-files-found: error
          retention-days: 1
