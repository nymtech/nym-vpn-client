name: bump-core-final-release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch (e.g. release/2026.1-banana)'
        type: string
        required: true
      dry_run:
        description: 'Test run that will only print git diff and all changes being made'
        required: true
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  GIT_USER: NYM CI
  GIT_EMAIL: ci@nymtech.net

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bump-final-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate input
        run: |
          if ! echo "${{ inputs.branch }}" | grep -P '^release/.+$'; then
            echo "::error:: Branch must start with 'release/' (got: ${{ inputs.branch }})"
            exit 1
          fi

      - name: Configure git
        run: |
          git config --global user.name "${{ env.GIT_USER }}"
          git config --global user.email "${{ env.GIT_EMAIL }}"

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install cargo-edit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-edit

      - name: Install cargo-get
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Install toml-cli
        uses: baptiste0928/cargo-install@v3
        with:
          crate: toml-cli

      - name: Compute final version
        id: version
        working-directory: nym-vpn-core
        run: |
          BETA_VERSION=$(cargo get workspace.package.version)
          echo "::notice:: Current version: $BETA_VERSION"

          if ! echo "$BETA_VERSION" | grep -q '\-beta$'; then
            echo "::error:: Version '$BETA_VERSION' does not have a -beta suffix"
            exit 1
          fi

          FINAL_VERSION="${BETA_VERSION%-beta}"
          echo "::notice:: Final version: $FINAL_VERSION"
          echo "final_version=$FINAL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update nym-vpn-core/Cargo.toml
        working-directory: nym-vpn-core
        run: |
          cargo set-version "${{ steps.version.outputs.final_version }}"
          # dry-run will update Cargo.lock with new workspace version, without any other changes
          cargo update --dry-run

      - name: Update nym-vpn-app/src-tauri/Cargo.toml
        working-directory: nym-vpn-app/src-tauri
        run: |
          cargo set-version "${{ steps.version.outputs.final_version }}"
          # dry-run will update Cargo.lock with new package version, without any other changes
          cargo update --dry-run

      - name: Update nym-vpn-app/src-tauri/tauri.conf.json
        working-directory: nym-vpn-app/src-tauri
        run: |
          jq -r '.bundle.linux.deb.depends[] = "nym-vpnd (>= ${{ steps.version.outputs.final_version }})"' tauri.conf.json > new_tauri.conf.json
          npx prettier --config ../prettier.config.js --write new_tauri.conf.json
          mv new_tauri.conf.json tauri.conf.json

      - name: Update nym-vpn-app/vpnd_compat.toml
        working-directory: nym-vpn-app
        run: |
          toml set vpnd_compat.toml version ">=${{ steps.version.outputs.final_version }}" > new_vpnd_compat.toml
          mv new_vpnd_compat.toml vpnd_compat.toml

      - name: Update Linux install script
        working-directory: .pkg/linux
        env:
          APP_TAG: nym-vpn-app-v${{ steps.version.outputs.final_version }}
          CORE_TAG: nym-vpn-core-v${{ steps.version.outputs.final_version }}
        run: |
          ./bump.sh

      - name: Update CHANGELOG.md
        working-directory: nym-vpn-core
        run: |
          TODAY=$(date +%Y-%m-%d)
          sed -i "s/\[${FINAL_VERSION}\] - TBD/[${FINAL_VERSION}] - ${TODAY}/" CHANGELOG.md
          echo "::notice:: Updated CHANGELOG.md date to $TODAY"
        env:
          FINAL_VERSION: ${{ steps.version.outputs.final_version }}

      - name: Create PR to finalize v${{ steps.version.outputs.final_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: 'ci/bump-final-v${{ steps.version.outputs.final_version }}'
        run: |
          git diff
          if [ '${{ inputs.dry_run }}' == 'true' ]; then
            echo "::warning:: Dry run, skipping commit and PR creation"
          else
            git checkout -b "${{ env.BRANCH_NAME }}"
            git commit -a -m "ci: bump release to v${{ steps.version.outputs.final_version }}"
            git push origin "${{ env.BRANCH_NAME }}"
            gh pr create \
                --base "${{ inputs.branch }}" \
                --title 'Bump release to `v${{ steps.version.outputs.final_version }}`' \
                --body 'This PR strips the `-beta` suffix and finalizes `v${{ steps.version.outputs.final_version }}` for release.'
          fi
