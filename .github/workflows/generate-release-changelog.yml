name: generate-release-changelog

# On a release-branch cut (or manual dispatch), author the release changelogs from the
# milestone's merged PRs and open ONE PR against the release branch as the proofread gate:
#   (a) author_changelog.py  — milestone PRs -> component CHANGELOG [Unreleased]
#   (b) author_store.py       — derive app-store copy from those [Unreleased] sections
#       translate.py          — DeepL into every locale, Android auto-fit <= 500
# The PR is labelled needs-proofread and is NEVER auto-merged: the approval IS the gate
# (LLM-authored English + DeepL round-1). Proofread before the beta ships.
#
# Starts dispatch + auto-on-cut. The `create` trigger fires when any branch is made, so the
# job self-filters to release/** below.

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: 'GitHub milestone title (e.g. "v2026.15 - Yari"). Blank = derive from the branch.'
        required: false
      release_branch:
        description: "Release branch to open the PR against. Blank = the current branch."
        required: false
  create:

permissions:
  contents: write
  pull-requests: write

env:
  # Pin a dated Anthropic snapshot here for reproducible CI runs.
  ANTHROPIC_MODEL: claude-opus-4-8

jobs:
  generate:
    # dispatch always; on `create` only for a release/** branch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'create' && github.ref_type == 'branch' &&
       startsWith(github.ref_name, 'release/'))
    runs-on: arc-linux-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.release_branch || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve milestone + base branch
        id: ctx
        env:
          IN_MS: ${{ github.event.inputs.milestone }}
          IN_BRANCH: ${{ github.event.inputs.release_branch }}
        run: |
          set -euo pipefail
          BASE="${IN_BRANCH:-$GITHUB_REF_NAME}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if [ -n "${IN_MS}" ]; then
            MS="${IN_MS}"
          else
            # release/2026.15-yari -> "v2026.15 - Yari" (portable; no GNU-sed dependency)
            MS=$(python3 -c "import sys;t=sys.argv[1][len('release/'):];v,_,n=t.partition('-');print(f'v{v} - {n.title()}')" "$BASE")
          fi
          echo "milestone=$MS" >> "$GITHUB_OUTPUT"
          echo "::notice::milestone=$MS base=$BASE"

      - name: (a) Author component changelogs from milestone PRs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MILESTONE: ${{ steps.ctx.outputs.milestone }}
        run: python scripts/release-changelog/author_changelog.py

      - name: (b) Derive app-store copy from the changelogs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/release-changelog/author_store.py

      - name: Translate + auto-fit the store copy
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
        run: python scripts/release-changelog/translate.py

      - name: Open the proofread PR against the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.ctx.outputs.base }}
          MILESTONE: ${{ steps.ctx.outputs.milestone }}
        run: |
          set -euo pipefail
          HEAD="l10n/release-changelog-${BASE//\//-}"
          git config user.name "nym-bot"
          git config user.email "noreply@nymte.ch"
          git switch -c "$HEAD"
          git add '*/CHANGELOG.md' fastlane/metadata nym-vpn-apple/fastlane/metadata \
                  scripts/release-changelog/out
          if git diff --cached --quiet; then
            echo "::notice::no changelog changes to propose"; exit 0
          fi
          git commit -m "release changelog: ${MILESTONE} (auto-generated, needs proofread)"
          git push -f origin "$HEAD"
          gh pr create --base "$BASE" --head "$HEAD" \
            --title "Release changelog — ${MILESTONE} (needs proofread)" \
            --label "needs-proofread" \
            --body "Auto-generated for \`${BASE}\`: component CHANGELOGs authored from the milestone's merged PRs, app-store copy derived from them (LLM) and translated (DeepL round-1, German informal \`du\`). **Proofread before the beta ships — never auto-merge.** Edit this PR branch directly, then approve + merge. English store source: \`scripts/release-changelog/out/\`." \
            || echo "::notice::PR already exists for $HEAD"
