name: ci-nym-vpn-android

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "nym-vpn-core/crates/**"
      - "nym-vpn-core/Cargo.toml"
      - "nym-vpn-core/Android.mk"
      - "nym-vpn-android/**"
      - ".github/workflows/ci-nym-vpn-android.yml"
      - ".github/workflows/build-nym-vpn-android.yml"
      - ".github/workflows/publish-nym-vpn-android.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: arc-linux-latest
    defaults:
      run:
        working-directory: nym-vpn-android
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            nym-vpn-android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ vars.REQUIRED_NDK_VERSION }}
          add-to-path: false

      - name: Run ktlint
        run: ./gradlew ktlintCheck -Pandroid.ndkDirectory=${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Run detekt
        run: ./gradlew detekt --info -Pandroid.ndkDirectory=${{ steps.setup-ndk.outputs.ndk-path }}

  build-nym-vpn-android:
    uses: ./.github/workflows/build-nym-vpn-android.yml
    with:
      build_type: "debug"
      build_format: "apk"
