name: ci-nym-vpn-android

on:
  pull_request:
    types: [opened]
    paths:
      - "nym-vpn-core/crates/**"
      - "nym-vpn-core/Cargo.toml"
      - "nym-vpn-android/**"
      - ".github/workflows/ci-nym-vpn-android.yml"
      - ".github/workflows/build-nym-vpn-android.yml"
      - ".github/workflows/publish-nym-vpn-android.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: arc-linux-latest
    defaults:
      run:
        working-directory: nym-vpn-android
    steps:
      - name: Skip if dependabot
        if: github.actor == 'dependabot[bot]'
        run: |
          echo "Skipping Android CI for dependabot PR"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            nym-vpn-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run detekt
        run: ./gradlew detekt --info

  build-nym-vpn-android:
    uses: ./.github/workflows/build-nym-vpn-android.yml
    with:
      build_type: "debug"
      build_format: "apk"
