name: ci-nym-vpn-android
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/ci-nym-vpn-android.yml"
      - "nym-vpn-core/crates/**"
      - "nym-vpn-core/Cargo.toml"
      - "nym-vpn-core/Cargo.lock"
      - "nym-vpn-core/Android.mk"
      - "nym-vpn-android/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  AGENT_ISSELFHOSTED: 1 # https://github.com/actions/setup-go/issues/432

jobs:
  check:
    runs-on: arc-linux-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nym-vpn-android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.env
            /nym-vpn-android/

      - name: Dotenv Action
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Run ktlint
        timeout-minutes: 10
        run: ./gradlew ktlintCheck

      - name: Run detekt
        timeout-minutes: 10
        run: ./gradlew detekt --info

  build-nym-vpn-android:
    uses: ./.github/workflows/build-nym-vpn-android.yml
    with:
      build_type: "debug"
      build_format: "apk"
      build_flavor: "fdroid"
    secrets: inherit
