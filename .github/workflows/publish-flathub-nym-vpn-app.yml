# Open a release PR on https://github.com/flathub/net.nymtech.NymVPN
#
# The Flathub manifest pins the Linux release binary, and the metainfo.xml,
# app.desktop and icon.svg at a commit on develop. The `tauri: post release vX` PR (opened by
# tauri-post-release.yml) is what updates the metainfo on develop, so this runs
# on the push that changes it, ie. when that PR is merged.

name: publish-flathub-nym-vpn-app
on:
  push:
    branches: [develop]
    paths: [nym-vpn-app/.pkg/flatpak/net.nymtech.NymVPN.metainfo.xml]
  workflow_dispatch:
    inputs:
      version:
        description: "App version whose post-release PR is already merged, eg. 2026.13.0"
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read

env:
  FLATHUB_REPO: flathub/net.nymtech.NymVPN

jobs:
  flathub-pr:
    runs-on: arc-linux-latest
    steps:
      - name: Resolve version, tag and metainfo commit
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [[ -n "$version" ]]; then
            sha=$(gh pr list --state merged --head "tauri_postrel_${version}" --json mergeCommit --jq '.[0].mergeCommit.oid')
            [[ -n "$sha" ]] || { echo "::error:: no merged post-release PR for ${version}"; exit 1; }
          else
            sha="$PUSH_SHA"
          fi
          meta_url="https://raw.githubusercontent.com/${GH_REPO}/${sha}/nym-vpn-app/.pkg/flatpak/net.nymtech.NymVPN.metainfo.xml"
          curl -fsS --proto '=https' -o metainfo.xml "$meta_url"
          meta_sha=$(sha256sum metainfo.xml | cut -d' ' -f1)
          desktop_url="https://raw.githubusercontent.com/${GH_REPO}/${sha}/nym-vpn-app/.pkg/app.desktop"
          curl -fsS --proto '=https' -o app.desktop "$desktop_url"
          desktop_sha=$(sha256sum app.desktop | cut -d' ' -f1)
          icon_url="https://raw.githubusercontent.com/${GH_REPO}/${sha}/nym-vpn-app/.pkg/icon.svg"
          curl -fsS --proto '=https' -o icon.svg "$icon_url"
          icon_sha=$(sha256sum icon.svg | cut -d' ' -f1)
          if [[ -z "$version" ]]; then
            # update_metainfo.sh inserts the newest release first
            version=$(sed -nE 's/.*<release version="([^"]+)".*/\1/p' metainfo.xml | head -1)
            [[ -n "$version" ]] || { echo "::error:: no release found in metainfo at ${sha}"; exit 1; }
          fi
          [[ "$version" != *-* ]] || { echo "::error:: ${version} is not a release version"; exit 1; }
          tag="nym-vpn-v${version}"
          bin="nym-vpn_${version}_linux_x64"
          bin_sha=$(gh release download "$tag" --pattern checksums.txt -O - | awk -v f="$bin" '$2==f{print $1}')
          [[ -n "$bin_sha" ]] || { echo "::error:: ${bin} missing from ${tag} checksums.txt"; exit 1; }
          {
            echo "version=${version}"
            echo "bin_url=https://github.com/${GH_REPO}/releases/download/${tag}/${bin}"
            echo "bin_sha=${bin_sha}"
            echo "meta_url=${meta_url}"
            echo "meta_sha=${meta_sha}"
            echo "desktop_url=${desktop_url}"
            echo "desktop_sha=${desktop_sha}"
            echo "icon_url=${icon_url}"
            echo "icon_sha=${icon_sha}"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Checkout Flathub repo
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.FLATHUB_REPO }}
          token: ${{ secrets.FLATHUB_PAT_NYMBOT_TOKEN }}
          fetch-depth: 1

      - name: Update manifest
        env:
          BIN_URL: ${{ steps.rel.outputs.bin_url }}
          BIN_SHA: ${{ steps.rel.outputs.bin_sha }}
          META_URL: ${{ steps.rel.outputs.meta_url }}
          META_SHA: ${{ steps.rel.outputs.meta_sha }}
          DESKTOP_URL: ${{ steps.rel.outputs.desktop_url }}
          DESKTOP_SHA: ${{ steps.rel.outputs.desktop_sha }}
          ICON_URL: ${{ steps.rel.outputs.icon_url }}
          ICON_SHA: ${{ steps.rel.outputs.icon_sha }}
        run: |
          set -euo pipefail
          # each pinned source is a `url:` line directly followed by its `sha256:` line
          sed -i -E \
            -e "\|/releases/download/.*_linux_x64\$|{s|url: .*|url: ${BIN_URL}|;n;s|sha256: .*|sha256: ${BIN_SHA}|;}" \
            -e "\|/net\.nymtech\.NymVPN\.metainfo\.xml\$|{s|url: .*|url: ${META_URL}|;n;s|sha256: .*|sha256: ${META_SHA}|;}" \
            -e "\|/\.pkg/app\.desktop\$|{s|url: .*|url: ${DESKTOP_URL}|;n;s|sha256: .*|sha256: ${DESKTOP_SHA}|;}" \
            -e "\|/\.pkg/icon\.svg\$|{s|url: .*|url: ${ICON_URL}|;n;s|sha256: .*|sha256: ${ICON_SHA}|;}" \
            net.nymtech.NymVPN.yml
          grep -q "sha256: ${BIN_SHA}" net.nymtech.NymVPN.yml
          grep -q "sha256: ${META_SHA}" net.nymtech.NymVPN.yml
          grep -q "url: ${DESKTOP_URL}" net.nymtech.NymVPN.yml
          grep -q "url: ${ICON_URL}" net.nymtech.NymVPN.yml
          git diff

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_PAT_NYMBOT_TOKEN }}
          GH_REPO: ${{ env.FLATHUB_REPO }}
          USER: ${{ secrets.FLATHUB_PAT_NYMBOT_USERNAME }}
          GIT_BRANCH: release_${{ steps.rel.outputs.version }}
          TITLE: Release v${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::notice:: manifest already up to date, nothing to do"
            exit 0
          fi
          git config user.name "$USER"
          git config user.email "${USER}@users.noreply.github.com"
          git switch -C "$GIT_BRANCH"
          git commit -am "$TITLE"
          git push --force origin "$GIT_BRANCH"
          if [[ "$(gh pr list --head "$GIT_BRANCH" --json number --jq 'length')" == "0" ]]; then
            gh pr create --title "$TITLE" --body "" --base master --head "$GIT_BRANCH" --reviewer agentpietrucha
          else
            echo "PR already exists for branch ${GIT_BRANCH}, skipping"
          fi
