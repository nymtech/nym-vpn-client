name: auto-assign-reviewer
on:
  pull_request:
    # add needed activity types
    # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#pull_request
    types: [opened, synchronize, reopened, ready_for_review, review_requested]

jobs:
  assign_reviewer:
    runs-on: arc-linux-latest
    # do not run while in draft mode or for dependabot, which assigns via dependabot.yml
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: shufo/auto-assign-reviewer-by-files@0a7fae44d02e841755d0caaac2ef05ad12a3bbc9 # v1.2.1
        with:
          config: ".github/reviewer-by-files.yml"
          token: ${{ secrets.GITHUB_TOKEN }}
