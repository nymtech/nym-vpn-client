name: crowdin-android-download

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Target branch for the translation PR"
        required: true
        default: "develop"
        type: string

jobs:
  crowdin-download:
    runs-on: arc-linux-latest-dind

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: crowdin action
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          config: "crowdin-configs/android.yml"
          command_args: "-l ar -l bn -l de -l es-ES -l fa -l fr -l hi -l pt-BR -l ru -l tr -l uk -l vi -l zh-CN"
          localization_branch_name: "l10n_crowdin_android_${{ inputs.target_branch }}"
          create_pull_request: true
          pull_request_title: "Localization: Update Android Translations (${{ inputs.target_branch }})"
          pull_request_body: "Manual PR to sync translations from Crowdin to the `${{ inputs.target_branch }}` branch. Merge this before cutting a release to ensure F-Droid reproducibility."
          pull_request_base_branch_name: "${{ inputs.target_branch }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
