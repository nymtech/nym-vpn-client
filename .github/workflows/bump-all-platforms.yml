name: bump-all-platforms

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to run against (uses github ref if not set)"
        type: string
        required: false
      version:
        description: "Release version (YYYY.{n} or YYYY.{n}.{p} or YYYY.{n}.{p}-beta.{y}, e.g. 2026.1 or 2026.1.1 or 2026.1.0-beta.1)"
        type: string
        required: true
      update_linux_installer:
        description: "Update linux installer script"
        type: boolean
        required: true
        default: false
      update_changelog:
        description: "Whether to add unreleased section to the changelog"
        type: boolean
        required: true
        default: false
      dry_run:
        description: "Print git diff only, do not commit or open PR"
        type: boolean
        required: true
        default: true
  workflow_call:
    inputs:
      branch:
        description: "Git branch to run against (uses github ref if not set)"
        type: string
        required: false
      version:
        description: "Release version (YYYY.{n} or YYYY.{n}.{p} or YYYY.{n}.{p}-beta.{y}, e.g. 2026.1 or 2026.1.1 or 2026.1.0-beta.1)"
        type: string
        required: true
      update_linux_installer:
        description: "Update linux installer script"
        type: boolean
        required: true
        default: false
      update_changelog:
        description: "Whether to add unreleased section to the changelog"
        type: boolean
        required: true
        default: false
      dry_run:
        description: "Print git diff only, do not commit or open PR"
        type: boolean
        required: true
        default: true

env:
  CARGO_TERM_COLOR: always
  GIT_USER: NYM CI
  GIT_EMAIL: ci@nymtech.net

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  bump-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Configure git
        run: |
          git config --global user.name "${{ env.GIT_USER }}"
          git config --global user.email "${{ env.GIT_EMAIL }}"

      - name: Checkout selected branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch || github.ref }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Ruby + bundler (for fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: nym-vpn-apple

      - name: Install cargo-get
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Install cargo-edit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-edit

      - name: Install toml-cli
        uses: baptiste0928/cargo-install@v3
        with:
          crate: toml-cli

      - name: Validate and normalize version
        id: version
        working-directory: nym-vpn-core
        run: |
          RAW='${{ inputs.version }}'
          if ! echo "$RAW" | grep -Pq '^[0-9]{4}\.[0-9]{1,2}(\.[0-9]{1,2})?(-beta\.[1-9][0-9]?)?$'; then
            echo "::error:: Invalid version format (expected YYYY.{n} or YYYY.{n}.{p} or YYYY.{n}.{p}-beta.{y}, got: $RAW)"
            exit 1
          fi

          SEMVER=$(echo "$RAW" | cut -d- -f1)

          HYPHENS=$(echo -n "$RAW" | tr -cd '-' | wc -c)
          if [ "$HYPHENS" -eq 0 ]; then
            BETA_SUFFIX=""
          else
            BETA_SUFFIX=$(echo "$RAW" | cut -d- -f2)
          fi

          DOTS=$(echo -n "$SEMVER" | tr -cd '.' | wc -c)
          if [ "$DOTS" -eq 1 ]; then
            SEMVER="${SEMVER}.0"
          else
            SEMVER="$SEMVER"
          fi

          MAJOR=$(echo "$SEMVER" | cut -d. -f1)
          MINOR=$(echo "$SEMVER" | cut -d. -f2)
          PATCH=$(echo "$SEMVER" | cut -d. -f3)

          if [[ -n "$BETA_SUFFIX" ]]; then
            CORE_VERSION="${SEMVER}-${BETA_SUFFIX}"
            DEB_VERSION="${SEMVER}~${BETA_SUFFIX}"
            ANDROID_VERSION_NAME="v${SEMVER}-${BETA_SUFFIX}"
          else
            CORE_VERSION="$SEMVER"
            DEB_VERSION="$SEMVER"
            ANDROID_VERSION_NAME="v${SEMVER}"
          fi

          # Formula supports MINOR 0-99 and PATCH 0-99; e.g. 2026.12.0 → 20261200, 2026.99.99 → 20269999
          ANDROID_VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          APPLE_VERSION="${SEMVER}"

          CURRENT_RELEASE_VERSION=$(cargo get workspace.package.version --major --minor --patch --delimiter '.')

          echo "::notice:: input_version=$RAW core=$CORE_VERSION deb=$DEB_VERSION android_name=$ANDROID_VERSION_NAME android_code=$ANDROID_VERSION_CODE apple_version=$APPLE_VERSION"

          echo "current_release_version=$CURRENT_RELEASE_VERSION"
          echo "core_version=$CORE_VERSION" >> "$GITHUB_OUTPUT"
          echo "deb_version=$DEB_VERSION" >> "$GITHUB_OUTPUT"
          echo "android_version_name=$ANDROID_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "android_version_code=$ANDROID_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apple_version=$APPLE_VERSION" >> "$GITHUB_OUTPUT"

      # --- core (Rust workspace) ---
      - name: Update nym-vpn-core/Cargo.toml
        working-directory: nym-vpn-core
        run: |
          # cargo set-version refuses downgrades; patch toml directly to allow any direction
          toml set Cargo.toml workspace.package.version "${{ steps.version.outputs.core_version }}" > Cargo-patched.toml
          mv Cargo-patched.toml Cargo.toml
          # update Cargo.lock with new workspace version (no other changes)
          cargo update --dry-run

      # --- tauri app (Linux + Windows) ---
      - name: Update nym-vpn-app/src-tauri/Cargo.toml
        working-directory: nym-vpn-app/src-tauri
        run: |
          toml set Cargo.toml package.version "${{ steps.version.outputs.core_version }}" > Cargo-patched.toml
          mv Cargo-patched.toml Cargo.toml
          cargo update --dry-run

      - name: Update nym-vpn-app/vpnd_compat.toml
        working-directory: nym-vpn-app
        run: |
          toml set vpnd_compat.toml version ">=${{ steps.version.outputs.core_version }}" > new_vpnd_compat.toml
          mv new_vpnd_compat.toml vpnd_compat.toml

      - name: Install npm dependencies
        working-directory: nym-vpn-app
        run: npm install

      - name: Update nym-vpn-app/src-tauri/tauri.conf.json
        working-directory: nym-vpn-app/src-tauri
        run: |
          QUERY=$(cat <<- 'EOD'
              .bundle.linux.deb.depends[] |= if (. | startswith("nym-vpnd"))
              then
                  "nym-vpnd (>= ${{ steps.version.outputs.deb_version }})"
              else
                  .
              end
          EOD
          )
          jq -r "$QUERY" tauri.conf.json > new_tauri.conf.json
          npx prettier --config ../prettier.config.js --write new_tauri.conf.json
          mv new_tauri.conf.json tauri.conf.json

      # --- android (Constants.kt) ---
      - name: Update nym-vpn-android Constants.kt
        env:
          CONSTANTS: nym-vpn-android/buildSrc/src/main/kotlin/Constants.kt
          NEW_NAME: ${{ steps.version.outputs.android_version_name }}
          NEW_CODE: ${{ steps.version.outputs.android_version_code }}
        run: |
          sed -i -E "s/(const val VERSION_NAME = \")[^\"]+(\")/\1${NEW_NAME}\2/" "$CONSTANTS"
          sed -i -E "s/(const val VERSION_CODE = )[0-9]+/\1${NEW_CODE}/" "$CONSTANTS"
          grep -E "VERSION_NAME|VERSION_CODE" "$CONSTANTS"

      # --- apple (fastlane) ---
      - name: Update nym-vpn-apple via fastlane
        working-directory: nym-vpn-apple
        run: |
          bundle exec fastlane mac bump_version "${{ steps.version.outputs.apple_version }}"

      # --- Linux installer ---
      - name: Update Linux install script
        working-directory: .pkg/linux
        if: ${{ inputs.update_linux_installer }}
        env:
          APP_TAG: nym-vpn-app-v${{ steps.version.outputs.core_version }}
          CORE_TAG: nym-vpn-core-v${{ steps.version.outputs.core_version }}
        run: |
          ./bump.sh

      # --- CHANGELOG ---
      - name: Update nym-vpn-core/CHANGELOG.md
        if: ${{ inputs.update_changelog }}
        working-directory: nym-vpn-core
        env:
          NEW_VERSION: ${{ steps.version.outputs.core_version }}
        run: |
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "::error:: CHANGELOG.md is missing '## [Unreleased]' section"
            exit 1
          fi

          # Commit the workspace version of release branch when running against develop
          if [ "${{ inputs.branch || github.ref_name }}" = "develop" ]; then
            RELEASE_DATE="TBD"
            VERSION="${{ steps.version.outputs.current_release_version }}"
          else
            RELEASE_DATE=$(date "+%F")
            VERSION="$NEW_VERSION"
          fi

          sed -i -e "s/\[Unreleased\]/[Unreleased]\n\n## [$VERSION] - $RELEASE_DATE/" CHANGELOG.md
          echo "::notice:: Inserted CHANGELOG entry for v$VERSION ($RELEASE_DATE)"
          head -12 CHANGELOG.md

      # --- diff + PR ---
      - name: Show diff
        run: git diff --stat && git diff

      - name: Create PR
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: "ci/bump-version-v${{ inputs.version }}"
          BASE_BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          git checkout -b "$BRANCH_NAME"
          git commit -a -m "ci: bump version to v${{ steps.version.outputs.core_version }} across all platforms"
          git push origin "$BRANCH_NAME"
          gh pr create \
              --base "$BASE_BRANCH" \
              --title "Bump version to \`v${{ inputs.version }}\` across all platforms" \
              --body "Unified version bump.

          - **core** (\`nym-vpn-core/Cargo.toml\`): \`${{ steps.version.outputs.core_version }}\`
          - **tauri app** (\`nym-vpn-app/src-tauri/Cargo.toml\`, \`vpnd_compat.toml\`, \`tauri.conf.json\`): \`${{ steps.version.outputs.core_version }}\` (deb \`${{ steps.version.outputs.deb_version }}\`)
          - **android** (\`Constants.kt\`): \`VERSION_NAME = \"${{ steps.version.outputs.android_version_name }}\"\`, \`VERSION_CODE = ${{ steps.version.outputs.android_version_code }}\`
          - **apple** (\`NymVPN.xcodeproj\`): \`MARKETING_VERSION = ${{ steps.version.outputs.apple_version }}\`"

      - name: Dry-run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "::warning:: Dry run — no commit or PR created."
