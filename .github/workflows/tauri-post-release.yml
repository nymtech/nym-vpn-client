name: tauri-post-release
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      version:
        type: string
        required: true
      core_release_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'App release tag'
        type: string
        required: true
        default: 'nym-vpn-app-v1.2.3'
      version:
        description: 'Semver app version'
        type: string
        required: true
        default: '1.2.3'
      core_release_tag:
        description: 'vpn-core release tag'
        type: string
        required: true
        default: 'nym-vpn-core-v1.2.3'

jobs:
  post-release:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: "develop"

      - name: Install deps
        run: |
          sudo apt install -y xmlstarlet

      - name: Bump installer script
        continue-on-error: true
        working-directory: .pkg/linux
        env:
          APP_TAG: ${{ inputs.release_tag }}
          CORE_TAG: ${{ inputs.core_release_tag }}
        run: |
          ./bump.sh

      - name: Set release date
        run: |
          date=$(date -u +'%Y-%m-%d')
          echo "release date: $date"
          echo "RELEASE_DATE=$date" >> $GITHUB_ENV

      - name: Update flatpak metainfo
        continue-on-error: true
        working-directory: nym-vpn-app/.pkg/flatpak
        env:
          METAINFO_XML: net.nymtech.NymVPN.metainfo.xml
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_DATE: ${{ env.RELEASE_DATE }}
        run: |
          ./update_metainfo.sh

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GIT_BRANCH: "tauri_postrel_${{ inputs.version }}"
          COMMIT_MSG: "tauri: bump linux installer and update flatpak metainfo v${{ inputs.version }}"
          PR_TITLE: "tauri: post release update v${{ inputs.version }}"
          PR_BODY: |
            - bump Linux installer script
            - update flatpak package metainfo.xml
        run: |
          git config --global user.name "NYM_bot"
          git config --global user.email "_@_"
          git switch -C ${{ env.GIT_BRANCH }}
          git add .pkg/linux
          git add nym-vpn-app/.pkg/flatpak
          git commit -m "${{ env.COMMIT_MSG }}"
          git push origin ${{ env.GIT_BRANCH }}
          gh pr create --title '${{ env.PR_TITLE }}' --body '${{ env.PR_BODY }}' --base develop --reviewer "doums"
