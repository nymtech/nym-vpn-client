name: build-nym-vpn-core-windows
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/build-nym-vpn-core-windows.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Orchestrated app version to embed (empty = self-bump as before)"
        required: false
        default: ""
        type: string
    secrets:
      VPND_SENTRY_DSN:
        required: true
    outputs:
      UPLOAD_DIR_WINDOWS:
        value: ${{ jobs.build-nym-vpn-core.outputs.UPLOAD_DIR_WINDOWS }}

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-wireguard-go-windows:
    uses: ./.github/workflows/build-wireguard-go-windows.yml

  build-winfw-windows:
    uses: ./.github/workflows/build-winfw-windows.yml

  build-nym-vpn-core-windows:
    strategy:
      fail-fast: false
      matrix:
        cpu_arch: [x64, ARM64]

    env:
      LIBS_PATH: build/lib/${{ matrix.cpu_arch == 'ARM64' && 'aarch64' || 'x86_64' }}-pc-windows-msvc
      WINFW_PATH: build/winfw/${{ matrix.cpu_arch }}-Release
      STDRIVER_PATH: nym-vpn-windows/split-tunnel-driver/signed/${{ matrix.cpu_arch }}
      WINTUN_DIST_DIR: wintun-dist
      UPLOAD_DIR_WINDOWS: core_artifacts_windows_${{ matrix.cpu_arch == 'ARM64' && 'arm64' || 'x64' }}

    if: github.actor != 'dependabot[bot]'
    needs: [build-wireguard-go-windows, build-winfw-windows]
    runs-on: custom-windows-11
    outputs:
      UPLOAD_DIR_WINDOWS: ${{ env.UPLOAD_DIR_WINDOWS }}
      RUST_VERSION: ${{ steps.rust-version.outputs.rustc }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Configure sccache
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SCCACHE_DIR=$HOME\.cache\sccache" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SCCACHE_CACHE_SIZE=20G" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57

      - name: Install GNU make
        run: |
          winget list GnuWin32.Make || winget install --disable-interactivity --accept-source-agreements --id GnuWin32.Make
          echo "${env:ProgramFiles(x86)}\GnuWin32\bin" | Out-File -FilePath "$env:GITHUB_PATH" -Append

      - name: Setup VS dev shell
        uses: humbletim/vsdevenv-shell@503210b7b39a7405e534ea93c36a733b93f01087

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.cpu_arch == 'ARM64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
          components: rustfmt, clippy

      - name: Install cargo-edit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-edit

      - name: Install cargo-get
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Install toml-cli
        uses: baptiste0928/cargo-install@v3
        with:
          crate: toml-cli

      - name: Apply orchestrated version
        uses: ./.github/workflows/platform/apply-version
        with:
          version: ${{ inputs.version }}
          target: core

      - name: Set version for nightly builds
        shell: bash
        working-directory: nym-vpn-core
        if: ${{ github.ref_name == 'develop' && inputs.version == '' }}
        run: |
          if [ ${{ github.event_name }} = 'schedule' ]; then
            TAG="nightly"
          else
            TAG="dev"
          fi
          VERSION=$(cargo-get workspace.package.version --major --minor --patch --delimiter='.')
          NEW_VERSION="${VERSION}-${TAG}.$(date -u +%Y%m%d%H%M)"
          echo "::notice:: Update version for nightly build: ${NEW_VERSION}"
          toml set Cargo.toml workspace.package.version "$NEW_VERSION" > Cargo-patched.toml
          mv Cargo-patched.toml Cargo.toml
          cargo fetch

      - name: Download wireguard-go-windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: wireguard-go_${{ matrix.cpu_arch == 'ARM64' && 'aarch64' || 'x86_64' }}-pc-windows-msvc
          path: build/lib

      - name: Download winfw artifacts
        uses: actions/download-artifact@v8
        with:
          name: winfw_${{ matrix.cpu_arch }}
          path: ${{ env.WINFW_PATH }}

      - name: Download wintun
        shell: vsdevenv x64 pwsh {0}
        working-directory: nym-vpn-core
        run: |
          make -f Windows.mk wintun PWSH=1 CPU_ARCH=${{ matrix.cpu_arch == 'ARM64' && 'ARM64' || 'AMD64' }} TARGET_DIR="${{ github.workspace }}/${{ env.WINTUN_DIST_DIR }}"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build nym-vpn-core
        shell: vsdevenv x64 pwsh {0}
        working-directory: nym-vpn-core
        env:
          SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}
        run: |
          cargo build --release${{ matrix.cpu_arch == 'ARM64' && ' --target aarch64-pc-windows-msvc' || '' }}

      - name: Get rust version used for build
        id: rust-version
        run: |
          echo "rustc=$(rustc -V)" >> $GITHUB_OUTPUT

      - name: Move things around to prepare for upload
        shell: bash
        env:
          SRC_BINARY: nym-vpn-core/target/${{ matrix.cpu_arch == 'ARM64' && 'aarch64-pc-windows-msvc/' || '' }}release
        run: |
          echo "moving binaries into ${{ env.UPLOAD_DIR_WINDOWS }}"
          rm -rf ${{ env.UPLOAD_DIR_WINDOWS }} || true
          mkdir ${{ env.UPLOAD_DIR_WINDOWS }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-vpnc.exe ${{ env.UPLOAD_DIR_WINDOWS }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-vpnd.exe ${{ env.UPLOAD_DIR_WINDOWS }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-socks5-proxy.exe ${{ env.UPLOAD_DIR_WINDOWS }}
          cp -vpr ${{ env.SRC_BINARY }}/nym-diagnostic.exe ${{ env.UPLOAD_DIR_WINDOWS }}
          cp -vpr ${{ env.LIBS_PATH }}/libwg.dll ${{ env.UPLOAD_DIR_WINDOWS }}
          cp -vpr ${{ env.WINFW_PATH }}/winfw.dll ${{ env.UPLOAD_DIR_WINDOWS }}
          cp -vpr ${{ env.WINTUN_DIST_DIR }}/wintun.dll ${{ env.UPLOAD_DIR_WINDOWS }}
          cp -vpr ${{ env.STDRIVER_PATH }}/nymvpn-split-tunnel.sys ${{ env.UPLOAD_DIR_WINDOWS }}
          cp -vpr ${{ env.STDRIVER_PATH }}/nymvpn-split-tunnel.inf ${{ env.UPLOAD_DIR_WINDOWS }}
          cp -vpr ${{ env.STDRIVER_PATH }}/nymvpn-split-tunnel.cat ${{ env.UPLOAD_DIR_WINDOWS }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UPLOAD_DIR_WINDOWS }}
          path: ${{ env.UPLOAD_DIR_WINDOWS }}
          if-no-files-found: error
          retention-days: 1
