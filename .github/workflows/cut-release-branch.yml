name: cut-release-branch

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Enter release version YYYY.{n} (ex: 2026.1)"
        type: string
        required: true
      release_name:
        description: "Enter release name (🍌🍉🥝🍍)"
        type: string
        required: true
      bump_type:
        description: Which component of version to bump (MAJOR.MINOR.PATCH)
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: "minor"
      dry_run:
        description: "Test run that will only print git diff and all changes being made"
        required: true
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  GIT_USER: NYM CI
  GIT_EMAIL: ci@nymtech.net

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  push-release-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate input
        run: |
          if ! echo "${{ inputs.release_version }}" | grep -P '^[0-9]{4}\.[0-9]{1,2}$'; then
            echo "::error:: Invalid release version format (expected: YYYY.{n})"
            exit 1
          fi
          if ! echo "${{ inputs.release_name }}" | grep -P '^[a-z]+$'; then
            echo "::error:: Invalid release name format (expected lowercase letters only)"
            exit 2
          fi

      - name: Configure git
        run: |
          git config --global user.name "${{ env.GIT_USER }}"
          git config --global user.email "${{ env.GIT_EMAIL }}"

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: develop
          ssh-key: ${{ secrets.CI_RELEASE_DEPLOY_KEY }}

      - name: Create release branch
        env:
          RELEASE_BRANCH: release/${{ inputs.release_version }}-${{ inputs.release_name }}
        run: |
          # match any i.e `yyyy.xx-*`
          HEAD_COUNT=$(git ls-remote --heads origin 'refs/heads/release/${{ inputs.release_version }}-*' | wc -l | tr -d ' ')

          if [ "$HEAD_COUNT" -eq "0" ]; then
            # create release branch and push it to remote
            git checkout -b "${{ env.RELEASE_BRANCH }}"
            echo "::notice:: Created release branch: ${{ env.RELEASE_BRANCH }}"
            if [ '${{ inputs.dry_run }}' == 'true' ]; then
              echo "::warning:: Dry run, skipping push to origin/${{ env.RELEASE_BRANCH }}"
            else
              git push origin "${{ env.RELEASE_BRANCH }}"
            fi
          else
            echo "::error:: 'release/${{ inputs.release_version }}-*' branch already exists but it must not!"
            exit 1
          fi

  bump-develop:
    runs-on: ubuntu-latest
    needs: push-release-branch
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Configure git
        run: |
          git config --global user.name "${{ env.GIT_USER }}"
          git config --global user.email "${{ env.GIT_EMAIL }}"

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: develop

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install cargo-edit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-edit

      - name: Install cargo-get
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Install toml-cli
        uses: baptiste0928/cargo-install@v3
        with:
          crate: toml-cli

      - name: Compute next version
        id: next-version
        working-directory: nym-vpn-core
        run: |
          VERSION=$(cargo get workspace.package.version)

          # this would strip -beta suffix
          cargo set-version --bump ${{ inputs.bump_type }}

          # fetch bumped version
          VERSION=$(cargo get workspace.package.version)

          # put -beta suffix back
          BETA_VERSION="$VERSION-beta"
          # export ~beta version for debian
          BETA_TILDE_VERSION="$VERSION~beta"

          # cargo set-version doesn't allow downgrades, patch toml directly
          toml set Cargo.toml workspace.package.version "$BETA_VERSION" > Cargo-patched.toml
          mv Cargo-patched.toml Cargo.toml

          echo "::notice:: Next version: $BETA_VERSION"
          echo "next_version=$BETA_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_version_tilde=$BETA_TILDE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update nym-vpn-core/Cargo.toml
        working-directory: nym-vpn-core
        run: |
          cargo set-version "${{ steps.next-version.outputs.next_version }}"
          # dry-run will update Cargo.lock with new workspace version, without any other changes
          cargo update --dry-run

      - name: Update nym-vpn-app/src-tauri/Cargo.toml
        working-directory: nym-vpn-app/src-tauri
        run: |
          cargo set-version "${{ steps.next-version.outputs.next_version }}"
          # dry-run will update Cargo.lock with new package version, without any other changes
          cargo update --dry-run

      - name: Update nym-vpn-app/vpnd_compat.toml
        working-directory: nym-vpn-app
        run: |
          toml set vpnd_compat.toml version ">=${{ steps.next-version.outputs.next_version }}" > new_vpnd_compat.toml
          mv new_vpnd_compat.toml vpnd_compat.toml

      - name: Install npm dependencies
        working-directory: nym-vpn-app
        run: npm install

      - name: Update nym-vpn-app/src-tauri/tauri.conf.json
        working-directory: nym-vpn-app/src-tauri
        run: |
          # replace version of deb dependency on nym-vpnd
          QUERY=$(cat <<- 'EOD'
              .bundle.linux.deb.depends[] |= if (. | startswith("nym-vpnd"))
              then
                  "nym-vpnd (>= ${{ steps.next-version.outputs.next_version_tilde }})"
              else
                  .
              end
          EOD
          )
          jq -r "$QUERY" tauri.conf.json > new_tauri.conf.json
          npx prettier --config ../prettier.config.js --write new_tauri.conf.json
          mv new_tauri.conf.json tauri.conf.json

      - name: Create PR to bump develop to v${{ steps.next-version.outputs.next_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: "ci/bump-develop-v${{ steps.next-version.outputs.next_version }}"
        run: |
          git diff
          if [ '${{ inputs.dry_run }}' == 'true' ]; then
            echo "::warning:: Dry run, skipping commit and PR creation"
          else
            git checkout -b "${{ env.BRANCH_NAME }}"
            git commit -a -m "ci: bump develop to v${{ steps.next-version.outputs.next_version }}"
            git push origin "${{ env.BRANCH_NAME }}"
            gh pr create \
                --title 'Bump develop to `v${{ steps.next-version.outputs.next_version }}`' \
                --body 'This PR bumps develop to `v${{ steps.next-version.outputs.next_version }}`' \
                --milestone "no-milestone"
          fi
