name: build-winfw-windows
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/build-winfw-windows.yml"
      - "nym-windows/**"
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

# https://github.com/actions/runner-images/issues/1794#issuecomment-707217728

jobs:
  build:
    runs-on: "custom-windows-11"

    steps:
      - name: Cleanup working directory
        shell: bash
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install cargo-get
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-get

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Install GNU make
        run: |
          winget list GnuWin32.Make || winget install --disable-interactivity --accept-source-agreements --id GnuWin32.Make
          echo "${env:ProgramFiles(x86)}\GnuWin32\bin" | Out-File -FilePath "$env:GITHUB_PATH" -Append

      - name: Setup VS dev shell
        uses: humbletim/vsdevenv-shell@503210b7b39a7405e534ea93c36a733b93f01087

      - name: Build winfw
        shell: vsdevenv x64 pwsh {0}
        working-directory: nym-vpn-core
        run: |
          make -f Windows.mk winfw CPU_ARCH=AMD64 RELEASE=0 PWSH=1
          make -f Windows.mk winfw CPU_ARCH=AMD64 RELEASE=1 PWSH=1

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: winfw
          path: |
            ${{ github.workspace }}/nym-vpn-windows/winfw/bin/x64-Release/winfw.dll
            ${{ github.workspace }}/nym-vpn-windows/winfw/bin/x64-Release/winfw.lib
          if-no-files-found: error
          retention-days: 1
