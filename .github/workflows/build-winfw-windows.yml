name: build-winfw-windows
on:
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

# https://github.com/actions/runner-images/issues/1794#issuecomment-707217728

jobs:
  build:
    runs-on: "custom-windows-11"

    steps:
      - name: Cleanup working directory
        shell: bash
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Install GNU make
        run: |
          winget list GnuWin32.Make || winget install --disable-interactivity --id GnuWin32.Make
          echo "${env:ProgramFiles(x86)}\GnuWin32\bin" | Out-File -FilePath "$env:GITHUB_PATH" -Append

      # This step is prone to compiler error that are simply blanks, this action auto retries a few times in case of error
      - name: Build/Move winfw
        uses: nick-fields/retry@v3
        with:
          shell: pwsh
          timeout_seconds: 300
          max_attempts: 3
          retry_on: error
          command: make -C nym-vpn-core -f Windows.mk winfw CPU_ARCH=amd64 RELEASE=1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winfw.dll
          path: |
            ${{ github.workspace }}/nym-vpn-windows/winfw/bin/x64-Release/winfw.dll
          retention-days: 10

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winfw.lib
          path: |
            ${{ github.workspace }}/nym-vpn-windows/winfw/bin/x64-Release/winfw.lib
          retention-days: 10
