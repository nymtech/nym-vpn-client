name: ci-nym-vpn-app-js

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci-nym-vpn-app-js.yml'
      - 'nym-vpn-app/**'
  workflow_dispatch:

jobs:
  translations:
    runs-on: arc-linux-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            nym-vpn-app
            crowdin-configs

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Crowdin CLI
        run: npm install -g @crowdin/cli

      - name: Verify Crowdin install
        run: crowdin --version

      - name: Download translations from Crowdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          crowdin download translations \
            --config crowdin-configs/linux-windows.yml

      - name: Upload translations artifact
        uses: actions/upload-artifact@v6
        with:
          name: crowdin-translations
          path: nym-vpn-app/src/i18n

  check:
    needs: translations
    strategy:
      fail-fast: false
      matrix:
        os: [arc-linux-latest, custom-windows-11]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            nym-vpn-app

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nym-vpn-app/package-lock.json

      - name: Install dependencies
        working-directory: nym-vpn-app
        run: npm ci

      - name: Download translations artifact
        uses: actions/download-artifact@v8
        with:
          name: crowdin-translations
          path: nym-vpn-app/src/i18n

      - name: Typecheck
        working-directory: nym-vpn-app
        run: npm run tscheck

      - name: Check lint
        working-directory: nym-vpn-app
        run: npm run lint

      - name: Check formatting
        working-directory: nym-vpn-app
        run: npm run fmt:check

      #      - name: Run tests
      #        working-directory: nym-vpn-app
      #        run: npm run test

      - name: Check build
        working-directory: nym-vpn-app
        run: npm run build
