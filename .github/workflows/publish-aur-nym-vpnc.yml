# Publish nym-vpnc on AUR

name: publish-aur-nym-vpnc
on:
  workflow_dispatch:
    inputs:
      # NOTE: with unified-only core, this is the unified tag nym-vpn-v<version>,
      # not the legacy nym-vpn-core-v<version>. The referenced release must be PUBLISHED
      # (draft URLs 404). on-release-publish.yml calls this AUTOMATICALLY when the unified
      # ship draft is published; manual dispatch is a fallback / re-run of that step.
      release_tag:
        description: "Tag name of the release"
        required: true
        default: nym-vpn-v0.1.0
      pkgrel:
        description: "PKGBUILD package release number"
        required: false
        type: number
        default: 1
      publish_aur:
        description: "publish PKGBUILD changes to AUR"
        type: boolean
        required: false
        default: false
      commit_msg:
        description: "Commit message for the AUR repo (default to package version)"
        type: string
        required: false
  workflow_call:
    inputs:
      # NOTE: with unified-only core, this is the unified tag nym-vpn-v<version>,
      # not the legacy nym-vpn-core-v<version>. The referenced release must be PUBLISHED
      # (draft URLs 404). on-release-publish.yml calls this AUTOMATICALLY when the unified
      # ship draft is published; manual dispatch is a fallback / re-run of that step.
      release_tag:
        required: true
        type: string
      pkgrel:
        required: false
        type: number
        default: 1
      publish_aur:
        type: boolean
        required: true
      commit_msg:
        type: string
        required: true

permissions:
  contents: read

jobs:
  aur-publish:
    name: Publish package in AUR
    runs-on: arc-linux-latest-dind
    strategy:
      fail-fast: false
      matrix:
        # bfs → build from sources
        # bin → prebuilt
        pkgtype: [bfs, bin]
        include:
          - pkgtype: bfs
            pkgbuild: PKGBUILD
            pkgname: nym-vpnc
          - pkgtype: bin
            pkgbuild: PKGBUILD-bin
            pkgname: nym-vpnc-bin
    env:
      PKGNAME: ${{ matrix.pkgname }}
      PKGBUILD: nym-vpn-core/crates/nym-vpnc/.pkg/aur/${{ matrix.pkgbuild }}
      PKGREL: ${{ inputs.pkgrel }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      REPOSITORY: ${{ github.repository }}
      TARBALL: ${{ github.workspace }}/sources.tar.gz
      LINUX_BIN_X86_64: linux-bin-x86_64
      LINUX_BIN_AARCH64: linux-bin-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Download sources
        run: |
          curl -LfsSo ${{ env.TARBALL }} "https://github.com/${{ env.REPOSITORY }}/archive/refs/tags/${{ env.RELEASE_TAG }}.tar.gz"
          mkdir tarball
          tar -xzf $TARBALL -C tarball

      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Get app version
        id: app-version
        uses: nicolaiunrein/cargo-get@master
        with:
          subcommand: package.version --entry="tarball/nym-vpn-client-${{ env.RELEASE_TAG }}/nym-vpn-core/crates/nym-vpnc"

      - name: Download prebuilt binary
        if: matrix.pkgtype == 'bin'
        run: |
          curl -LfsSo $LINUX_BIN_X86_64 "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/nym-vpn-core-v${{ steps.app-version.outputs.metadata }}_linux_x86_64.tar.gz"
          curl -LfsSo $LINUX_BIN_AARCH64 "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/nym-vpn-core-v${{ steps.app-version.outputs.metadata }}_linux_aarch64.tar.gz"

      - name: Update PKGBUILD (bfs)
        if: matrix.pkgtype == 'bfs'
        env:
          PKGVER: ${{ steps.app-version.outputs.metadata }}
          PKGREL: ${{ env.PKGREL }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          PKGBUILD: ${{ env.PKGBUILD }}
        run: |
          export SRC_TARBALL_SHA256=$(sha256sum "${{ env.TARBALL }}" | cut -d' ' -f1)
          envsubst '$PKGVER,$PKGREL,$RELEASE_TAG,$SRC_TARBALL_SHA256' < "$PKGBUILD" > "$PKGBUILD.tmp"
          mv "$PKGBUILD.tmp" "$PKGBUILD"

      - name: Update PKGBUILD (bin)
        if: matrix.pkgtype == 'bin'
        env:
          PKGVER: ${{ steps.app-version.outputs.metadata }}
          PKGREL: ${{ env.PKGREL }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          PKGBUILD: ${{ env.PKGBUILD }}
        run: |
          export TARBALL_SHA256_X86_64=$(sha256sum "${{ env.LINUX_BIN_X86_64 }}" | cut -d' ' -f1)
          export TARBALL_SHA256_AARCH64=$(sha256sum "${{ env.LINUX_BIN_AARCH64 }}" | cut -d' ' -f1)
          envsubst '$PKGVER,$PKGREL,$RELEASE_TAG,$TARBALL_SHA256_X86_64,$TARBALL_SHA256_AARCH64' < "$PKGBUILD" > "$PKGBUILD.tmp"
          mv "$PKGBUILD.tmp" "$PKGBUILD"

      - name: Rename PKGBUILD (bin)
        if: matrix.pkgtype == 'bin'
        run: |
          # rename PKGBUILD-bin to PKGBUILD
          mv ${{ env.PKGBUILD }} PKGBUILD
          echo "PKGBUILD=./PKGBUILD" >> $GITHUB_ENV

      - name: Show PKGBUILD
        run: cat "$PKGBUILD"

      - name: Publish
        if: inputs.publish_aur == true
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: ${{ env.PKGNAME }}
          pkgbuild: ${{ env.PKGBUILD }}
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: ${{ inputs.commit_msg || format('v{0}', steps.app-version.outputs.metadata) }}
