name: ci-nym-vpn-core-android

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "nym-vpn-core/crates/**"
      - "nym-vpn-core/Cargo.toml"
      - "nym-vpn-core/Android.mk"
      - ".github/workflows/ci-nym-vpn-core-android.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  AGENT_ISSELFHOSTED: 1 # https://github.com/actions/setup-go/issues/432

jobs:
  build-wireguard-go-android:
    uses: ./.github/workflows/build-wireguard-go-android.yml

  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: AppleSilicon
    needs: build-wireguard-go-android

    steps:
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libdbus-1-dev libmnl-dev libnftnl-dev protobuf-compiler \
            git curl gcc g++ make unzip rsync

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install \
            protobuf \
            git \
            curl \
            gcc \
            make \
            unzip \
            rsync || true

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ vars.REQUIRED_RUSTC_VERSION }}
          components: rustfmt, clippy
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-ndk

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ vars.REQUIRED_NDK_VERSION }}
          add-to-path: false

      - name: Set env
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

          case "$(uname -s)" in
            Linux*) host_tag=linux-x86_64 ;;
            Darwin*) host_tag=darwin-x86_64 ;;
            *) host_tag=linux-x86_64 ;;
          esac

          echo "NDK_TOOLCHAIN_DIR=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/${host_tag}/bin" >> $GITHUB_ENV

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "21.12" # 3.21.12: the version on ubuntu 24.04. Don't change this!
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('nym-vpn-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: nym-vpn-core/target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('nym-vpn-core/Cargo.lock') }}-${{ hashFiles('nym-vpn-core/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ hashFiles('nym-vpn-core/Cargo.lock') }}-
            ${{ runner.os }}-cargo-build-

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: wireguard-go_aarch64-linux-android
          path: build/lib/aarch64-linux-android

      - name: rustfmt check
        working-directory: nym-vpn-core
        run: |
          cargo fmt --check --all

      - name: Clippy
        working-directory: nym-vpn-core
        run: |
          cargo ndk -t aarch64-linux-android clippy -p nym-vpn-lib-uniffi -- -Dwarning

      - name: Build
        working-directory: nym-vpn-core
        run: |
          make -f Android.mk build RELEASE=false
