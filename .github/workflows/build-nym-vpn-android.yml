name: build-nym-vpn-android
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/build-nym-vpn-android.yml"
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: "Build type"
        required: true
        default: debug
        options:
          - debug
          - prerelease
          - nightly
          - release
      build_format:
        type: choice
        description: "Build format"
        required: true
        default: apk
        options:
          - bundle
          - apk
      build_flavor:
        type: choice
        description: "Build flavor"
        required: true
        default: fdroid
        options:
          - fdroid
          - play
      skip_crowdin:
        type: boolean
        description: "Skip Crowdin translations download"
        required: false
        default: false
  workflow_call:
    inputs:
      build_type:
        type: string
        description: "Build type"
        required: true
        default: debug
      build_format:
        type: string
        description: "Build format"
        required: true
        default: apk
      build_flavor:
        type: string
        description: "Build flavor"
        required: true
      skip_crowdin:
        type: boolean
        description: "Skip Crowdin translations download"
        required: false
        default: false
      version:
        type: string
        description: "Orchestrated app version to embed (empty = use Constants.kt as before)"
        required: false
        default: ""
      nightly_timestamp:
        description: "Nightly timestamp used by Android app (nightly only)"
        required: false
        type: string
        default: ""
    outputs:
      artifact_name:
        description: "Name of the built artifact"
        value: ${{ jobs.build-nym-vpn-app-android.outputs.artifact_name }}
    secrets:
      VPND_SENTRY_DSN:
        required: true
      SCCACHE_REDIS_ENDPOINT:
        required: true
      SCCACHE_REDIS_PASSWORD:
        required: true
      ANDROID_SIGNING_KEY_ALIAS:
        required: true
      ANDROID_SIGNING_KEY_PASSWORD:
        required: true
      ANDROID_SIGNING_STORE_PASSWORD:
        required: true
      ANDROID_SENTRY_DSN:
        required: true
      ANDROID_SERVICE_ACCOUNT_JSON:
        required: true
      ANDROID_KEYSTORE:
        required: true
      CROWDIN_PROJECT_ID:
        required: true
      CROWDIN_PERSONAL_TOKEN:
        required: true
env:
  UPLOAD_DIR_ANDROID: android_artifacts_${{ inputs.build_flavor }}
  SCCACHE_REDIS_ENDPOINT: ${{ secrets.SCCACHE_REDIS_ENDPOINT }}
  SCCACHE_REDIS_PASSWORD: ${{ secrets.SCCACHE_REDIS_PASSWORD }}
  SCCACHE_REDIS_EXPIRATION: 86400

jobs:
  build-nym-vpn-app-android:
    name: build-nym-vpn-android (${{ inputs.build_flavor }})
    runs-on: arc-linux-latest
    timeout-minutes: 90
    env:
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SENTRY_DSN: ${{ secrets.ANDROID_SENTRY_DSN }}
      KEY_STORE_FILE: "android_keystore.jks"
      KEY_STORE_LOCATION: ${{ github.workspace }}/nym-vpn-android/app/keystore/
    defaults:
      run:
        working-directory: nym-vpn-android
    outputs:
      upload_dir: ${{ env.UPLOAD_DIR_ANDROID }}
      artifact_name: ${{ steps.output-path.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Apply orchestrated version
        uses: ./.github/actions/apply-version
        with:
          version: ${{ inputs.version }}
          target: android

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache NDK
        uses: actions/cache@v6
        id: cache-ndk
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}
          restore-keys: |
            ndk-

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        timeout-minutes: 10
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Verify NDK Setup
        run: |
          echo "NDK Path: ${{ steps.setup-ndk.outputs.ndk-path }}"
          if [ ! -d "${{ steps.setup-ndk.outputs.ndk-path }}" ]; then
            echo "Error: NDK directory not found at ${{ steps.setup-ndk.outputs.ndk-path }}"
            exit 1
          fi
          echo "NDK setup successful"
          ls -la "${{ steps.setup-ndk.outputs.ndk-path }}"

      - name: Set env
        shell: bash
        env:
          NIGHTLY_TIMESTAMP: ${{ inputs.nightly_timestamp }}
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK_TOOLCHAIN_DIR=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
          # Used by gradle to name nightly apks
          if [ -n "$NIGHTLY_TIMESTAMP" ]; then
            echo "NIGHTLY_TIMESTAMP=$NIGHTLY_TIMESTAMP" >> "$GITHUB_ENV"
            echo "::notice:: Set nightly timestamp for Android: $NIGHTLY_TIMESTAMP"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache-dependency-path: wireguard/libwg/go.sum

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-ndk

      - name: Install cargo-license
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-license

      - name: Apply orchestrated version (core)
        uses: ./.github/actions/apply-version
        with:
          version: ${{ inputs.version }}
          target: core

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev libmnl-dev libnftnl-dev protobuf-compiler git curl gcc g++ make unzip rsync

      - name: Decode Keystore
        if: ${{ inputs.build_type != 'debug' }}
        id: decode_keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: ${{ env.KEY_STORE_FILE }}
          fileDir: ${{ env.KEY_STORE_LOCATION }}
          encodedString: ${{ secrets.ANDROID_KEYSTORE }}

      - name: Create keystore path env var
        if: ${{ inputs.build_type != 'debug' }}
        run: |
          store_path=${{ env.KEY_STORE_LOCATION }}${{ env.KEY_STORE_FILE }}
          echo "KEY_STORE_PATH=$store_path" >> $GITHUB_ENV

      - name: Create service_account.json
        if: ${{ inputs.build_type != 'debug' }}
        id: createServiceAccount
        run: echo '${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Build Google Play Release Bundle
        if: ${{ inputs.build_flavor == 'play' && inputs.build_type == 'release' && inputs.build_format == 'aab' }}
        timeout-minutes: 45
        run: ./gradlew :app:bundleGeneralRelease --info
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          VPNLIB_SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}

      - name: Build Google Play Prerelease Bundle
        if: ${{ inputs.build_flavor == 'play' && inputs.build_type == 'prerelease' && inputs.build_format == 'aab' }}
        timeout-minutes: 45
        run: ./gradlew :app:bundleGeneralPrerelease --info
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          VPNLIB_SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}

      - name: Build Google Play Nightly Bundle
        if: ${{ inputs.build_flavor == 'play' && inputs.build_type == 'nightly' && inputs.build_format == 'aab' }}
        timeout-minutes: 45
        run: ./gradlew :app:bundleGeneralNightly --info
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          VPNLIB_SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}

      - name: Build Fdroid Release Apk
        if: ${{ inputs.build_flavor == 'fdroid' && inputs.build_type == 'release' && inputs.build_format == 'apk' }}
        timeout-minutes: 45
        run: ./gradlew :app:assembleFdroidRelease --info
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          VPNLIB_SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}

      - name: Build Fdroid Release Bundle
        if: ${{ inputs.build_flavor == 'fdroid' && inputs.build_type == 'release' && inputs.build_format == 'aab' }}
        timeout-minutes: 45
        run: ./gradlew :app:bundleFdroidRelease --info
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          VPNLIB_SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}

      - name: Build Fdroid Prerelease Apk
        if: ${{ inputs.build_flavor == 'fdroid' && inputs.build_type == 'prerelease' && inputs.build_format == 'apk' }}
        timeout-minutes: 45
        run: ./gradlew :app:assembleFdroidPrerelease --info
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          VPNLIB_SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}

      - name: Build Fdroid Prerelease Bundle
        if: ${{ inputs.build_flavor == 'fdroid' && inputs.build_type == 'prerelease' && inputs.build_format == 'aab' }}
        timeout-minutes: 45
        run: ./gradlew :app:bundleFdroidPrerelease --info
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          VPNLIB_SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}

      - name: Build Fdroid Nightly Apk
        if: ${{ inputs.build_flavor == 'fdroid' && inputs.build_type == 'nightly' && inputs.build_format == 'apk' }}
        timeout-minutes: 45
        run: ./gradlew :app:assembleFdroidNightly --info
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          VPNLIB_SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}

      - name: Build Fdroid Nightly Bundle
        if: ${{ inputs.build_flavor == 'fdroid' && inputs.build_type == 'nightly' && inputs.build_format == 'aab' }}
        timeout-minutes: 45
        run: ./gradlew :app:bundleFdroidNightly --info
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          VPNLIB_SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}

      - name: Build Debug Apk
        if: ${{ inputs.build_flavor == 'fdroid' && inputs.build_type == 'debug' && inputs.build_format == 'apk' }}
        timeout-minutes: 45
        run: ./gradlew :app:assembleFdroidDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          VPNLIB_SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}

      - name: Build Debug Bundle
        if: ${{ inputs.build_flavor == 'fdroid' && inputs.build_type == 'debug' && inputs.build_format == 'aab' }}
        timeout-minutes: 45
        run: ./gradlew :app:bundleFdroidDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          VPNLIB_SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}

      - name: Get output path
        id: output-path
        working-directory: ${{ github.workspace }}
        env:
          BUILD_FLAVOR: ${{ inputs.build_flavor }}
          BUILD_FORMAT: ${{ inputs.build_format }}
        run: |
            OUT_DIR="nym-vpn-android/app/build/outputs"

            case "${BUILD_FLAVOR}-${BUILD_FORMAT}" in
              fdroid-apk) EXT='apk' ;;
              fdroid-aab) EXT='aab' ;;
              play-aab) EXT='aab' ;;
              *)
                echo "::error:: Unsupported build flavor/format: ${BUILD_FLAVOR}-${BUILD_FORMAT}"
                exit 1
                ;;
            esac

            ARTIFACT_FILE=$(find "$OUT_DIR" -name "*.$EXT" -type f | head -1)
            if [ -z "$ARTIFACT_FILE" ]; then
              echo "::error:: No artifact found"
              exit 1
            else
              echo "::notice:: Found artifact: $ARTIFACT_FILE"
            fi

            ARTIFACT_NAME=$(basename $ARTIFACT_FILE)

            echo "artifact_path=$ARTIFACT_FILE" >> $GITHUB_OUTPUT
            echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.UPLOAD_DIR_ANDROID }}
          path: ${{ steps.output-path.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 1
