name: build-nym-vpn-android
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/build-nym-vpn-android.yml"
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: "Build type"
        required: true
        default: debug
        options:
          - debug
          - prerelease
          - nightly
          - release
      build_format:
        type: choice
        description: "Build format"
        required: true
        default: apk
        options:
          - aab
          - apk
      build_flavor:
        type: choice
        description: "Build flavor"
        required: true
        default: fdroid
        options:
          - fdroid
          - play
      skip_crowdin:
        type: boolean
        description: "Skip Crowdin translations download"
        required: false
        default: false
  workflow_call:
    inputs:
      build_type:
        type: string
        description: "Build type"
        required: true
        default: debug
      build_format:
        type: string
        description: "Build format"
        required: true
        default: apk
      build_flavor:
        type: string
        description: "Build flavor"
        required: true
      skip_crowdin:
        type: boolean
        description: "Skip Crowdin translations download"
        required: false
        default: false
      version:
        type: string
        description: "Orchestrated app version to embed (empty = use Constants.kt as before)"
        required: false
        default: ""
      nightly_timestamp:
        description: "Nightly timestamp used by Android app (nightly only)"
        required: false
        type: string
        default: ""
    outputs:
      artifact_name:
        description: "Name of the built artifact"
        value: ${{ jobs.build-nym-vpn-app-android.outputs.artifact_name }}
    secrets:
      VPND_SENTRY_DSN:
        required: true
      SCCACHE_REDIS_ENDPOINT:
        required: true
      SCCACHE_REDIS_PASSWORD:
        required: true
      ANDROID_SIGNING_KEY_ALIAS:
        required: true
      ANDROID_SIGNING_KEY_PASSWORD:
        required: true
      ANDROID_SIGNING_STORE_PASSWORD:
        required: true
      ANDROID_SENTRY_DSN:
        required: true
      ANDROID_SERVICE_ACCOUNT_JSON:
        required: true
      ANDROID_KEYSTORE:
        required: true
      CROWDIN_PROJECT_ID:
        required: true
      CROWDIN_PERSONAL_TOKEN:
        required: true
env:
  # Inputs are empty on pull_request, so fall back to a debug F-Droid APK.
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
  BUILD_FORMAT: ${{ inputs.build_format || 'apk' }}
  BUILD_FLAVOR: ${{ inputs.build_flavor || 'fdroid' }}
  UPLOAD_DIR_ANDROID: android_artifacts_${{ inputs.build_flavor || 'fdroid' }}
  DEBUG_SYMBOLS_DIR_ANDROID: core_debug_symbols_android
  SCCACHE_REDIS_ENDPOINT: ${{ secrets.SCCACHE_REDIS_ENDPOINT }}
  SCCACHE_REDIS_PASSWORD: ${{ secrets.SCCACHE_REDIS_PASSWORD }}
  SCCACHE_REDIS_EXPIRATION: 86400

jobs:
  build-nym-vpn-app-android:
    name: build-nym-vpn-android (${{ inputs.build_flavor || 'fdroid' }})
    runs-on: arc-linux-latest
    timeout-minutes: 90
    env:
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SENTRY_DSN: ${{ secrets.ANDROID_SENTRY_DSN }}
      KEY_STORE_FILE: "android_keystore.jks"
      KEY_STORE_LOCATION: ${{ github.workspace }}/nym-vpn-android/app/keystore/
    defaults:
      run:
        working-directory: nym-vpn-android
    outputs:
      upload_dir: ${{ env.UPLOAD_DIR_ANDROID }}
      artifact_name: ${{ steps.output-path.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup sccache
        if: ${{ env.BUILD_FLAVOR != 'fdroid' || env.BUILD_TYPE == 'debug' }}
        uses: ./.github/actions/setup-sccache

      - name: Apply orchestrated version
        uses: ./.github/actions/apply-version
        with:
          version: ${{ inputs.version }}
          target: android

      - name: Dotenv Action
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          ndk_version="$(sed -n 's/.*const val NDK_VERSION = "\(.*\)".*/\1/p' buildSrc/src/main/kotlin/Constants.kt)"
          [ -n "$ndk_version" ] || { echo "::error::Cannot parse NDK_VERSION from Constants.kt"; exit 1; }
          sdkmanager --install "ndk;$ndk_version"
          ndk_home="$ANDROID_HOME/ndk/$ndk_version"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "NDK_TOOLCHAIN_DIR=$ndk_home/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Set env
        shell: bash
        env:
          NIGHTLY_TIMESTAMP: ${{ inputs.nightly_timestamp }}
        run: |
          # Used by gradle to name nightly apks
          if [ -n "$NIGHTLY_TIMESTAMP" ]; then
            echo "NIGHTLY_TIMESTAMP=$NIGHTLY_TIMESTAMP" >> "$GITHUB_ENV"
            echo "::notice:: Set nightly timestamp for Android: $NIGHTLY_TIMESTAMP"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache-dependency-path: wireguard/libwg/go.sum

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-ndk

      - name: Install cargo-license
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-license

      - name: Apply orchestrated version (core)
        uses: ./.github/actions/apply-version
        with:
          version: ${{ inputs.version }}
          target: core

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev libmnl-dev libnftnl-dev protobuf-compiler git curl gcc g++ make unzip rsync

      - name: Decode Keystore
        if: ${{ env.BUILD_TYPE != 'debug' }}
        id: decode_keystore
        uses: timheuer/base64-to-file@dfa5a5dd38803cb4f5c3a081eeb28e8362d43e9c # v2.0.0
        with:
          fileName: ${{ env.KEY_STORE_FILE }}
          fileDir: ${{ env.KEY_STORE_LOCATION }}
          encodedString: ${{ secrets.ANDROID_KEYSTORE }}

      - name: Create keystore path env var
        if: ${{ env.BUILD_TYPE != 'debug' }}
        run: |
          store_path=${{ env.KEY_STORE_LOCATION }}${{ env.KEY_STORE_FILE }}
          echo "KEY_STORE_PATH=$store_path" >> $GITHUB_ENV

      - name: Create service_account.json
        if: ${{ env.BUILD_TYPE != 'debug' }}
        id: createServiceAccount
        run: echo '${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Guard F-Droid compile env
        run: |
          set -euo pipefail
          if [ "$BUILD_FLAVOR" = fdroid ] && [ -n "${VPNLIB_SENTRY_DSN+x}" ]; then
            echo "::error::VPNLIB_SENTRY_DSN must be unset for F-Droid so option_env matches fdroiddata"
            exit 1
          fi

      - name: Build Google Play Release Bundle
        if: ${{ env.BUILD_FLAVOR == 'play' && env.BUILD_TYPE == 'release' && env.BUILD_FORMAT == 'aab' }}
        timeout-minutes: 45
        run: ./gradlew :app:bundleGeneralRelease --info
        env:
          FDROID: "false"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          VPNLIB_SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}
          VPNLIB_DEBUG_SYMBOLS_DIR: ${{ github.workspace }}/${{ env.DEBUG_SYMBOLS_DIR_ANDROID }}

      - name: Build Google Play Prerelease Bundle
        if: ${{ env.BUILD_FLAVOR == 'play' && env.BUILD_TYPE == 'prerelease' && env.BUILD_FORMAT == 'aab' }}
        timeout-minutes: 45
        run: ./gradlew :app:bundleGeneralPrerelease --info
        env:
          FDROID: "false"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          VPNLIB_SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}
          VPNLIB_DEBUG_SYMBOLS_DIR: ${{ github.workspace }}/${{ env.DEBUG_SYMBOLS_DIR_ANDROID }}

      - name: Build Google Play Nightly Bundle
        if: ${{ env.BUILD_FLAVOR == 'play' && env.BUILD_TYPE == 'nightly' && env.BUILD_FORMAT == 'aab' }}
        timeout-minutes: 45
        run: ./gradlew :app:bundleGeneralNightly --info
        env:
          FDROID: "false"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          VPNLIB_SENTRY_DSN: ${{ secrets.VPND_SENTRY_DSN }}
          VPNLIB_DEBUG_SYMBOLS_DIR: ${{ github.workspace }}/${{ env.DEBUG_SYMBOLS_DIR_ANDROID }}

      - name: Build Fdroid Release Apk
        # F-Droid rebuilds without VPNLIB_SENTRY_DSN; baking it changes libnym_vpn_lib.so.
        if: ${{ env.BUILD_FLAVOR == 'fdroid' && env.BUILD_TYPE == 'release' && env.BUILD_FORMAT == 'apk' }}
        timeout-minutes: 45
        run: ./gradlew :app:assembleFdroidRelease --info
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Build Fdroid Release Bundle
        if: ${{ env.BUILD_FLAVOR == 'fdroid' && env.BUILD_TYPE == 'release' && env.BUILD_FORMAT == 'aab' }}
        timeout-minutes: 45
        run: ./gradlew :app:bundleFdroidRelease --info
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Build Fdroid Prerelease Apk
        if: ${{ env.BUILD_FLAVOR == 'fdroid' && env.BUILD_TYPE == 'prerelease' && env.BUILD_FORMAT == 'apk' }}
        timeout-minutes: 45
        run: ./gradlew :app:assembleFdroidPrerelease --info
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Build Fdroid Prerelease Bundle
        if: ${{ env.BUILD_FLAVOR == 'fdroid' && env.BUILD_TYPE == 'prerelease' && env.BUILD_FORMAT == 'aab' }}
        timeout-minutes: 45
        run: ./gradlew :app:bundleFdroidPrerelease --info
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Build Fdroid Nightly Apk
        if: ${{ env.BUILD_FLAVOR == 'fdroid' && env.BUILD_TYPE == 'nightly' && env.BUILD_FORMAT == 'apk' }}
        timeout-minutes: 45
        run: ./gradlew :app:assembleFdroidNightly --info
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Build Fdroid Nightly Bundle
        if: ${{ env.BUILD_FLAVOR == 'fdroid' && env.BUILD_TYPE == 'nightly' && env.BUILD_FORMAT == 'aab' }}
        timeout-minutes: 45
        run: ./gradlew :app:bundleFdroidNightly --info
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Build Debug Apk
        if: ${{ env.BUILD_FLAVOR == 'fdroid' && env.BUILD_TYPE == 'debug' && env.BUILD_FORMAT == 'apk' }}
        timeout-minutes: 45
        run: ./gradlew :app:assembleFdroidDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Build Debug Bundle
        if: ${{ env.BUILD_FLAVOR == 'fdroid' && env.BUILD_TYPE == 'debug' && env.BUILD_FORMAT == 'aab' }}
        timeout-minutes: 45
        run: ./gradlew :app:bundleFdroidDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Get output path
        id: output-path
        working-directory: ${{ github.workspace }}
        run: |
            OUT_DIR="nym-vpn-android/app/build/outputs"

            case "${BUILD_FLAVOR}-${BUILD_FORMAT}" in
              fdroid-apk) EXT='apk' ;;
              fdroid-aab) EXT='aab' ;;
              play-aab) EXT='aab' ;;
              *)
                echo "::error:: Unsupported build flavor/format: ${BUILD_FLAVOR}-${BUILD_FORMAT}"
                exit 1
                ;;
            esac

            ARTIFACT_FILE=$(find "$OUT_DIR" -name "*.$EXT" -type f | head -1)
            if [ -z "$ARTIFACT_FILE" ]; then
              echo "::error:: No artifact found"
              exit 1
            else
              echo "::notice:: Found artifact: $ARTIFACT_FILE"
            fi

            ARTIFACT_NAME=$(basename $ARTIFACT_FILE)

            echo "artifact_path=$ARTIFACT_FILE" >> $GITHUB_OUTPUT
            echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      # The Android Gradle plugin only warns when it can't strip a library.
      - name: Check native libraries are stripped
        working-directory: ${{ github.workspace }}
        env:
          ARTIFACT_PATH: ${{ steps.output-path.outputs.artifact_path }}
        run: |
          set -euo pipefail
          case "$ARTIFACT_PATH" in
            *.aab) libs_prefix=base/lib ;;
            *) libs_prefix=lib ;;
          esac
          libs_dir="$(mktemp -d)"
          unzip -q "$ARTIFACT_PATH" "$libs_prefix/*.so" -d "$libs_dir" || [ $? -eq 11 ]
          libs="$(find "$libs_dir" -name '*.so' | sort)"
          if [ -z "$libs" ]; then
            echo "::error::No native libraries found in $ARTIFACT_PATH"
            exit 1
          fi
          status=0
          while IFS= read -r lib; do
            sections="$("$NDK_TOOLCHAIN_DIR/llvm-readelf" -SW "$lib")"
            if grep -qE ' \.(debug_|symtab )' <<< "$sections"; then
              echo "::error::${lib#"$libs_dir"/} is not stripped"
              status=1
            fi
          done <<< "$libs"
          exit "$status"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.UPLOAD_DIR_ANDROID }}
          path: ${{ steps.output-path.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload debug symbols
        if: ${{ env.BUILD_FLAVOR == 'play' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.DEBUG_SYMBOLS_DIR_ANDROID }}
          path: ${{ github.workspace }}/${{ env.DEBUG_SYMBOLS_DIR_ANDROID }}
          if-no-files-found: error
          retention-days: 1
