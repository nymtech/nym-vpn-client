name: pr-validation

on:
  pull_request:
    branches:
      - develop
      - "release/**"
    paths-ignore:
      - "docs/**"
    types:
      - labeled
      - unlabeled
      - opened
      - reopened
      - synchronize
      - edited
      - milestoned
      - demilestoned

permissions:
  contents: read

env:
  LABELS: ${{ join( github.event.pull_request.labels.*.name, ' ' ) }}

jobs:
  check-milestone:
    name: Check Milestone
    runs-on: arc-linux-latest
    steps:
      - if: github.event.pull_request.milestone == null && contains( env.LABELS, 'no-milestone' ) == false
        run: exit 1
