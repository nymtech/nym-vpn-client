name: release-all-platforms

on:
  workflow_call:
    inputs:
      release_type:
        description: "Release type (release, prerelease, nightly)"
        type: string
        required: true
      version:
        description: "Orchestrated app version to embed (empty = use Constants.kt as before)"
        type: string
        required: true
      play:
        description: "Google Play"
        type: boolean
        default: false
      fdroid:
        description: "F-Droid"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-android-fdroid:
    if: ${{ inputs.fdroid == 'true' }}
    uses: ./.github/workflows/build-nym-vpn-android.yml
    secrets: inherit
    with:
      build_type: ${{ inputs.release_type == '' && 'nightly' || inputs.release_type }}
      build_format: apk
      build_flavor: fdroid
      version: ${{ inputs.version }}

  build-android-play:
    if: ${{ inputs.play == 'true' }}
    uses: ./.github/workflows/build-nym-vpn-android.yml
    secrets: inherit
    with:
      build_type: ${{ inputs.release_type == '' && 'nightly' || inputs.release_type }}
      build_format: aab
      build_flavor: play
      version: ${{ inputs.version }}
