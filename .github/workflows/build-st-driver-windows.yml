name: build-st-driver-windows
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/build-st-driver-windows.yml"
      - "nym-windows/**"
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

# https://github.com/actions/runner-images/issues/1794#issuecomment-707217728

jobs:
  build:
    runs-on: "custom-windows-11"

    steps:
      - name: Cleanup working directory
        shell: bash
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3

      - name: Install GNU make
        run: |
          winget list GnuWin32.Make || winget install --disable-interactivity --accept-source-agreements --id GnuWin32.Make
          echo "${env:ProgramFiles(x86)}\GnuWin32\bin" | Out-File -FilePath "$env:GITHUB_PATH" -Append

      - name: Setup VS dev shell
        uses: humbletim/vsdevenv-shell@503210b7b39a7405e534ea93c36a733b93f01087

      - name: Build st-driver
        shell: vsdevenv x64 pwsh {0}
        working-directory: nym-vpn-core
        run: make -f Windows.mk st-driver CPU_ARCH=AMD64 RELEASE=1 PWSH=1

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: st-driver
          path: |
            ${{ github.workspace }}/build/st-driver/x64-Release/nymvpn-split-tunnel.sys
            ${{ github.workspace }}/build/st-driver/x64-Release/nymvpn-split-tunnel.inf
            ${{ github.workspace }}/build/st-driver/x64-Release/nymvpn-split-tunnel.cat
          if-no-files-found: error
          retention-days: 1
